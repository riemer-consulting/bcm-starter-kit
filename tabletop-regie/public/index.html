<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BCM Tabletop-Regie</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="container">
  <h1>BCM Tabletop-Regie</h1>
  <p class="muted">Lokale Regie-App für BCM-Tabletop-Übungen. Läuft nur auf diesem Rechner, keine Cloud, keine externen Server außer dem von dir eingetragenen SMTP-Server.</p>
  <div class="card">
    <h2 id="scenario-title">Szenario wird geladen…</h2>
    <p class="muted" id="scenario-subtitle"></p>
  </div>
  <div class="row">
    <a href="setup.html"><button title="Teilnehmer, Rollen, SMTP-Server und Branding eintragen — erster Schritt vor jeder Übung.">1. Setup: Teilnehmer, Rollen, Einstellungen</button></a>
    <a href="stage.html" target="_blank"><button class="secondary" title="Öffentliche Ansicht mit den Lagekarten — für Beamer/TV oder Bildschirmfreigabe gedacht.">2. Bühne öffnen (für Beamer/TV – teilbar)</button></a>
    <a href="moderator.html" target="_blank"><button class="secondary" title="Steuerung für dich als Moderator:in — Timer, Zeitsprünge, Bewertung, Urkunden. Enthält vertrauliche Inhalte, nicht teilen!">3. Moderation öffnen (nicht teilen)</button></a>
    <a href="ablauf.html" target="_blank"><button class="secondary" title="Begrüßung, Spielregeln, bisher gezeigte Lagekarten zum Nachlesen — und eine kurze Hilfe, wie alles funktioniert.">4. Ablauf &amp; Hilfe</button></a>
  </div>
</div>
<script>
fetch('/api/scenario-meta').then(r=>r.json()).then(m=>{
  document.getElementById('scenario-title').textContent = m.title;
  document.getElementById('scenario-subtitle').textContent = m.subtitle + ' — ' + m.lagekartenCount + ' Lagekarten, ' + m.sonderlagekartenCount + ' Sonderlagekarten, ' + m.bonuskartenCount + ' Bonuskarten.';
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bühne – BCM Tabletop-Regie</title>
<style>
  :root { --bg:#05070b; --panel:#0e141d; --border:#263142; --text:#f0f4f9; --muted:#8a97a8; --accent:#3b82c4; --progress-track:#1a2330; }
  :root[data-theme="light"] { --bg:#f3f5f8; --panel:#ffffff; --border:#d5dbe3; --text:#1a2233; --muted:#5c6b7d; --accent:#2f6ba3; --progress-track:#dde3ea; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Arial,sans-serif; height:100vh; overflow:hidden; transition: background .25s, color .25s; }
  .theme-toggle { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none; }
  .theme-toggle .track { width:40px; height:20px; border-radius:10px; background:var(--border); position:relative; transition: background .2s; }
  .theme-toggle .knob { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--accent); transition: left .2s; }
  :root[data-theme="light"] .theme-toggle .knob { left:22px; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:18px 36px; border-bottom:1px solid var(--border); }
  .brand { font-size:20px; font-weight:700; letter-spacing:1px; }
  .clock { text-align:right; }
  .clock .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; }
  .clock .time { font-size:34px; font-weight:800; font-variant-numeric: tabular-nums; }
  .main { display:flex; height: calc(100vh - 88px); min-height:0; }
  .side { width: 300px; flex-shrink:0; border-right:1px solid var(--border); padding: 24px; overflow-y:auto; }
  .side .block { margin-bottom: 28px; }
  .side .block .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
  .side .block .v { font-size:22px; font-weight:700; }
  .progress-track { background:var(--progress-track); border-radius:6px; height:10px; overflow:hidden; margin-top:10px; }
  .progress-fill { background:var(--accent); height:100%; transition:width 1s linear; }
  .content { flex:1; min-width:0; min-height:0; padding: clamp(20px,3vh,48px) clamp(24px,4vw,64px); display:flex; flex-direction:column; justify-content:flex-start; overflow-y:auto; }
  .simzeit { font-size:clamp(15px,1.6vw,20px); color: var(--accent); font-weight:700; letter-spacing:1px; margin-bottom: 8px; flex-shrink:0; }
  .titel { font-size:clamp(28px,4.2vw,52px); font-weight:800; margin: 0 0 clamp(12px,2vh,24px); line-height:1.1; flex-shrink:0; }
  .text { font-size:clamp(16px,1.7vw,22px); line-height:1.5; max-width: 900px; margin-bottom: clamp(12px,2vh,24px); flex-shrink:0; }
  .krisen { background: rgba(217,83,79,.12); border-left:4px solid #d9534f; padding: 12px 20px; font-size:clamp(14px,1.4vw,19px); margin-bottom: clamp(12px,2vh,24px); max-width:820px; flex-shrink:0; }
  .aufgabe { font-size:clamp(14px,1.3vw,18px); color: var(--muted); flex-shrink:0; }
  .aufgabe li { margin-bottom: 6px; }
  .ueberraschung-kicker { display:inline-block; background:#d9534f; color:#fff; font-weight:800; letter-spacing:2px; text-transform:uppercase; font-size:clamp(13px,1.3vw,17px); padding:6px 14px; border-radius:6px; margin-bottom:12px; align-self:flex-start; flex-shrink:0; animation: blink 1.2s ease-in-out 3; }
  @keyframes blink { 50% { opacity:.35; } }
  .unterbrechung { border:3px solid #d9534f; border-radius:12px; padding:14px 22px; margin-bottom:clamp(12px,2vh,24px); max-width:820px; flex-shrink:0; }
  .unterbrechung .uhr { font-size:clamp(34px,5vw,64px); font-weight:800; font-variant-numeric:tabular-nums; }
  .idle, .ended { display:flex; align-items:center; justify-content:center; min-height:100%; flex-direction:column; text-align:center; }
  .idle h1, .ended h1 { font-size: clamp(28px,4vw,46px); }
  .sound-unlock { position:fixed; inset:0; background:rgba(5,7,11,.92); z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px; }
  .sound-unlock button { font-size:20px; padding:16px 32px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  .sound-unlock p { color:var(--muted); font-size:14px; }
  .finale { display:flex; flex-direction:column; min-height:100%; }
  .fin-center { flex:1; display:flex; flex-direction:column; justify-content:center; max-width:1000px; }
  .fin-kicker { font-size:clamp(13px,1.3vw,17px); color:var(--accent); font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; }
  .fin-titel { font-size:clamp(30px,4.6vw,60px); font-weight:800; line-height:1.1; margin-bottom:24px; }
  .fin-h { font-size:clamp(20px,2.4vw,30px); font-weight:800; margin-bottom:18px; }
  .fin-text { font-size:clamp(17px,1.9vw,25px); line-height:1.5; color:var(--muted); }
  .fin-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px 22px; }
  .fin-item { display:flex; gap:18px; align-items:baseline; padding:12px 16px; border-left:4px solid var(--border); background:var(--panel); border-radius:6px; }
  .fin-item.neu { border-left-color:#d9534f; animation: finIn .6s ease-out; }
  .fin-zahl { font-size:clamp(26px,3vw,42px); font-weight:800; color:#d9534f; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fin-itemtext { font-size:clamp(14px,1.3vw,18px); line-height:1.4; }
  .fin-cols { display:grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap:32px; align-items:start; }
  .fin-stat { padding:12px 0 14px; border-bottom:1px solid var(--border); }
  .fin-stat .k { font-size:clamp(13px,1.2vw,16px); color:var(--muted); line-height:1.35; margin-bottom:4px; }
  .fin-stat .v { font-size:clamp(22px,2.6vw,36px); font-weight:800; font-variant-numeric:tabular-nums; }
  .fin-stat .v.rot { color:#d9534f; }
  .fin-stat.eigen { border-bottom:3px solid #d9534f; animation: finIn .8s ease-out; }
  .fin-stat.eigen .v { font-size:clamp(30px,3.6vw,52px); }
  @media (max-width: 1100px) { .fin-cols { grid-template-columns: 1fr; } }
  .fin-tabelle { width:100%; border-collapse:collapse; font-size:clamp(14px,1.3vw,18px); }
  .fin-tabelle td { padding:7px 6px; border-bottom:1px solid var(--border); }
  .fin-tabelle tr.neu td { color:#d9534f; font-weight:700; animation: finIn .6s ease-out; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fin-tag { font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:1px 5px; margin-left:6px; white-space:nowrap; }
  .fin-hebel { margin-top:18px; padding:14px 18px; background:rgba(59,130,196,.12); border-left:4px solid var(--accent); font-size:clamp(14px,1.3vw,18px); line-height:1.45; }
  .fin-aha { display:flex; gap:32px; align-items:center; margin:18px 0 26px; animation: finIn .8s ease-out; }
  .fin-aha-zahl { font-size:clamp(40px,6vw,88px); font-weight:800; color:#d9534f; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .fin-aha-text { font-size:clamp(17px,1.9vw,26px); line-height:1.4; max-width:640px; }
  .fin-fazit { font-size:clamp(26px,3.6vw,48px); font-weight:800; line-height:1.25; animation: finIn 1s ease-out; }
  .fin-hinweis { margin-top:auto; padding-top:18px; font-size:12px; color:var(--muted); }
  .board .lane { margin-bottom:6px; }
  .board .lane-k { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:5px; }
  .board .lane-k span { text-transform:none; letter-spacing:0; }
  .board .pfeil { text-align:center; color:var(--muted); font-size:12px; margin:2px 0 8px; letter-spacing:1px; }
  .board .tiles { display:grid; grid-template-columns:1fr; gap:4px; }
  .side.mit-brett .block { margin-bottom:14px; }
  .side.mit-brett .block .v { font-size:18px; }
  .tile { border:1px solid var(--border); border-radius:6px; padding:5px 8px; background:var(--panel); transition:opacity .3s, border-color .3s; min-width:0; }
  .board.lage .tile { opacity:.45; }
  .board.lage .tile.gefordert, .board.lage .tile.info { opacity:1; }
  .tile.gefordert { border:2px solid var(--accent); box-shadow:0 0 0 3px rgba(59,130,196,.22); padding:4px 7px; }
  .tile .r { font-weight:700; font-size:13px; line-height:1.25; }
  .tile .n { font-size:12px; color:var(--muted); line-height:1.35; }
  .board.eng .tile { padding:3px 7px; }
  .board.eng .tile.gefordert { padding:2px 6px; }
  .board.eng .tile .r { font-size:12px; }
  .board.eng .tile .n { font-size:11px; }
  .tile .tag { margin-left:4px; vertical-align:1px; font-size:10px; font-weight:700; border-radius:3px; padding:1px 5px; text-transform:uppercase; letter-spacing:.5px; }
  .tile .tag.zug { background:var(--accent); color:#fff; }
  .tile .tag.info { background:#e0a832; color:#1a1300; }
  .board .fehlt { font-size:12px; color:#e0a832; margin:4px 0 8px; line-height:1.4; }
  @keyframes finIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
</style>
</head>
<body>
  <div class="sound-unlock" id="sound-unlock">
    <button id="btn-enable-sound" title="Browser blockieren Ton ohne vorherigen Klick — danach läuft alles automatisch mit.">🔊 Ton aktivieren &amp; Übung anzeigen</button>
    <button id="btn-no-sound" style="background:transparent;color:var(--muted);border-color:var(--border);font-size:15px;padding:10px 22px;" title="Die Bühne zeigt alles, spielt aber keinen Ton ab – z. B. wenn im Raum kein Ton möglich ist.">Ohne Ton anzeigen</button>
    <p>Browser blockieren Ton ohne Klick. Einmal klicken, danach läuft alles automatisch. Die Moderation kann den Ton jederzeit stummschalten.</p>
  </div>
  <div class="top">
    <div class="brand" id="company-brand"><img id="company-logo" style="display:none;height:44px;vertical-align:middle;margin-right:10px;"><span id="company-name">BCM Tabletop-Regie</span></div>
    <div style="display:flex;align-items:center;gap:22px;">
      <label class="theme-toggle" id="theme-toggle" title="Hell/Dunkel umschalten">
        <span>Hell</span><div class="track"><div class="knob"></div></div><span>Dunkel</span>
      </label>
      <div class="clock">
        <div class="label" id="status-label">Krisenzeit</div>
        <div class="time" id="clock-time">00:00</div>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="side">
      <div class="block"><div class="k">Fortschritt</div><div class="v" id="progress-label">0 / 0</div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div></div>
      <div class="block"><div class="k">Übungszeit</div><div class="v" id="elapsed-label">0 Min.</div></div>
      <div class="block muted" id="company-facts" style="font-size:13px;color:var(--muted);line-height:1.5;"></div>
      <div class="block board" id="board" style="display:none;"><div class="k">Wer ist am Zug?</div><div id="board-body"></div></div>
    </div>
    <div class="content" id="content">
      <div class="idle"><h1>Bereit.</h1><p class="muted">Die Übung startet im Setup.</p></div>
    </div>
  </div>
  <button id="sound-elsewhere" style="display:none;position:fixed;right:16px;bottom:16px;z-index:60;font-size:13px;padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;" title="Ton läuft gerade in einem anderen Bühnenfenster. Klicken, um den Ton hier abzuspielen (das andere Fenster wird dann stumm).">Ton läuft in einem anderen Fenster – hier abspielen</button>
  <audio id="ambient-audio" loop></audio>
  <audio id="event-audio"></audio>
<script src="regie-fetch.js"></script>
<script src="stage.js"></script>
</body>
</html>

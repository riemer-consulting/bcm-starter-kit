      '<h3>Für Weitergabe bereinigen</h3>'+
      '<p class="small muted"><b>Die HTML-Datei selbst enthält keine Eingaben</b> — Ihre Daten liegen im lokalen Speicher (\u201eLocalStorage\u201c) dieses Browsers'+(currentFileName?' bzw. in der verknüpften Datei „'+escapeHtml(currentFileName)+'"':'')+'. Wer die HTML-Datei von Ihnen erhält, bekommt Ihre Eingaben also grundsätzlich nicht automatisch mit. Falls Sie diesen Rechner auch anderweitig nutzen oder zusätzlich sichergehen möchten, können Sie den lokalen Stand hier sichern und/oder vollständig bereinigen (löst dabei auch die Datei-Verknüpfung). Beachten Sie: exportierte JSON- und PDF-Dateien sind eigenständige Dateien und müssen separat geschützt werden — nutzen Sie dafür bei Bedarf den verschlüsselten JSON-Export in den Branding-Einstellungen.</p>'+
      '<div class="rowcard" style="cursor:pointer;" onclick="App.handoffExportThenClean()"><b>Erst als JSON sichern, dann bereinigen</b><div class="small muted">Lädt den aktuellen Stand als JSON-Datei herunter und leert anschließend den lokalen Speicher vollständig.</div></div>'+
      '<div class="rowcard" style="cursor:pointer;" onclick="App.handoffCleanOnly()"><b>Nur bereinigen</b><div class="small muted">Leert den lokalen Speicher sofort vollständig, ohne vorherige Sicherung. Nicht rückgängig zu machen.</div></div>'+
      '<div class="modal-actions"><button class="btn" onclick="closeModal()">Abbrechen</button></div>'
    );
  },
  /** Exportiert den aktuellen Stand als JSON und bereinigt danach den lokalen Datenstand für die Weitergabe der Datei. @returns {void} */
  handoffExportThenClean(){
    App.exportJson();
    closeModal();
    setTimeout(()=>{ App.handoffCleanOnly(true); }, 500); // kurze Pause, damit der Download sicher startet
  },
  /** Bereinigt den lokalen Datenstand vollständig für die Weitergabe der Datei (destruktiv, mit Bestätigung und Backup-Absicherung). @param {boolean} [skipReopenModal] @returns {void} */
  handoffCleanOnly(skipReopenModal){
    const sure = prompt('Der lokale Datenstand wird jetzt vollständig gelöscht (auch die Versionshistorie, auch die Datei-Verknüpfung). Zum Bestätigen "LÖSCHEN" eingeben:');
    if(sure !== 'LÖSCHEN'){
      toast('Abgebrochen — es wurde nichts gelöscht.');
      return;
    }
    if(!backupOrConfirmDestructive('cleanup', 'Für Weitergabe bereinigen')) return;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(TERMS_ACK_KEY);
    STATE = defaultState();
    currentFileHandle = null; currentFileName = null;
    idbClearHandle();
    closeModal();
    render();
    renderTermsGate();
    toast('Lokaler Stand wurde vollständig bereinigt. Die Datei ist bereit zur Weitergabe.');
  },
  /** Löst die Datei-Verknüpfung, ohne Daten zu löschen (Autosave läuft danach nur noch in den Browser). @returns {void} */
  disconnectFile(){
    currentFileHandle = null; currentFileName = null;
    SAVE_STATUS.file = 'disconnected';
    idbClearHandle();
    render();
    toast('Datei-Verknüpfung gelöst. Änderungen werden wieder nur im Browser gespeichert.');
  },

  /** Öffnet die GF-Ansicht (Vollbild-Overlay). @returns {void} */
  openGfMode(){ renderGfOverlay(); },

  showKpiList(kind){
    let title, items;
    if(kind==='criticalProcesses'){
      title = 'Kritische Prozesse';
      items = STATE.processes.filter(isProcessKritisch).map(p=>p.steckbrief.name||'(ohne Namen)');
    } else if(kind==='timeConflicts'){
      title = 'Prozesse mit Zeitwertkonflikten';
      items = STATE.processes.filter(p=>timePlausibility(p).findings.some(f=>f.type==='bad')).map(p=>p.steckbrief.name||'(ohne Namen)');
    } else {
      title = 'Liste'; items = [];
    }
    openModal('<h3>'+escapeHtml(title)+'</h3>'+

      '<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Schließen</button></div>');
  },
  /** Schließt ein aktives Vollbild-Overlay (GF-Ansicht oder Workshop-Modus). @returns {void} */
  closeOverlay(){ const el=document.getElementById('overlay-root'); if(el) el.remove(); },
  /** Startet den Workshop-Modus für den ersten vorhandenen Prozess. @returns {void} */
  openWorkshopMode(){
    if(STATE.processes.length===0){ toast('Bitte zuerst eine Prozessakte anlegen.'); return; }
    App.workshopProcessId = STATE.processes[0].id;
    App.workshopStep = 0;
    renderWorkshopOverlay();
  },
};

/** Rendert eine einzelne KPI-Kachel im Dashboard. @param {string|number} num @param {string} label @param {string} [tone] 'bad'|'warn'|'ok' für die Farbe. @returns {string} HTML */
function statTile(num, label, tone){
  const color = tone==='bad' ? 'var(--bad)' : tone==='warn' ? 'var(--warn)' : tone==='ok' ? 'var(--ok)' : 'var(--ink)';
  return '<div class="stat-tile"><div class="stat-num" style="color:'+color+'">'+num+'</div><div class="stat-label">'+label+'</div></div>';
}
/** Rendert eine Schnellzugriffs-Kachel im Dashboard. @param {string} title @param {string} desc @param {string} action onclick-JS als String. @returns {string} HTML */
function quickAction(title, desc, action){
  return '<div class="rowcard" style="cursor:pointer;background:var(--surface);" onclick="'+action+'">'+
    '<div style="font-weight:700;font-size:13px;margin-bottom:4px;">'+title+'</div>'+
    '<div class="small muted">'+desc+'</div></div>';
}
/** Rendert einen einheitlichen Leerzustand-Hinweis. @param {string} title @param {string} sub Beschreibungstext. @returns {string} HTML */
function emptyState(title, sub){
  return '<div class="empty-state"><div class="ic">◌</div><div style="font-weight:700;color:var(--ink-soft);margin-bottom:4px;">'+title+'</div><div class="small">'+sub+'</div></div>';
}
/** Rendert ein Farbbadge für hoch/mittel/niedrig-Werte (Kritikalität, Priorität, Aufwand). @param {string} level @returns {string} HTML */
function kritikalitaetBadge(level){
  const map = {hoch:'b-bad', mittel:'b-warn', niedrig:'b-ok'};
  const labelMap = {hoch:'Hoch', mittel:'Mittel', niedrig:'Niedrig'};
  return '<span class="badge '+(map[level]||'b-neutral')+'">'+(labelMap[level]||level)+'</span>';
}
/** Rendert ein Farbbadge für den Maßnahmen-Status. @param {string} status @returns {string} HTML */
function statusBadge(status){
  const map = {offen:'b-bad', in_arbeit:'b-warn', erledigt:'b-ok', zurueckgestellt:'b-neutral'};
  const labelMap = {offen:'Offen', in_arbeit:'In Arbeit', erledigt:'Erledigt', zurueckgestellt:'Zurückgestellt'};
  return '<span class="badge '+(map[status]||'b-neutral')+'">'+(labelMap[status]||status)+'</span>';
}
/** Rendert das Qualitäts-Badge einer Maßnahme (basierend auf validateMassnahme). @param {object} m @returns {string} HTML */
function massnahmeQualityBadge(m){
  const q = massnahmeQuality(m);
  const map = {ok:['b-ok','OK'], warn:['b-warn','Warnung'], bad:['b-bad','Kritisch']};
  const [cls,label] = map[q];
  return '<span class="badge '+cls+'">'+label+'</span>';
}
/** Rendert einen kleinen farbigen Ampelpunkt (kompakte Alternative zu ampelBadge). @param {string} status 'gruen'|'gelb'|'rot' @returns {string} HTML */
function ampelDot(status){
  return '<span class="dot dot-'+(status==='gruen'?'ok':status==='rot'?'bad':'warn')+'"></span>';
}

/** Rendert die Detailansicht einer Prozessakte (Tab-Leiste + aktiver Tab-Inhalt). @param {string} id Prozess-ID. @returns {string} HTML */
function viewProcessDetail(id){
  const p = getProcess(id);
  if(!p) return emptyState('Prozess nicht gefunden', 'Möglicherweise wurde dieser Prozess gelöscht.');
  const tab = STATE.ui.processTab || 'steckbrief';
  const prog = processProgress(p);

  let html = '<div class="spread" style="margin-bottom:14px;">';
  html += '<div><div class="kicker">'+escapeHtml(p.steckbrief.fachbereich||'Kein Fachbereich')+'</div>'+
    '<h1 style="font-size:24px;">'+escapeHtml(p.steckbrief.name||'Unbenannter Prozess')+'</h1></div>';
  html += '<div class="flexrow">'+kritikalitaetBadge(p.steckbrief.kritikalitaet)+
    '<button class="btn btn-sm" onclick="App.duplicateProcess(\''+safeJsString(p.id)+'\')">Duplizieren als neue Prozessakte</button>'+
    '<button class="btn btn-sm btn-danger" onclick="App.deleteProcess(\''+safeJsString(p.id)+'\')">Löschen</button></div>';
  html += '</div>';

  html += '<div class="rail" style="margin-bottom:18px;height:6px;"><span style="width:'+Math.round(prog.overall*100)+'%;background:'+(prog.overall>=.9?'var(--ok)':prog.overall>=.4?'var(--warn)':'var(--bad)')+'"></span></div>';

  html += '<div class="tabbar">';
  PROCESS_TABS.forEach(t=>{
    const sectionProg = Math.round((prog.sections[t.key]||0)*100);
    html += '<button class="tabbtn'+(tab===t.key?' active':'')+'" onclick="App.setProcessTab(\''+t.key+'\')">'+t.label+
      (sectionProg<100 ? ' <span class="small" style="opacity:.55;">'+sectionProg+'%</span>' : ' ✓') +
      '</button>';
  });
  html += '</div>';

  const renderers = {
    steckbrief: tabSteckbrief, sixty: tabSixty, bia: tabBia, minfaehigkeit: tabMinfaehigkeit,
    ressourcen: tabRessourcen, notbetrieb: tabNotbetrieb, resilienz: tabResilienz, massnahmen: tabMassnahmenTab
  };
  html += (renderers[tab]||tabSteckbrief)(p);
  return html;
}

/** Zentraler Formularfeld-Renderer (text/textarea/select/date) inkl. Pflichtfeld-Markierung und Änderungs-Handler. @param {string} path Punktpfad in STATE. @param {*} value @param {string} label @param {object} [opts] @returns {string} HTML */
function fieldInput(path, value, label, opts){
  opts = opts || {};
  const required = opts.required;
  const empty = required && String(value||'').trim()==='';
  const id = 'f_'+path.replace(/[^a-z0-9]/gi,'_');
  let inner;
  if(opts.type==='textarea'){
    inner = '<textarea id="'+id+'" oninput="App.setField(\''+path+'\', this.value)" placeholder="'+escapeHtml(opts.placeholder||'')+'">'+escapeHtml(value)+'</textarea>';
  } else if(opts.type==='select'){
    inner = '<select id="'+id+'" onchange="App.setField(\''+path+'\', this.value)'+(opts.rerender?'; render();':'')+'">'+
      opts.options.map(o=>{
        const ov = typeof o==='object'?o.value:o; const ol = typeof o==='object'?o.label:o;
        return '<option value="'+escapeHtml(ov)+'"'+(value===ov?' selected':'')+'>'+escapeHtml(ol)+'</option>';
      }).join('')+'</select>';
  } else {
    const blurRerender = opts.onblurRerender ? ' onblur="render()"' : '';
    inner = '<input type="'+(opts.type||'text')+'" id="'+id+'" value="'+escapeHtml(value)+'" placeholder="'+escapeHtml(opts.placeholder||'')+'" oninput="App.setField(\''+path+'\', this.value)"'+blurRerender+'>';
  }
  return '<div class="field'+(empty?' empty':'')+'"><label>'+label+(required?'<span class="req">*</span>':'')+'</label>'+inner+
    (opts.hint?'<div class="hint">'+opts.hint+'</div>':'')+'</div>';
}

/** P11: Karte "Strukturierte Abhängigkeiten" mit Selbstreferenz-/Duplikatsschutz und Kreislauf-Hinweis. @param {object} process @returns {string} HTML */
function dependenciesCardHtml(process){
  const others = STATE.processes.filter(p=>p.id!==process.id);
  let html = '<div class="card"><div class="card-head"><div class="card-title">Strukturierte Abhängigkeiten</div></div>';
  html += '<div class="card-help">Beziehungen werden über die Prozess-ID gespeichert — ein Umbenennen zerstört die Beziehung nicht. Die Freitextfelder oben bleiben als ergänzende Beschreibung erhalten.</div>';

  if(others.length===0){
    html += '<div class="small muted">Es gibt noch keine weiteren Prozesse, mit denen sich dieser Prozess verknüpfen ließe.</div>';
  } else {
    (process.dependencies||[]).forEach(dep=>{
      const target = getProcess(dep.processId);
      html += '<div class="rowcard"><div class="rowcard-head">';
      html += '<b class="small">'+(target ? escapeHtml(target.steckbrief.name||'(ohne Namen)') : '⚠ Prozess nicht mehr vorhanden ('+escapeHtml(dep.processId)+')')+'</b>';
      html += '<button class="row-del" onclick="App.removeDependency(\''+safeJsString(process.id)+'\',\''+safeJsString(dep.id)+'\')">Entfernen</button>';
      html += '</div>';
      html += '<div class="grid grid-3">';
      html += '<div class="field"><label>Richtung</label><select onchange="App.updateDependency(\''+safeJsString(process.id)+'\',\''+safeJsString(dep.id)+'\',\'type\',this.value)">'+
        [['vorgelagert','Vorgelagert (kommt vor diesem Prozess)'],['nachgelagert','Nachgelagert (kommt nach diesem Prozess)']].map(([v,l])=>'<option value="'+v+'" '+(dep.type===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';
      html += '<div class="field"><label>Kritikalität der Beziehung</label><select onchange="App.updateDependency(\''+safeJsString(process.id)+'\',\''+safeJsString(dep.id)+'\',\'criticality\',this.value)">'+
        levelOptionsHtml(dep.criticality, LEVEL_ORDER_NIEDRIG_FIRST)+'</select></div>';
      html += '<div class="field"><label>Beschreibung</label><input type="text" value="'+escapeHtml(dep.description)+'" onchange="App.updateDependency(\''+safeJsString(process.id)+'\',\''+safeJsString(dep.id)+'\',\'description\',this.value)"></div>';
      html += '</div></div>';
    });

    html += '<div class="rowcard" style="background:var(--surface);">';
    html += '<div class="grid grid-3">';
    html += '<div class="field" style="margin-bottom:0;"><label>Prozess verknüpfen</label><select id="dep-target-'+process.id+'"><option value="">— auswählen —</option>'+
      others.map(o=>'<option value="'+o.id+'">'+escapeHtml(o.steckbrief.name||'(ohne Namen)')+'</option>').join('')+'</select></div>';
    html += '<div class="field" style="margin-bottom:0;"><label>Richtung</label><select id="dep-type-'+process.id+'">'+
      '<option value="vorgelagert">Vorgelagert</option><option value="nachgelagert">Nachgelagert</option></select></div>';
    html += '<div style="display:flex;align-items:flex-end;"><button class="btn btn-sm btn-primary" onclick="App.addDependency(\''+safeJsString(process.id)+'\')">Hinzufügen</button></div>';
    html += '</div></div>';
  }

  const cycles = findDependencyCycles().filter(c=>c.includes(process.steckbrief.name));
  if(cycles.length>0){
    html += '<div class="small" style="margin-top:10px;color:var(--warn);">⚠ Kreislauf erkannt: '+cycles.map(c=>c.map(escapeHtml).join(' → ')).join('; ')+'</div>';
  }
  html += '</div>';
  return html;
}

/** Rendert den Steckbrief-Tab einer Prozessakte (Grunddaten, Kritikalität, Zeitwerte, Abhängigkeiten). @param {object} p @returns {string} HTML */
function tabSteckbrief(p){
  const s = p.steckbrief, base = 'processes.'+STATE.processes.indexOf(p)+'.steckbrief.';
  let html = '<div class="card"><div class="card-help">Beschreiben Sie den Prozess so, dass ein neuer Geschäftsführer versteht, warum dieser Prozess für das Unternehmen relevant ist.</div>';
  html += '<div class="grid grid-2">';

  html += fieldInput(base+'fachbereich', s.fachbereich, 'Fachbereich', {required:true});
  html += fieldInput(base+'verantwortlicher', s.verantwortlicher, 'Prozessverantwortlicher', {required:true});
  html += fieldInput(base+'stellvertretung', s.stellvertretung, 'Stellvertretung');
  html += '</div>';
  html += fieldInput(base+'ziel', s.ziel, 'Prozessziel', {type:'textarea', required:true});
  html += fieldInput(base+'nutzen', s.nutzen, 'Nutzen für das Unternehmen', {type:'textarea'});
  html += fieldInput(base+'ergebnis', s.ergebnis, 'Ergebnis des Prozesses', {type:'textarea'});
  html += '<div class="grid grid-2">';
  html += fieldInput(base+'interneKunden', s.interneKunden, 'Interne Kunden');
  html += fieldInput(base+'externeKunden', s.externeKunden, 'Externe Kunden');
  html += fieldInput(base+'vorgelagert', s.vorgelagert, 'Vorgelagerte Prozesse (Freitext, ergänzend)');
  html += fieldInput(base+'nachgelagert', s.nachgelagert, 'Nachgelagerte Prozesse (Freitext, ergänzend)');
  html += '</div></div>';

  html += dependenciesCardHtml(p);

  html += '<div class="card"><div class="card-title" style="margin-bottom:14px;">Kritikalität & Zeitwerte</div>';
  html += '<div class="grid grid-4">';
  html += fieldInput(base+'kritikalitaet', s.kritikalitaet, 'Kritikalität', {type:'select', required:true, rerender:true,
    options:[{value:'hoch',label:'Hoch'},{value:'mittel',label:'Mittel'},{value:'niedrig',label:'Niedrig'}]});
  html += fieldInput(base+'mtaWert', s.mtaWert, 'MTA – Zeitwert', {required:true, placeholder:'z. B. 24', onblurRerender:true});
  html += fieldInput(base+'mtaEinheit', s.mtaEinheit, 'MTA – Einheit', {type:'select', rerender:true,
    options:TIME_UNIT_OPTIONS});
  html += '</div>';
  html += '<div class="grid grid-2">';
  html += structuredTimeFieldHtml(base+'rto', s.rto, 'RTO (Recovery Time Objective)');
  html += structuredTimeFieldHtml(base+'rpo', s.rpo, 'RPO (Recovery Point Objective)');
  html += '</div>';
  html += fieldInput(base+'bemerkungen', s.bemerkungen, 'Bemerkungen', {type:'textarea'});
  html += plausibilityBox(timePlausibility(p));
  html += criticalityDeviationBox(p);
  html += '</div>';

/** P13: Karte "Mindestfähigkeit messbar erfassen" mit Modus-Auswahl und Qualitätshinweisen. @param {object} p Prozess. @param {number} idx Index in STATE.processes. @returns {string} HTML */
function minimumCapabilityCardHtml(p, idx){
  const mc = p.minfaehigkeit.minimumCapability || {mode:null, percentage:null, quantity:null, unit:'', period:'', description:''};
  const base = 'processes.'+idx+'.minfaehigkeit.minimumCapability.';
  let html = '<div class="card"><div class="card-title" style="margin-bottom:6px;">Mindestfähigkeit messbar erfassen</div>';
  html += '<div class="card-help">Beispiele: 30 % der normalen Aufträge · 100 Bestellungen pro Tag · zwei Standorte · fünf Kundenanfragen pro Stunde. Bitte eindeutig EINEN Modus wählen — es wird nichts automatisch ineinander umgerechnet.</div>';

  html += '<div class="field"><label>Modus</label><div class="seg" style="max-width:440px;">';
  [['percentage','Prozent'],['quantity','Menge'],['description','Nur Beschreibung']].forEach(([v,l])=>{
    html += '<button class="'+(mc.mode===v?'active':'')+'" onclick="App.setFieldAndRerender(\''+base+'mode\', \''+v+'\')">'+l+'</button>';
  });
  html += '</div></div>';

  if(mc.mode==='percentage'){
    html += '<div class="field" style="max-width:220px;"><label>Prozentsatz</label><input type="text" placeholder="z. B. 30" value="'+escapeHtml(mc.percentage===null?'':mc.percentage)+'" onchange="App.setFieldAndRerender(\''+base+'percentage\', this.value)"></div>';
  } else if(mc.mode==='quantity'){
    html += '<div class="grid grid-3">';
    html += '<div class="field"><label>Menge</label><input type="text" placeholder="z. B. 100" value="'+escapeHtml(mc.quantity===null?'':mc.quantity)+'" onchange="App.setFieldAndRerender(\''+base+'quantity\', this.value)"></div>';
    html += '<div class="field"><label>Einheit</label><input type="text" placeholder="z. B. Bestellungen, Standorte" value="'+escapeHtml(mc.unit)+'" onchange="App.setField(\''+base+'unit\', this.value)"></div>';
    html += '<div class="field"><label>Zeitraum</label><input type="text" placeholder="z. B. pro Tag, pro Stunde" value="'+escapeHtml(mc.period)+'" onchange="App.setField(\''+base+'period\', this.value)"></div>';
    html += '</div>';
  }
  html += fieldInput(base+'description', mc.description, mc.mode==='description' ? 'Beschreibung' : 'Ergänzende Beschreibung', {type:'textarea'});

  // v1.5.1-Fix 2: Altdaten/Import-Fall — Prozent UND Menge vorhanden, aber (noch) kein Modus gewählt
  const {hasPercentage, hasQuantity} = minimumCapabilityPresence(mc);
  if(mc.mode===null && hasPercentage && hasQuantity){
    html += '<div class="small" style="margin-top:8px;color:var(--bad);">⚠ Es sind sowohl eine Prozent- ('+escapeHtml(mc.percentage)+' %) als auch eine Mengenangabe ('+escapeHtml(mc.quantity)+' '+escapeHtml(mc.unit)+') aus einem älteren Stand hinterlegt. Bitte oben einen eindeutigen Modus wählen.</div>';
  }

  const gaps = minimumCapabilityQualityGaps(p);
  if(gaps.length>0){
    html += '<div style="margin-top:8px;">'+gaps.map(g=>'<div class="small" style="color:var(--warn);margin-bottom:4px;">⚠ '+escapeHtml(g)+'</div>').join('')+'</div>';
  }
  html += '</div>';
  return html;
}

/** Dezenter "(empfohlen)"-Marker an einem Feldlabel, wenn das Feld für die Kategorie der Ressource empfohlen ist. @param {object} r Ressource. @param {string} field @returns {string} HTML */
function resourceRecommendedMark(r, field){
  const rec = RESOURCE_RECOMMENDED_FIELDS[r.kategorie];
  return (rec && rec.includes(field)) ? ' <span class="small muted">(empfohlen)</span>' : '';
}
/** Zeigt einen Hinweis, wenn findPotentialDuplicateResources() eine mögliche Dublette findet. @param {object} r @returns {string} HTML */
function resourceDuplicateHint(r){
  const dupes = findPotentialDuplicateResources(r);
  if(dupes.length===0) return '';
  const names = dupes.map(d=>escapeHtml(d.name||'(ohne Namen)')).join(', ');
  return '<div class="small" style="margin-top:8px;color:var(--warn);">⚠ Möglicherweise doppelt mit: '+names+
    ' — <a href="#" onclick="go(\'cluster\');return false;" style="color:var(--warn);text-decoration:underline;">im Abhängigkeitscluster zusammenführen</a></div>';
}
/** Aktualisiert ein einzelnes Feld einer Ressource und speichert. @param {string} id @param {string} key @param {*} val @returns {void} */
function resUpdate(id, key, val){
  const r = STATE.resources.find(r=>r.id===id);
  r[key] = val;
  autosave();
  if(key==='name'||key==='kategorie') render(); // Duplikat-Hinweise/Kategorie-Empfehlungen hängen davon ab
}
/** Aktualisiert ein verschachteltes Ressourcenfeld (z. B. recoveryRequirement.wert). @param {string} id @param {string} key @param {string} subkey @param {*} val @returns {void} */
function resUpdateNested(id, key, subkey, val){
  const r = STATE.resources.find(r=>r.id===id);
  if(!r[key]) r[key] = {};
  r[key][subkey] = val;
  autosave();
}

/** Rendert das SVG-Ablaufdiagramm Normalbetrieb -> Störung -> Notbetrieb -> Rückkehr. @returns {string} SVG */
function flowDiagramSvg(){
  const steps = ['Normalbetrieb','Störung','Bewertung','Entscheidung\nNotbetrieb','Arbeiten im\nNotbetrieb','Rückkehr\nNormalbetrieb'];
  const w = 168, gap = 26, h = 92, totalW = steps.length*w + (steps.length-1)*gap + 20;
  let svg = '<div class="flowwrap"><svg viewBox="0 0 '+totalW+' '+(h+20)+'" width="'+totalW+'" height="'+(h+20)+'" xmlns="http://www.w3.org/2000/svg">';
  steps.forEach((s,i)=>{
    const x = 10 + i*(w+gap);
    const isDecision = i===3;
    const fill = isDecision ? 'var(--accent-soft)' : '#fff';
    const stroke = isDecision ? 'var(--accent)' : '#CCD1DC';
    svg += '<rect x="'+x+'" y="6" width="'+w+'" height="'+h+'" rx="12" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.4"/>';
    const lines = s.split('\n');
    lines.forEach((line,li)=>{
      const ty = 6 + h/2 - (lines.length-1)*9 + li*18 + 5;
      svg += '<text x="'+(x+w/2)+'" y="'+ty+'" text-anchor="middle" font-size="12.5" font-family="Georgia, serif" font-weight="600" fill="#15203A">'+escapeHtml(line)+'</text>';
    });
    if(i < steps.length-1){
      const ax = x + w, bx = x + w + gap;
      svg += '<line x1="'+ax+'" y1="'+(6+h/2)+'" x2="'+(bx-4)+'" y2="'+(6+h/2)+'" stroke="#9097A8" stroke-width="1.6"/>';
      svg += '<polygon points="'+(bx-4)+','+(6+h/2-5)+' '+(bx+4)+','+(6+h/2)+' '+(bx-4)+','+(6+h/2+5)+'" fill="#9097A8"/>';
    }
  });
  svg += '</svg></div>';
  return svg;
}

/* Zeigt die Qualitätsprüfung (validateMassnahme) kompakt unterhalb der Maßnahme an */
function massnahmeFindingsHtml(m){
  const {findings} = validateMassnahme(m);
  const relevant = findings.filter(f=>f.type!=='ok');
  if(relevant.length===0) return '';
  const toneMap = {bad:'b-bad', warn:'b-warn'};
  let html = '<div style="margin-top:8px;">';
  relevant.forEach(f=>{
    html += '<span class="badge '+(toneMap[f.type]||'b-neutral')+'" style="margin-right:6px;margin-bottom:4px;">'+
      (f.type==='bad'?'Kritisch':'Hinweis')+'</span><span class="small muted" style="margin-right:10px;">'+escapeHtml(f.message)+'</span>';
  });
  html += '</div>';
  return html;
}
/** Aktualisiert ein einzelnes Feld einer Maßnahme und speichert. @param {string} id @param {string} key @param {*} val @returns {void} */
function massUpdate(id, key, val){
  const m = STATE.massnahmen.find(m=>m.id===id);
  m[key]=val;
  autosave();
  render();
}

  html += '<div class="card-help">Automatisch erkannt anhand normalisierter Namen und Tippfehler-Toleranz. Ändert nichts automatisch — Zusammenführen erfolgt bewusst per Klick.</div>';

    [['termin','Termin'],['prioritaet','Priorität'],['aufwand','Aufwand'],['status','Status']].map(([v,l])=>'<option value="'+v+'" '+(f.sort===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';
  html += '<div class="field" style="display:flex;align-items:flex-end;"><label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" '+(f.ueberfaellig?'checked':'')+' onchange="App.setMassnahmenFilter(\'ueberfaellig\',this.checked)" style="width:auto;"> Nur überfällige anzeigen</label></div>';
  html += '</div>';

  if(list.length===0){ html += emptyState('Keine Maßnahmen gefunden', 'Passen Sie die Filter an oder legen Sie eine neue Maßnahme an.'); }
  else {
    html += '<table class="dtable"><thead><tr><th>Maßnahme</th><th>Prozess</th><th>Kategorie</th><th>Priorität</th><th>Aufwand</th><th>Verantwortlich</th><th>Termin</th><th>Status</th><th>Qualität</th></tr></thead><tbody>';
    list.forEach(m=>{
      const overdue = massnahmeIsOverdue(m);
      const needsProof = massnahmeNeedsEffectivenessProof(m);
      html += '<tr'+(overdue?' style="background:var(--bad-bg);"':'')+'><td><b>'+escapeHtml(m.titel||'(ohne Titel)')+'</b>'+
        (overdue?' <span class="badge b-bad">Überfällig</span>':'')+
        (needsProof?' <span class="badge b-warn">Kein Nachweis</span>':'')+
        '</td><td>'+escapeHtml(processName(m.prozessId))+'</td>'+
        '<td>'+escapeHtml(m.kategorie)+'</td><td>'+kritikalitaetBadge(m.prioritaet)+'</td>'+
        '<td>'+kritikalitaetBadge(m.aufwand)+'</td>'+
        '<td>'+escapeHtml(m.verantwortlich||'–')+'</td><td>'+fmtDateOnly(m.termin)+'</td><td>'+statusBadge(m.status)+'</td>'+
        '<td>'+massnahmeQualityBadge(m)+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

/** Rendert die View "Management Summary" (Wrapper um managementSummaryHtml). @returns {string} HTML */
function viewSummary(){
  return managementSummaryHtml(false);
}
/** Baut die ausführliche Management Summary (Entscheidungsbedarf, Abweichungen, Abhängigkeiten, Reifegrad, Top-Risiken u. a.) für GF-Ansicht und PDF. @param {boolean} forPrint @returns {string} HTML */
function managementSummaryHtml(forPrint){
  const stats = dashboardStats();
  const processes = STATE.processes;
  const kritischste = processes.slice().sort((a,b)=>biaScore(b).avg-biaScore(a).avg).slice(0,5);
  const topMassnahmen = STATE.massnahmen.filter(m=>m.status!=='erledigt').sort((a,b)=>
    ({hoch:0,mittel:1,niedrig:2}[a.prioritaet]-{hoch:0,mittel:1,niedrig:2}[b.prioritaet])
  ).slice(0,5);
  const cluster = buildClusters().slice(0,5);
  const offeneRisiken = processes.reduce((sum,p)=>sum+resilienzSummary(p).rot,0);

  const wrap = forPrint ? (h)=>h : (h)=>'<div class="card">'+h+'</div>';
  let html = '';

  html += wrap(
    '<div class="kicker">Management Summary</div>'+
    '<p>Aktuell sind <b>'+processes.length+' Geschäftsprozesse</b> im Business Continuity Workbook dokumentiert, davon <b>'+stats.kritisch+' als kritisch</b> eingestuft. '+
    'Es bestehen <b>'+offeneRisiken+' offene rote Resilienz-Risiken</b> sowie <b>'+stats.offeneMassnahmen+' offene Maßnahmen</b>. '+
    (stats.kritisch>0 ? 'Der Schwerpunkt der nächsten Schritte sollte auf den unten genannten kritischsten Prozessen und Top-Maßnahmen liegen.' : 'Es liegen aktuell keine als hochkritisch eingestuften Prozesse vor.')+
    '</p>'
  );

  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">Kritischste Prozesse</h3>'+
    (kritischste.length===0 ? '<p class="small muted">Noch keine Prozesse erfasst.</p>' :
    '<table class="dtable"><thead><tr><th>Prozess</th><th>Kritikalität</th><th>BIA-Score</th><th>MTA</th></tr></thead><tbody>'+
    kritischste.map(p=>{ const bs=biaScore(p); return '<tr><td>'+escapeHtml(p.steckbrief.name||'–')+'</td><td>'+kritikalitaetBadge(p.steckbrief.kritikalitaet)+'</td>'+
      '<td><span class="badge b-'+bs.ampel+'">'+bs.klasse+' ('+bs.avg+')</span></td><td>'+escapeHtml(p.steckbrief.mtaWert)+' '+escapeHtml(p.steckbrief.mtaEinheit)+'</td></tr>'; }).join('')+
    '</tbody></table>')
  );

  const decisionNeeds = allDecisionNeeds();
  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">Entscheidungsbedarf</h3>'+
    (decisionNeeds.length===0 ? '<p class="small muted">Kein akuter Entscheidungsbedarf erkannt.</p>' :
    '<table class="dtable"><thead><tr><th>Prozess</th><th>Offene Punkte</th></tr></thead><tbody>'+
    decisionNeeds.map(d=>'<tr><td>'+escapeHtml(d.process.steckbrief.name||'–')+'</td><td>'+d.needs.map(escapeHtml).join('<br>')+'</td></tr>').join('')+
    '</tbody></table>')
  );

  const deviations = STATE.processes.map(p=>({p, dev:criticalityDeviation(p)})).filter(x=>x.dev);
  if(deviations.length>0){
    html += wrap(
      '<h3 class="pp-h3" style="margin-top:0;">Kritikalität vs. BIA-Empfehlung</h3>'+
      '<table class="dtable"><thead><tr><th>Prozess</th><th>Manuell</th><th>BIA-Empfehlung</th><th>Begründet?</th></tr></thead><tbody>'+
      deviations.map(({p,dev})=>'<tr'+(!dev.hasJustification?' style="background:var(--bad-bg);"':'')+'><td>'+escapeHtml(p.steckbrief.name||'–')+'</td><td>'+kritikalitaetLabel(dev.manual)+'</td><td>'+kritikalitaetLabel(dev.suggested)+'</td><td>'+(dev.hasJustification?'<span class="badge b-ok">Ja</span>':'<span class="badge b-bad">Nein</span>')+'</td></tr>').join('')+
      '</tbody></table>'
    );
  }

  const depOverview = dependencyOverview();
  const hasDepInfo = depOverview.mostDependencies.length>0 || depOverview.spofs.length>0 || depOverview.criticalChains.length>0 || depOverview.directCriticalDependencies.length>0 || depOverview.noDependencies.length>0;
  if(hasDepInfo){
    let depHtml = '<h3 class="pp-h3" style="margin-top:0;">Prozessabhängigkeiten</h3>';
    if(depOverview.mostDependencies.length>0){
      depHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;">Prozesse mit den meisten Abhängigkeiten</p>';
      depHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+depOverview.mostDependencies.map(x=>'<li class="small">'+escapeHtml(x.p.steckbrief.name||'–')+' ('+x.count+')</li>').join('')+'</ul>';
    }
    if(depOverview.spofs.length>0){
      depHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;">Mögliche Single Points of Failure</p>';
      depHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+depOverview.spofs.map(p=>'<li class="small">'+escapeHtml(p.steckbrief.name||'–')+' — kritisch und mehrfach als Abhängigkeit referenziert</li>').join('')+'</ul>';
    }
    if(depOverview.criticalChains.length>0){
      depHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;">Kritische Ketten (mehrstufig, ≥ 3 Prozesse)</p>';
      depHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+depOverview.criticalChains.map(c=>'<li class="small">'+c.map(escapeHtml).join(' → ')+'</li>').join('')+'</ul>';
    }
    if(depOverview.directCriticalDependencies.length>0){
      depHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;">Direkte kritische Abhängigkeiten (Zweierbeziehungen)</p>';
      depHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+depOverview.directCriticalDependencies.map(c=>'<li class="small">'+c.map(escapeHtml).join(' → ')+'</li>').join('')+'</ul>';
    }
    if(depOverview.noDependencies.length>0){
      depHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;">Prozesse ohne gepflegte Abhängigkeiten</p>';
      depHtml += '<ul style="margin:0;padding-left:16px;">'+depOverview.noDependencies.map(p=>'<li class="small">'+escapeHtml(p.steckbrief.name||'–')+'</li>').join('')+'</ul>';
    }
    html += wrap(depHtml);
  }

  const orphanDeps = orphanedDependencies();
  const contradictions = contradictoryDependencies();
  if(orphanDeps.length>0 || contradictions.length>0){
    let warnHtml = '<h3 class="pp-h3" style="margin-top:0;">Abhängigkeits-Warnungen</h3>';
    if(orphanDeps.length>0){
      warnHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;color:var(--bad);">Verweise auf gelöschte Prozesse</p>';
      warnHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+orphanDeps.map(o=>'<li class="small">'+escapeHtml(o.process.steckbrief.name||'–')+' verweist auf einen nicht mehr vorhandenen Prozess</li>').join('')+'</ul>';
    }
    if(contradictions.length>0){
      warnHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;color:var(--warn);">Widersprüchliche Beziehungen</p>';
      warnHtml += '<ul style="margin:0;padding-left:16px;">'+contradictions.map(c=>'<li class="small">"'+escapeHtml(c.a.steckbrief.name)+'" und "'+escapeHtml(c.b.steckbrief.name)+'" bezeichnen sich gegenseitig als "'+c.type+'"</li>').join('')+'</ul>';
    }
    html += wrap(warnHtml);
  }

  const spofResources = singlePointOfFailureResources();
  const resourcesNoAlt = STATE.resources.filter(r=>r.alternative==='nein');
  const recoveryConflicts = resourcesWithConflictingRecovery();
  if(spofResources.length>0 || resourcesNoAlt.length>0 || recoveryConflicts.length>0){
    let resHtml = '<h3 class="pp-h3" style="margin-top:0;">Ressourcenabhängigkeiten</h3>';
    if(spofResources.length>0){
      resHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;color:var(--bad);">Als Single Point of Failure markiert</p>';
      resHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+spofResources.map(r=>'<li class="small">'+escapeHtml(r.name||'–')+' ('+escapeHtml(r.kategorie)+')</li>').join('')+'</ul>';
    }
    if(resourcesNoAlt.length>0){
      resHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;">Ressourcen ohne Alternative</p>';
      resHtml += '<ul style="margin:0 0 10px;padding-left:16px;">'+resourcesNoAlt.slice(0,10).map(r=>'<li class="small">'+escapeHtml(r.name||'–')+'</li>').join('')+(resourcesNoAlt.length>10?'<li class="small">… und '+(resourcesNoAlt.length-10)+' weitere</li>':'')+'</ul>';
    }
    if(recoveryConflicts.length>0){
      resHtml += '<p class="small" style="margin:0 0 4px;font-weight:700;color:var(--warn);">Widersprüchliche Recovery-Anforderung</p>';
      resHtml += '<ul style="margin:0;padding-left:16px;">'+recoveryConflicts.map(c=>'<li class="small">'+escapeHtml(c.resource.name||'–')+' ('+c.recoveryHours+'h Wiederherstellung) ist langsamer als die MTA von "'+escapeHtml(c.process.steckbrief.name||'–')+'" ('+c.mtaHours+'h)</li>').join('')+'</ul>';
    }
    html += wrap(resHtml);
  }

  const capabilityGaps = STATE.processes.map(p=>({p, gaps:minimumCapabilityQualityGaps(p)})).filter(x=>x.gaps.length>0);
  if(capabilityGaps.length>0){
    let mcHtml = '<h3 class="pp-h3" style="margin-top:0;">Mindestfähigkeit — Qualitätslücken</h3>';
    mcHtml += '<table class="dtable"><thead><tr><th>Prozess</th><th>Hinweis</th></tr></thead><tbody>'+
      capabilityGaps.map(({p,gaps})=>'<tr><td>'+escapeHtml(p.steckbrief.name||'–')+'</td><td>'+gaps.map(escapeHtml).join('<br>')+'</td></tr>').join('')+
      '</tbody></table>';
    html += wrap(mcHtml);
  }

  const maturityRows = STATE.processes.map(p=>({p, m:processMaturity(p)}));
  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">BCM-Reifegrad</h3>'+
    (maturityRows.length===0 ? '<p class="small muted">Noch keine Prozesse erfasst.</p>' :
    '<table class="dtable"><thead><tr><th>Prozess</th><th>Reifegrad</th><th>Fortschritt</th></tr></thead><tbody>'+
    maturityRows.map(({p,m})=>{
      const tone = m.label==='Reviewfähig' ? 'b-ok' : m.label==='Fortgeschritten' ? 'b-warn' : m.label==='Aufbau' ? 'b-warn' : 'b-bad';
      return '<tr><td>'+escapeHtml(p.steckbrief.name||'–')+'</td><td><span class="badge '+tone+'">'+m.label+'</span></td><td>'+m.pct+'%</td></tr>';
    }).join('')+
    '</tbody></table>')
  );

  const topRisks = topRisksList();
  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">Top Risiken</h3>'+
    (topRisks.length===0 ? '<p class="small muted">Keine besonderen Risiken erkannt.</p>' :
    '<ul style="margin:0;padding-left:18px;line-height:1.85;">'+
    topRisks.map(r=>'<li><span class="badge '+(r.level==='hoch'?'b-bad':'b-warn')+'" style="margin-right:6px;">'+(r.level==='hoch'?'Hoch':'Mittel')+'</span>'+escapeHtml(r.text)+'</li>').join('')+
    '</ul>')
  );

  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">Wichtigste Abhängigkeiten</h3>'+
    (cluster.length===0 ? '<p class="small muted">Noch keine Ressourcen-Abhängigkeiten erfasst.</p>' :
    '<table class="dtable"><thead><tr><th>Ressource</th><th>Kategorie</th><th>Genutzt in Prozessen</th></tr></thead><tbody>'+
    cluster.map(r=>'<tr><td>'+escapeHtml(r.name||'–')+'</td><td>'+escapeHtml(r.kategorie)+'</td><td>'+r.count+'</td></tr>').join('')+
    '</tbody></table>')
  );

  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">Top 5 Maßnahmen</h3>'+
    (topMassnahmen.length===0 ? '<p class="small muted">Keine offenen Maßnahmen.</p>' :
    '<table class="dtable"><thead><tr><th>Maßnahme</th><th>Prozess</th><th>Priorität</th><th>Verantwortlich</th><th>Termin</th><th>Qualität</th></tr></thead><tbody>'+
    topMassnahmen.map(m=>{
      const q = massnahmeQuality(m);
      const rowStyle = q==='bad' ? ' style="background:var(--bad-bg);"' : '';
      return '<tr'+rowStyle+'><td>'+escapeHtml(m.titel||'–')+'</td><td>'+escapeHtml(processName(m.prozessId))+'</td><td>'+kritikalitaetBadge(m.prioritaet)+'</td>'+
      '<td>'+escapeHtml(m.verantwortlich||'–')+'</td><td>'+fmtDateOnly(m.termin)+'</td><td>'+massnahmeQualityBadge(m)+'</td></tr>';
    }).join('')+
    '</tbody></table>')
  );

  html += wrap(
    '<h3 class="pp-h3" style="margin-top:0;">Empfohlene nächste Schritte</h3>'+
    '<ul style="margin:0;padding-left:18px;line-height:1.85;">'+
    (stats.kritisch>0 ? '<li>Resilienzlücken bei den '+stats.kritisch+' kritischen Prozessen priorisiert schließen.</li>' : '')+
    (offeneRisiken>0 ? '<li>'+offeneRisiken+' rote Resilienz-Checks in konkrete Maßnahmen mit Termin und Verantwortlichem überführen.</li>' : '')+
    (cluster.length>0 ? '<li>Abhängigkeit von "'+escapeHtml(cluster[0].name||'zentraler Ressource')+'" durch Alternativen oder redundante Kapazitäten absichern.</li>' : '')+
    (stats.offeneMassnahmen>0 ? '<li>Fortschritt der '+stats.offeneMassnahmen+' offenen Maßnahmen im nächsten BCM-Review nachverfolgen.</li>' : '')+
    (processes.length<5 ? '<li>Weitere geschäftskritische Prozesse in den Geltungsbereich des Workbooks aufnehmen.</li>' : '')+
    '</ul>'
  );

  return html;
}














/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
function viewVersions(){
  refreshVersionChecksums(); // still im Hintergrund, re-rendert bei Bedarf selbst
  let html = '<div class="card"><div class="card-head"><div class="card-title">Versionshistorie</div>'+
    '<button class="btn btn-sm btn-primary" onclick="App.openSaveVersion()">Neue Version speichern</button></div>';
  html += '<div class="card-help">Jede gespeicherte Version bleibt unveränderlich erhalten. Ältere Versionen können angesehen, verglichen und als neuer Stand wiederhergestellt werden.</div>';
  if(STATE.versions.length===0){
    html += emptyState('Noch keine Version gespeichert', 'Speichern Sie den aktuellen Stand, um eine erste Version anzulegen.');
  } else {
    const sourceLabels = {manual:'Manuell', import:'Import', restore:'Wiederherstellung', migration:'Migration', cleanup:'Bereinigung', legacy:'—'};
    html += '<table class="dtable"><thead><tr><th>Version</th><th>Datum</th><th>Bearbeiter</th><th>Notiz</th><th>Herkunft</th><th>Prüfsumme</th><th></th></tr></thead><tbody>';
    STATE.versions.slice().reverse().forEach(v=>{
      const isCurrent = v.nr === STATE.meta.version;
      const cs = versionChecksumCache[v.nr];
      let csBadge;
      if(cs==='ok') csBadge = '<span class="badge b-ok">✓ geprüft</span>';
      else if(cs==='mismatch') csBadge = '<span class="badge b-bad">⚠ Abweichung</span>';
      else if(cs==='historisch') csBadge = '<span class="badge b-neutral">historisch, ungeprüft</span>';
      else if(cs==='unbekannt') csBadge = '<span class="badge b-neutral">nicht prüfbar</span>';
      else csBadge = '<span class="small muted">wird geprüft…</span>';
      html += '<tr><td><b>v'+v.nr+'</b>'+(isCurrent?' <span class="badge b-ok">aktuell</span>':'')+'</td>'+
        '<td>'+fmtDate(v.datum)+'</td><td>'+escapeHtml(v.bearbeiter)+'</td><td>'+escapeHtml(v.notiz||'–')+'</td>'+
        '<td>'+escapeHtml(sourceLabels[v.source]||v.source||'—')+'</td>'+
        '<td>'+csBadge+'</td>'+
        '<td><button class="btn btn-sm" onclick="App.viewVersionDetail('+v.nr+')">Ansehen</button> '+
        (isCurrent?'':'<button class="btn btn-sm" onclick="App.confirmRestoreVersion('+v.nr+')">Wiederherstellen</button>')+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  if(STATE.versions.length>=2){
    html += '<div class="card"><div class="card-title" style="margin-bottom:10px;">Versionen vergleichen</div>';
    html += '<div class="grid grid-2">';
    html += '<div class="field"><label>Version A (älter)</label><select id="cmp-version-a">'+
      STATE.versions.map(v=>'<option value="'+v.nr+'">v'+v.nr+' · '+fmtDate(v.datum)+'</option>').join('')+'</select></div>';
    html += '<div class="field"><label>Version B (neuer)</label><select id="cmp-version-b">'+
      STATE.versions.map(v=>'<option value="'+v.nr+'" '+(v.nr===STATE.versions[STATE.versions.length-1].nr?'selected':'')+'>v'+v.nr+' · '+fmtDate(v.datum)+'</option>').join('')+'</select></div>';
    html += '</div>';
    html += '<button class="btn btn-sm btn-primary" onclick="App.showVersionComparison()">Vergleichen</button>';
    html += '</div>';
  }
  return html;
}
/** P8: zeigt den strukturierten Vergleich zweier gewählter Versionen (compareVersions). @returns {void} */
App.showVersionComparison = function(){
  const nrA = parseInt(document.getElementById('cmp-version-a').value, 10);
  const nrB = parseInt(document.getElementById('cmp-version-b').value, 10);
  const vA = STATE.versions.find(v=>v.nr===nrA);
  const vB = STATE.versions.find(v=>v.nr===nrB);
  if(!vA || !vB){ toast('Bitte zwei gültige Versionen wählen.'); return; }
  if(nrA===nrB){ toast('Bitte zwei unterschiedliche Versionen wählen.'); return; }
  const diff = compareVersions(vA, vB);
  let html = '<h3>Vergleich v'+nrA+' → v'+nrB+'</h3>';
  const section = (title, items)=> items.length===0 ? '' :
    '<h4 style="font-size:12.5px;margin:14px 0 6px;">'+title+'</h4><ul style="margin:0;padding-left:18px;">'+
    items.map(i=>'<li class="small">'+escapeHtml(i)+'</li>').join('')+'</ul>';
  html += section('Neue Prozesse', diff.processesAdded);
  html += section('Entfernte Prozesse', diff.processesRemoved);
  if(diff.processChanges.length>0){
    html += '<h4 style="font-size:12.5px;margin:14px 0 6px;">Geänderte Prozesse</h4>';
    diff.processChanges.forEach(pc=>{
      html += '<div class="rowcard"><b class="small">'+escapeHtml(pc.name)+'</b><ul style="margin:6px 0 0;padding-left:18px;">'+
        pc.changes.map(c=>'<li class="small">'+escapeHtml(c)+'</li>').join('')+'</ul></div>';
    });
  }
  html += section('Neue Ressourcen', diff.resourcesAdded);
  html += section('Entfernte Ressourcen', diff.resourcesRemoved);
  if(diff.massnahmenChanges.length>0){
    html += '<h4 style="font-size:12.5px;margin:14px 0 6px;">Geänderte Maßnahmen</h4>';
    diff.massnahmenChanges.forEach(mc=>{
      html += '<div class="rowcard"><b class="small">'+escapeHtml(mc.titel)+'</b><ul style="margin:6px 0 0;padding-left:18px;">'+
        mc.changes.map(c=>'<li class="small">'+escapeHtml(c)+'</li>').join('')+'</ul></div>';
    });
  }
  if(diff.processesAdded.length+diff.processesRemoved.length+diff.processChanges.length+diff.resourcesAdded.length+diff.resourcesRemoved.length+diff.massnahmenChanges.length===0){
    html += '<p class="small muted">Keine erkennbaren Unterschiede zwischen diesen beiden Versionen.</p>';
  }
  html += '<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Schließen</button></div>';
  openModal(html);
};
/** Zeigt die Detailkennzahlen einer einzelnen Version (Prozesszahl, kritische Prozesse, Maßnahmen). @param {number} nr Versionsnummer. @returns {void} */
App.viewVersionDetail = function(nr){
  const v = STATE.versions.find(v=>v.nr===nr);
  if(!v) return;
  const data = JSON.parse(v.snapshot);
  const stats = { anzahl: data.processes.length, kritisch: data.processes.filter(p=>p.steckbrief.kritikalitaet==='hoch').length, massnahmen: data.massnahmen.length };
  openModal(
    '<h3>Version v'+v.nr+' — '+escapeHtml(v.bearbeiter)+'</h3>'+
    '<p class="small muted">'+fmtDate(v.datum)+'</p>'+
    '<p>'+escapeHtml(v.notiz||'Keine Notiz hinterlegt.')+'</p>'+

/** P3+P4: Karte "Wiederherstellung und Sicherungen" in den Einstellungen. @returns {string} HTML */

  if(recoveries.length>0){
    html += '<h4 style="font-size:12.5px;margin:14px 0 8px;color:var(--bad);">Nicht ladbare Rohdaten</h4>';
    recoveries.forEach(r=>{
      html += '<div class="rowcard"><div class="spread">'+

        '<div class="flexrow">'+

        '<button class="btn btn-sm btn-danger" onclick="App.deleteRecoverySnapshot(\''+safeJsString(r.key)+'\', false)">Löschen</button>'+
        '</div></div></div>';
    });
  }

  html += '<h4 style="font-size:12.5px;margin:14px 0 8px;">Automatische Sicherungen ('+backups.length+' / '+AUTOBACKUP_SLOTS+')</h4>';
  if(backups.length===0){
    html += '<div class="small muted">Noch keine automatischen Sicherungen vorhanden.</div>';
  } else {
    const reasonLabels = {import:'Vor Import', restore:'Vor Versions-Wiederherstellung', cleanup:'Vor Löschen/Bereinigen', migration:'Vor Schema-Migration', interval:'Automatisch (Intervall)'};
    html += '<table class="dtable"><thead><tr><th>Zeitpunkt</th><th>Grund</th><th>Workbook</th><th></th></tr></thead><tbody>';
    backups.forEach(b=>{
      const name = (b.snapshot && b.snapshot.meta && b.snapshot.meta.kundenname) || '–';
      html += '<tr><td>'+fmtDate(b.createdAt)+'</td><td>'+(reasonLabels[b.reason]||escapeHtml(b.reason))+'</td><td>'+escapeHtml(name)+'</td>'+
        '<td><div class="flexrow">'+
        '<button class="btn btn-sm" onclick="App.restoreAutoBackup('+b.__slot+')">Wiederherstellen</button>'+
        '<button class="btn btn-sm" onclick="App.downloadAutoBackup('+b.__slot+')">JSON</button>'+
        '<button class="btn btn-sm btn-danger" onclick="App.deleteAutoBackupAction('+b.__slot+')">Löschen</button>'+
        '</div></td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  return html;
}

    dataGaps.slice(0,10).map(g=>'<tr><td>'+escapeHtml(g.process.steckbrief.name||'–')+'</td><td>'+escapeHtml(g.category)+'</td><td>'+escapeHtml(g.message)+'</td></tr>').join('')+
    (dataGaps.length>10?'<tr><td colspan="3" class="small muted">… und '+(dataGaps.length-10)+' weitere</td></tr>':'')+
    '</tbody></table>';

  html += '<div class="card"><div class="card-title" style="margin-bottom:10px;">Entscheidungsbedarf</div>';

  html += '</div>';

  return html;

    {label:'Im Normalbetrieb läuft der Prozess so:', path:'processes.'+idx+'.sixty.normalbetrieb'},

    {label:'Bei Ausfall passiert:', path:'processes.'+idx+'.sixty.beiAusfall'},
    {label:'Unbedingt benötigt werden:', path:'processes.'+idx+'.sixty.benoetigt'},
    {label:'Der heutige Notbetrieb sieht so aus:', path:'processes.'+idx+'.sixty.notbetriebHeute'},

    {label:'Wer entscheidet über den Notbetrieb?', path:'processes.'+idx+'.notbetrieb.entscheidung'},

/** Baut und zeigt den Workshop-Modus (geführte Fragenfolge, große Schrift). @returns {void} */
function renderWorkshopOverlay(){
  const old = document.getElementById('overlay-root'); if(old) old.remove();
  const el = document.createElement('div');
  el.id = 'overlay-root';
  el.className = 'workshop-overlay';
  const process = getProcess(App.workshopProcessId);
  const questions = workshopQuestions(process);
  const q = questions[App.workshopStep];
  const currentValue = getPath(STATE, q.path) || '';

  let html = '<div class="gf-header">';
  html += '<select onchange="App.workshopProcessId=this.value;App.workshopStep=0;renderWorkshopOverlay()" style="max-width:280px;">'+
    STATE.processes.map(p=>'<option value="'+escapeHtml(p.id)+'" '+(p.id===App.workshopProcessId?'selected':'')+'>'+escapeHtml(p.steckbrief.name||'Unbenannt')+'</option>').join('')+'</select>';
  html += '<button class="btn" onclick="App.closeOverlay()">Schließen ✕</button>';
  html += '</div>';

  html += '<div class="workshop-stage">';
  html += '<div class="workshop-progress">Frage '+(App.workshopStep+1)+' von '+questions.length+' · '+escapeHtml(process.steckbrief.name||'Prozess')+'</div>';
  html += '<div class="workshop-q">'+escapeHtml(q.label)+'</div>';
  html += '<textarea class="workshop-answer" id="workshop-input" placeholder="Antwort der Teilnehmer…">'+escapeHtml(currentValue)+'</textarea>';
  html += '<div class="workshop-nav">';
  html += '<button class="btn" '+(App.workshopStep===0?'disabled':'')+' onclick="App.workshopPrev()">← Zurück</button>';
  html += '<button class="btn btn-primary" onclick="App.workshopNext()">'+(App.workshopStep===questions.length-1?'Abschließen':'Weiter →')+'</button>';
  html += '</div></div>';
  el.innerHTML = html;
  document.body.appendChild(el);
  document.getElementById('workshop-input').focus();
}
/** Speichert die aktuelle Workshop-Antwort im zugehörigen STATE-Feld. @returns {void} */
App.workshopSaveCurrent = function(){
  const process = getProcess(App.workshopProcessId);
  const questions = workshopQuestions(process);
  const q = questions[App.workshopStep];
  const val = document.getElementById('workshop-input').value;
  setPath(STATE, q.path, val);
  autosave();
};
/** Speichert die aktuelle Antwort und geht zur nächsten Workshop-Frage (oder schließt bei der letzten Frage ab). @returns {void} */
App.workshopNext = function(){
  App.workshopSaveCurrent();
  const process = getProcess(App.workshopProcessId);
  const questions = workshopQuestions(process);
  if(App.workshopStep < questions.length-1){ App.workshopStep++; renderWorkshopOverlay(); }
  else { App.closeOverlay(); render(); toast('Workshop-Runde abgeschlossen und gespeichert.'); }
};
/** Speichert die aktuelle Antwort und geht zur vorherigen Workshop-Frage zurück. @returns {void} */
App.workshopPrev = function(){
  App.workshopSaveCurrent();
  if(App.workshopStep>0){ App.workshopStep--; renderWorkshopOverlay(); }
};

/** Baut den Inhalt von #print-root für window.print() gemäß gewähltem Berichtsumfang. @param {string} scope 'kurz'|'vollstaendig'|'massnahmen'|'einzelprozess' @param {string|null} processId Nur bei scope='einzelprozess'. @returns {void} */
function buildPrintRoot(scope, processId){
  const root = document.getElementById('print-root');
  let html = '';
  if(scope==='kurz'){
    // v1.6.0 (P16): echter Kurzbericht — Deckblatt + EINE kompakte Seite, nicht mehr der volle Management-Summary-Umfang.
    html += pdfCover() + pdfExecutiveSummaryPage();
  } else if(scope==='massnahmen'){
    html += pdfCover() + pdfMassnahmenPage();
  } else if(scope==='einzelprozess'){
    const p = getProcess(processId) || STATE.processes[0];
    html += pdfCover() + (p ? pdfProcessPage(p) : '<div class="pp-page">Kein Prozess ausgewählt.</div>');
  } else {
    // Vollständiger BCM-Bericht: kompakte Übersicht vorweg, danach die volle Detailtiefe.
    html += pdfCover();
    html += pdfExecutiveSummaryPage();
    html += pdfSummaryPage();
    html += pdfProcessOverviewPage();
    STATE.processes.forEach(p=>{ html += pdfProcessPage(p); });
    html += pdfClusterPage();
    html += pdfMassnahmenPage();
    html += pdfVersionsPage();
  }
  root.innerHTML = html;
}

/** P18: führt die integrierte Selbstprüfung mit ausschließlich synthetischen Daten aus (verändert STATE nicht). @returns {Promise<{results:object[], total:number, passed:number, failed:number, criticalFailed:number, allCriticalPassed:boolean}>} */
function runSelfTests(){
  const results = [];
  function assertEqual(actual, expected, message){
    if(JSON.stringify(actual)!==JSON.stringify(expected)){
      const err = new Error(message||'Werte weichen ab');
      err.expected = expected; err.actual = actual;
      throw err;
    }
  }
  function assertTrue(cond, message, actualForReport){
    if(!cond){
      const err = new Error(message||'Bedingung nicht erfüllt');
      err.expected = true; err.actual = actualForReport!==undefined ? actualForReport : cond;
      throw err;
    }
  }
  function test(name, critical, fn){
    try{ fn(); results.push({ name, critical, passed:true }); }
    catch(e){ results.push({ name, critical, passed:false, expected:e.expected, actual:e.actual, message:e.message||String(e) }); }
  }
  function asyncTest(name, critical, fn){
    return fn().then(()=>{ results.push({ name, critical, passed:true }); })
      .catch(e=>{ results.push({ name, critical, passed:false, expected:e.expected, actual:e.actual, message:e.message||String(e) }); });
  }

  /* ---- 1) durationToHours ---- */
  test('durationToHours: 4 Stunden -> 4', true, ()=> assertEqual(durationToHours('4','Stunden'), 4));
  test('durationToHours: 2 Tage -> 48', true, ()=> assertEqual(durationToHours('2','Tage'), 48));
  test('durationToHours: 30 Minuten -> 0.5', true, ()=> assertEqual(durationToHours('30','Minuten'), 0.5));
  test('durationToHours: 1 Woche -> 168', false, ()=> assertEqual(durationToHours('1','Wochen'), 168));
  test('durationToHours: nicht auswertbarer Text -> null', false, ()=> assertEqual(durationToHours('abc','Stunden'), null));

  /* ---- 2) MTA/RTO-Plausibilität (synthetischer Prozess, nicht STATE) ---- */
  test('timePlausibility: RTO > MTA erkannt', true, ()=>{
    const p = newProcess('Selbsttest-Zeitwert');
    p.steckbrief.mtaWert='4'; p.steckbrief.mtaEinheit='Stunden';
    p.steckbrief.rto = {wert:8, einheit:'Stunden', legacyText:''};
    const tp = timePlausibility(p);
    assertTrue(tp.findings.some(f=>f.type==='bad'), 'RTO>MTA sollte kritisch sein', tp.findings);
  });
  test('timePlausibility: RTO == MTA als "knapp" markiert', false, ()=>{
    const p = newProcess('Selbsttest-Knapp');
    p.steckbrief.mtaWert='8'; p.steckbrief.mtaEinheit='Stunden';
    p.steckbrief.rto = {wert:8, einheit:'Stunden', legacyText:''};
    const tp = timePlausibility(p);
    assertTrue(tp.findings.some(f=>f.message.includes('knapp')), 'RTO=MTA sollte als knapp markiert sein', tp.findings);
  });
  test('parseStructuredDuration: reine Zahl ohne Einheit wird NICHT geraten', true, ()=> assertEqual(parseStructuredDuration('4'), null));

  /* ---- 3) ID-Eindeutigkeit ---- */
  test('uid(): 500 generierte IDs sind alle eindeutig', true, ()=>{
    const ids = new Set();
    for(let i=0;i<500;i++) ids.add(uid('t'));
    assertEqual(ids.size, 500);
  });
  test('uid(): Format ist UUID-basiert', false, ()=> assertTrue(/^t_[0-9a-f-]{36}$/i.test(uid('t')), 'uid-Format unerwartet', uid('t')));

  /* ---- 4) Importvalidierung (nur mit übergebenen, synthetischen Daten) ---- */
  test('validateImportData: gültige Minimaldatei wird akzeptiert', true, ()=>{
    const r = validateImportData({processes:[{id:'p1',steckbrief:{name:'A'}}], resources:[], massnahmen:[], versions:[]});
    assertTrue(r.valid===true, 'gültige Datei sollte valid=true liefern', r);
  });
  test('validateImportData: 1001 Prozesse werden abgewiesen (Größenlimit)', true, ()=>{
    const r = validateImportData({processes:new Array(1001).fill(0).map((_,i)=>({steckbrief:{name:'p'+i}})), resources:[], massnahmen:[], versions:[]});
    assertTrue(r.valid===false, 'Größenlimit sollte greifen', r);
  });
  test('validateImportData: __proto__-Schlüssel wird entfernt', true, ()=>{
    const evil = JSON.parse('{"processes":[{"steckbrief":{"name":"E"},"__proto__":{"polluted":true}}]}');
    validateImportData(evil);
    assertEqual(({}).polluted, undefined, 'Object.prototype darf nicht verunreinigt sein');
  });
  test('validateImportData: doppelte Ressourcen-ID wird repariert, nicht verworfen', false, ()=>{
    const r = validateImportData({processes:[{id:'p1',steckbrief:{name:'A'}}], resources:[{id:'r1',name:'X',prozesse:['p1']},{id:'r1',name:'Y',prozesse:['p1']}], massnahmen:[], versions:[]});
    assertEqual(r.normalizedData.resources.length, 2, 'beide Ressourcen sollten erhalten bleiben');
  });

  /* ---- 5) Schema-Migration ---- */
  test('migrateWorkbook: Schema 1 wird bis zur aktuellen Version durchmigriert', true, ()=>{
    const r = migrateWorkbook({schemaVersion:1, processes:[], resources:[], massnahmen:[], versions:[]});
    assertTrue(r.ok===true && r.toVersion===CURRENT_SCHEMA_VERSION, 'Migration sollte vollständig bis CURRENT_SCHEMA_VERSION laufen', r);
  });
  test('migrateWorkbook: unvollständige Migration liefert NIE ok:true', true, ()=>{
    const saved = SCHEMA_MIGRATIONS[1];
    delete SCHEMA_MIGRATIONS[1];
    let r;
    try{ r = migrateWorkbook({schemaVersion:1, processes:[], resources:[], massnahmen:[], versions:[]}); }
    finally{ SCHEMA_MIGRATIONS[1] = saved; } // Registry IMMER wiederherstellen, auch bei Fehlern
    assertTrue(r.ok===false, 'fehlende Migrationsstufe darf nie als Erfolg gelten', r);
  });
  test('migrateWorkbook: neueres unbekanntes Schema wird abgelehnt', true, ()=>{
    const r = migrateWorkbook({schemaVersion:CURRENT_SCHEMA_VERSION+5, processes:[], resources:[], massnahmen:[], versions:[]});
    assertTrue(r.ok===false, 'zu neues Schema darf nicht geöffnet werden', r);
  });

  /* ---- 6) XSS-Testwerte ---- */
  const xssPayloads = ['<img src=x onerror=alert(1)>', '</textarea><script>alert(1)<\/script>', 'javascript:alert(1)'];
  test('escapeHtml: neutralisiert alle bekannten XSS-Testwerte', true, ()=>{
    xssPayloads.forEach(p=>{
      const escaped = escapeHtml(p);
      assertTrue(!escaped.includes('<img') && !escaped.includes('<script'), 'Payload nicht neutralisiert: '+p, escaped);
    });
  });
  test('safeUrl: blockiert javascript:/vbscript:/data:text/html', true, ()=>{
    assertEqual(safeUrl('javascript:alert(1)'), '');
    assertEqual(safeUrl('vbscript:x'), '');
    assertEqual(safeUrl('data:text/html,<script>alert(1)<\/script>'), '');
  });
  test('safeUrl: erlaubt https: und data:image/png', false, ()=>{
    assertEqual(safeUrl('https://example.com/logo.png'), 'https://example.com/logo.png');
    assertTrue(safeUrl('data:image/png;base64,abc')!=='', 'data:image/png sollte erlaubt sein');
  });

  /* ---- 7) Versionswiederherstellung (reine Logik, ohne STATE zu verändern) ---- */
  test('compareVersions: erkennt Kritikalitätsänderung zwischen zwei Snapshots', false, ()=>{
    const snapA = JSON.stringify({processes:[{id:'x',steckbrief:{name:'X',kritikalitaet:'mittel',rto:{wert:1,einheit:'Stunden'},rpo:{wert:1,einheit:'Stunden'}},bia:{}}]});
    const snapB = JSON.stringify({processes:[{id:'x',steckbrief:{name:'X',kritikalitaet:'hoch',rto:{wert:1,einheit:'Stunden'},rpo:{wert:1,einheit:'Stunden'}},bia:{}}]});
    const diff = compareVersions({snapshot:snapA}, {snapshot:snapB});
    assertTrue(diff.processChanges.some(c=>c.changes.some(ch=>ch.includes('Kritikalität'))), 'Kritikalitätsänderung nicht erkannt', diff);
  });
  test('sha256Hex-Grundlage vorhanden (Web Crypto verfügbar)', false, ()=>{
    assertTrue(typeof crypto!=='undefined' && !!crypto.subtle, 'Web Crypto API nicht verfügbar');
  });

  /* ---- 8+9) Ressourcen-/Maßnahmenreferenzen (über validateImportData, keine STATE-Mutation) ---- */
  test('Ressourcenreferenzen: Verweis auf nicht vorhandenen Prozess wird entfernt', true, ()=>{
    const r = validateImportData({processes:[{id:'p1',steckbrief:{name:'A'}}], resources:[{id:'r1',name:'R',prozesse:['p1','GHOST']}], massnahmen:[], versions:[]});
    assertEqual(r.normalizedData.resources[0].prozesse, ['p1']);
  });
  test('Maßnahmenreferenzen: Verweis auf nicht vorhandenen Prozess wird geleert', true, ()=>{
    const r = validateImportData({processes:[{id:'p1',steckbrief:{name:'A'}}], resources:[], massnahmen:[{id:'m1',titel:'M',prozessId:'GHOST'}], versions:[]});
    assertEqual(r.normalizedData.massnahmen[0].prozessId, '');
  });

  /* ---- 10) Verschlüsselter Export/Import ---- */
  const encTestPromise = (async ()=>{
    await asyncTest('Verschlüsselter Export/Import: Roundtrip liefert Originaltext', true, async ()=>{
      const original = JSON.stringify({hello:'welt', zahl:42});
      const enc = await encryptWorkbookJson(original, 'TestPasswort123!');
      const dec = await decryptWorkbookJson(enc, 'TestPasswort123!');
      assertEqual(dec, original);
    });
    await asyncTest('Verschlüsselter Import: falsches Passwort schlägt fehl', false, async ()=>{
      const enc = await encryptWorkbookJson(JSON.stringify({a:1}), 'RichtigesPasswort');
      let threw = false;
      try{ await decryptWorkbookJson(enc, 'FalschesPasswort'); }catch(e){ threw = true; }
      assertTrue(threw, 'Entschlüsselung mit falschem Passwort hätte fehlschlagen müssen');
    });
  })();

  /* ---- 11) Fehlerhafte/abgeschnittene JSON-Datei ---- */
  test('attemptRecovery: vollständig kaputte Daten liefern kein Ergebnis (keine Erfindung)', true, ()=>{
    const r = attemptRecovery('{{{{{ das ist kein JSON');
    assertEqual(r.recovered, null);
  });
  test('attemptRecovery: abgeschnittenes, aber teilweise gültiges JSON wird als PARTIAL erkannt', true, ()=>{
    const truncated = '{"processes":[{"id":"p1","steckbrief":{"name":"A"}}], "resources":[]}'.slice(0, 50); // hart abgeschnitten
    const r = attemptRecovery(truncated+'"}}]}'); // absichtlich nicht sauber reparierbar
    // Entweder es gelingt eine Teilwiederherstellung, oder es wird ehrlich "kein Ergebnis" gemeldet — niemals stillschweigend geraten
    assertTrue(r.recovered===null || r.partial===true, 'Ergebnis muss entweder null oder klar als partial markiert sein', r);
  });

  /* ---- 12) Speichern ohne Berechtigung (globaler Datei-Zustand wird gesichert & wiederhergestellt) ---- */
  const saveTestPromise = (async ()=>{
    await asyncTest('Speichern ohne Berechtigung: SAVE_STATUS.file wird korrekt auf permission-required gesetzt', true, async ()=>{
      const savedHandle = currentFileHandle, savedName = currentFileName, savedStatus = Object.assign({}, SAVE_STATUS);
      try{
        currentFileHandle = { queryPermission: async ()=>'denied' };
        currentFileName = 'selbsttest.json';
        const ok = await writeToLinkedFile();
        assertTrue(ok===false && SAVE_STATUS.file==='permission-required', 'fehlende Berechtigung wurde nicht korrekt erkannt', {ok, fileStatus:SAVE_STATUS.file});
      } finally {
        // globalen Datei-Zustand IMMER wiederherstellen — auch bei einem fehlgeschlagenen Assert
        currentFileHandle = savedHandle; currentFileName = savedName;
        Object.assign(SAVE_STATUS, savedStatus);
      }
    });
  })();

  return Promise.all([encTestPromise, saveTestPromise]).then(()=>{
    const total = results.length;
    const passed = results.filter(r=>r.passed).length;
    const failed = total - passed;
    const criticalFailed = results.filter(r=>!r.passed && r.critical).length;
    return { results, total, passed, failed, criticalFailed, allCriticalPassed: criticalFailed===0 };
  });
}


document.addEventListener('DOMContentLoaded', function(){
  // v1.6.0 (P18): versteckter Entwicklermodus — Strg+Alt+T öffnet die
  // integrierte Selbstprüfung. Bewusst nicht in der normalen Oberfläche
  // verlinkt (kein Button, kein Menüpunkt).
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.altKey && (e.key==='t' || e.key==='T')){
      e.preventDefault();
      App.openSelfTestPanel();
    }
  });
  if(window.location.hash==='#selftest'){ setTimeout(()=>App.openSelfTestPanel(), 500); }

  if(STATE.processes.length===0 && STATE.versions.length===0){
    // Frischer Start: leeres Workbook, Hinweis zum Beispieldaten-Button erscheint im Dashboard
  }
  render();
  App.tryReconnectFile(); // still, ohne Dialog — siehe Funktionskommentar
  renderTermsGate();

  // P4: optionale Sicherung alle 15 Minuten, nur wenn seitdem tatsächlich etwas geändert wurde
  setInterval(()=>{
    if(backupDueToChange){
      createAutoBackup('interval');
      backupDueToChange = false;
      lastIntervalBackupAt = Date.now();
    }
  }, 15*60*1000);

  // P2: Hinweis anzeigen, falls beim Laden eine Schema-Migration stattfand
  if(PENDING_MIGRATION_NOTICE){
    const n = PENDING_MIGRATION_NOTICE;
    toast('Workbook von Datenmodell Version '+n.from+' auf Version '+n.to+' aktualisiert. Vorhandene Inhalte wurden übernommen.'+(n.warnings.length? ' '+n.warnings.length+' Feld(er) ergänzt.':''));
    PENDING_MIGRATION_NOTICE = null;
  }
  // v1.4.1 (Fix 2): sichtbare Warnung, falls das Backup vor einer Migration fehlschlug
  if(PENDING_BACKUP_FAILURE_NOTICE){
    toast(PENDING_BACKUP_FAILURE_NOTICE);
    PENDING_BACKUP_FAILURE_NOTICE = null;
  }
  // v1.4.1 (Fix 3): Hinweis, falls alte, rekursiv aufgeblähte Versions-Snapshots bereinigt wurden
  if(PENDING_CLEANUP_NOTICE){
    toast(PENDING_CLEANUP_NOTICE+' alte Versionssnapshot(s) enthielten unnötig die komplette Versionshistorie und wurden bereinigt. Prüfsummen werden neu berechnet.');
    PENDING_CLEANUP_NOTICE = null;
  }
  // P3: Wiederherstellungsdialog anzeigen, falls beim Laden beschädigte/unbekannte Daten gefunden wurden
  if(PENDING_RECOVERY_KEY){
    App.showRecoveryDialog(PENDING_RECOVERY_KEY, PENDING_RECOVERY_REASON);
  }
});

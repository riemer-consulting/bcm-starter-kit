    (FS_ACCESS_SUPPORTED ? 'Nur im Browser gespeichert (kein Datei-Export erfolgt)' : '');
}
/** Baut den kontextabhängigen Hinweistext, wo die Daten aktuell liegen (Browser vs. verknüpfte Datei). @returns {string} */
function storageLocationNotice(){
  if(currentFileName){
    return 'Daten liegen unverschlüsselt in der verknüpften Datei „'+escapeHtml(currentFileName)+'" (Ihr gewählter Ordner) sowie zusätzlich als Sicherung im Browserprofil dieses Geräts.';
  }
  return 'Daten liegen unverschlüsselt im Browserprofil dieses Geräts, solange keine Datei verknüpft ist (siehe „Speichern unter…" oben bzw. „Datei-Verknüpfung" in den Einstellungen).';
}

/** Liest einen Wert an einem Punktpfad aus einem verschachtelten Objekt. @param {object} obj @param {string} path @returns {*} */
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o===undefined||o===null) ? undefined : o[k], obj);
}
/** Setzt einen Wert an einem Punktpfad in einem verschachtelten Objekt (z. B. 'processes.0.steckbrief.name'), inkl. Array-Index-Unterstützung. Mutiert obj. @param {object} obj @param {string} path @param {*} value @returns {void} */
function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ cur = cur[parts[i]]; }
  cur[parts[parts.length-1]] = value;
}

/** Berechnet den gewichteten BIA-Gesamtscore eines Prozesses (BIA_WEIGHTS je Kategorie). @param {object} process @returns {{avg:number, ampel:string, klasse:string}} */
function biaScore(process){
  let weightedSum = 0, weightTotal = 0;
  BIA_CATEGORIES.forEach(c=>{
    const w = BIA_WEIGHTS[c.key] || 1;
    const v = Number(process.bia[c.key].bewertung) || 0;
    weightedSum += v * w;
    weightTotal += w;
  });
  const avg = weightTotal>0 ? weightedSum / weightTotal : 0;
  let ampel, klasse;
  if(avg >= 4){ ampel='bad'; klasse='Hoch'; }
  else if(avg >= 2.5){ ampel='warn'; klasse='Mittel'; }
  else { ampel='ok'; klasse='Niedrig'; }
  return { avg: Math.round(avg*10)/10, ampel, klasse };
}

/* ---------------------------------------------------------------------
   5g) MANUELLE KRITIKALITÄT vs. BIA-EMPFEHLUNG (v1.5.0, P10)
   Grenzwerte bewusst als eigene, benannte Konstante (nicht identisch mit
   biaScore()'s Ampel-Schwellen wiederverwendet, auch wenn sie aktuell
   gleich sind) — so lassen sie sich unabhängig voneinander justieren.
   Die Anwendung ändert die manuelle Einstufung NIE automatisch.
   --------------------------------------------------------------------- */
const CRITICALITY_SUGGESTION_THRESHOLDS = { hoch: 4.0, mittel: 2.5 };
/** P10: leitet eine Kritikalitäts-EMPFEHLUNG aus dem gewichteten BIA-Score ab (Schwellen: CRITICALITY_SUGGESTION_THRESHOLDS). Ändert nie die manuelle Einstufung. @param {object} process @returns {'hoch'|'mittel'|'niedrig'} */
function suggestedCriticalityFromBia(process){
  const score = biaScore(process).avg;
  if(score >= CRITICALITY_SUGGESTION_THRESHOLDS.hoch) return 'hoch';
  if(score >= CRITICALITY_SUGGESTION_THRESHOLDS.mittel) return 'mittel';
  return 'niedrig';
}
/* Liefert null, wenn manuelle Einstufung und BIA-Empfehlung übereinstimmen,
   sonst ein Objekt mit beiden Werten und ob eine Begründung vorliegt. */
function criticalityDeviation(process){
  const manual = process.steckbrief.kritikalitaet;
  const suggested = suggestedCriticalityFromBia(process);
  if(manual===suggested) return null;
  return {
    manual, suggested,
    hasJustification: !!String(process.steckbrief.kritikalitaetAbweichungBegruendung||'').trim()
  };
}

/** Erstellt einen neuen, leeren Abhängigkeits-Eintrag. @param {string} processId Ziel-Prozess-ID. @param {string} [type] 'vorgelagert'|'nachgelagert' @returns {object} */
function newDependency(processId, type){
  return { id: uid('dep'), processId, type: type||'vorgelagert', criticality:'mittel', description:'' };
}
/** Prüft eine neue Abhängigkeit VOR dem Hinzufügen auf Selbstreferenz und Duplikat. @param {object} process Ausgangsprozess. @param {string} targetProcessId @param {string} type @returns {{ok:boolean, error?:string}} */
function validateNewDependency(process, targetProcessId, type){
  if(targetProcessId===process.id){
    return { ok:false, error:'Ein Prozess kann nicht von sich selbst abhängen (Selbstreferenz).' };
  }
  const duplicate = (process.dependencies||[]).some(d=>d.processId===targetProcessId && d.type===type);
  if(duplicate){
    return { ok:false, error:'Diese Beziehung (gleicher Prozess, gleiche Richtung) besteht bereits.' };
  }
  return { ok:true };
}
/** Findet Abhängigkeiten, die auf einen nicht (mehr) existierenden Prozess verweisen. @returns {{process:object, dependency:object}[]} */
function orphanedDependencies(){
  const validIds = new Set(STATE.processes.map(p=>p.id));
  const orphans = [];
  STATE.processes.forEach(p=>{
    (p.dependencies||[]).forEach(dep=>{
      if(!validIds.has(dep.processId)){
        orphans.push({ process:p, dependency:dep });
      }
    });
  });
  return orphans;
}
/** Findet Prozesspaare, die sich gegenseitig mit derselben Richtung ('vorgelagert'/'vorgelagert' o. Ä.) referenzieren — logisch widersprüchlich. @returns {{a:object, b:object, type:string}[]} */
function contradictoryDependencies(){
  const contradictions = [];
  const seen = new Set();
  STATE.processes.forEach(a=>{
    (a.dependencies||[]).forEach(depA=>{
      const b = getProcess(depA.processId);
      if(!b) return;
      const key = [a.id, b.id, depA.type].sort().join('|')+':'+depA.type;
      (b.dependencies||[]).forEach(depB=>{
        if(depB.processId===a.id && depB.type===depA.type){
          const pairKey = [a.id,b.id].sort().join('|')+':'+depA.type;
          if(!seen.has(pairKey)){
            seen.add(pairKey);
            contradictions.push({ a, b, type: depA.type });
          }
        }
      });
    });
  });
  return contradictions;
}
/** Release-Engineering 2.0: gemeinsamer Graph-Aufbau für "vorgelagert"-Abhängigkeiten. @returns {Map<string,string[]>} Prozess-ID -> IDs der als vorgelagert hinterlegten Prozesse. */
function buildVorgelagertGraph(){
  return new Map(STATE.processes.map(p=>[p.id, (p.dependencies||[]).filter(d=>d.type==='vorgelagert').map(d=>d.processId)]));
}
/** Erkennt Kreisläufe im "vorgelagert"-Abhängigkeitsgraphen (werden angezeigt, nicht verboten). @returns {string[][]} Liste von Zyklen als Prozessnamen-Folgen. */
function findDependencyCycles(){
  const cycles = [];
  const graph = buildVorgelagertGraph();
  const visiting = new Set(), visited = new Set();
  function dfs(nodeId, path){
    if(visiting.has(nodeId)){
      const cycleStart = path.indexOf(nodeId);
      cycles.push(path.slice(cycleStart).concat(nodeId).map(id=>processName(id)));
      return;
    }
    if(visited.has(nodeId)) return;
    visiting.add(nodeId);
    (graph.get(nodeId)||[]).forEach(next=>dfs(next, path.concat(nodeId)));
    visiting.delete(nodeId);
    visited.add(nodeId);
  }
  STATE.processes.forEach(p=>{ if(!visited.has(p.id)) dfs(p.id, []); });
  return cycles;
}
/** Managementauswertung der Prozessabhängigkeiten: meiste Abhängigkeiten, mögliche SPOFs, kritische Ketten, Prozesse ohne Abhängigkeiten. @returns {object} */
function dependencyOverview(){
  const inDegree = new Map(STATE.processes.map(p=>[p.id, 0]));
  STATE.processes.forEach(p=>{
    (p.dependencies||[]).forEach(d=>{
      if(inDegree.has(d.processId)) inDegree.set(d.processId, inDegree.get(d.processId)+1);
    });
  });
  const mostDependencies = STATE.processes.map(p=>({p, count:(p.dependencies||[]).length})).filter(x=>x.count>0).sort((a,b)=>b.count-a.count).slice(0,5);
  const spofs = STATE.processes.filter(p=>inDegree.get(p.id)>=2 && isProcessKritisch(p));
  const noDependencies = STATE.processes.filter(p=>(p.dependencies||[]).length===0 && !String(p.steckbrief.vorgelagert||'').trim() && !String(p.steckbrief.nachgelagert||'').trim());
  return {
    mostDependencies, spofs, noDependencies,
    criticalChains: criticalDependencyChains(),          // v1.5.1-Fix 3: echte mehrstufige Pfade (>= 3 Prozesse)
    directCriticalDependencies: directCriticalDependencyPairs() // unmittelbare Zweierbeziehungen, bewusst getrennt ausgewiesen
  };
}

/** Ermittelt echte mehrstufige Ketten (>= 3 Prozesse) durchgehend kritischer, verbundener Prozesse, zyklensicher und ohne redundante Teilketten. Ausgabe in Flussrichtung "vorgelagert -> abhängig". @returns {string[][]} */
function criticalDependencyChains(){
  const graph = buildVorgelagertGraph();
  const maximalPaths = [];

  function extend(nodeId, path){
    const next = (graph.get(nodeId)||[]).filter(nid=>{
      const n = getProcess(nid);
      return n && isProcessKritisch(n) && !path.includes(nid); // Zyklenschutz: Pfad nie durch denselben Knoten zweimal
    });
    if(next.length===0){
      if(path.length>=3) maximalPaths.push(path.slice()); // erst ab 3 Prozessen zählt es als "Kette"
      return;
    }
    next.forEach(nid=>extend(nid, path.concat(nid)));
  }

  // Traversal folgt weiterhin "wer hängt von wem ab" (abhängiger Prozess ->
  // vorgelagerter Prozess), das ist die natürliche Graphrichtung der
  // gespeicherten "vorgelagert"-Referenzen.
  STATE.processes.filter(isProcessKritisch).forEach(start=>extend(start.id, [start.id]));

  // v1.5.2-Fix: Für die AUSGABE wird die Richtung umgedreht — fachlich
  // korrekt ist "vorgelagerter Prozess -> abhängiger Prozess" (das entspricht
  // dem tatsächlichen Wirkungs-/Lieferfluss, nicht der internen Referenz-
  // richtung). Beispiel: A hängt von B ab, B hängt von C ab -> Ausgabe C → B → A.
  const reversedPaths = maximalPaths.map(p => p.slice().reverse());

  // v1.5.2-Fix (geringer Hinweis): redundante Teilketten entfernen — eine
  // Kette entfällt, wenn ihre komplette ID-Folge bereits als zusammen-
  // hängender Abschnitt einer LÄNGEREN Kette vorkommt (z. B. B→C→D entfällt,
  // wenn A→B→C→D existiert).
  const nonRedundant = reversedPaths.filter((path, idx) => {
    return !reversedPaths.some((other, otherIdx) => {
      if(otherIdx===idx || other.length<=path.length) return false;
      return containsContiguousIdSequence(other, path);
    });
  });

  const seen = new Set();
  const chains = [];
  nonRedundant.forEach(path=>{
    const key = path.join('>');
    if(seen.has(key)) return;
    seen.add(key);
    chains.push(path.map(id=>processName(id)));
  });
  return chains;
}
/** Prüft, ob shorter als zusammenhängender, ordnungserhaltender Abschnitt in longer vorkommt. @param {Array} longer @param {Array} shorter @returns {boolean} */
function containsContiguousIdSequence(longer, shorter){
  for(let i=0; i<=longer.length-shorter.length; i++){
    let match = true;
    for(let j=0; j<shorter.length; j++){
      if(longer[i+j]!==shorter[j]){ match=false; break; }
    }
    if(match) return true;
  }
  return false;
}
/** Unmittelbare (einstufige) kritische Prozess-Nachbarschaften — bewusst getrennt von criticalDependencyChains(), da keine "Kette". @returns {string[][]} */
function directCriticalDependencyPairs(){
  const graph = buildVorgelagertGraph();
  const pairs = [];
  STATE.processes.filter(isProcessKritisch).forEach(start=>{
    (graph.get(start.id)||[]).forEach(nextId=>{
      const next = getProcess(nextId); // next = der vorgelagerte (upstream) Prozess von start
      if(next && isProcessKritisch(next)){
        pairs.push([next, start].map(p=>p.steckbrief.name||'(ohne Namen)')); // vorgelagert -> abhängig
      }
    });
  });
  return pairs;
}

/** Liefert alle Ressourcen, die manuell als Single Point of Failure markiert sind. @returns {object[]} */
function singlePointOfFailureResources(){
  return STATE.resources.filter(r=>r.singlePointOfFailure===true);
}
/** Findet Ressourcen, deren Recovery-Anforderung langsamer ist als die MTA eines abhängigen Prozesses. @returns {{resource:object, process:object, recoveryHours:number, mtaHours:number}[]} */
function resourcesWithConflictingRecovery(){
  const conflicts = [];
  STATE.resources.forEach(r=>{
    const rrHours = durationToHours(r.recoveryRequirement && r.recoveryRequirement.wert, r.recoveryRequirement && r.recoveryRequirement.einheit);
    if(rrHours===null) return;
    r.prozesse.forEach(pid=>{
      const p = getProcess(pid);
      if(!p) return;
      const mtaHours = durationToHours(p.steckbrief.mtaWert, p.steckbrief.mtaEinheit);
      if(mtaHours!==null && rrHours > mtaHours){
        conflicts.push({ resource:r, process:p, recoveryHours:rrHours, mtaHours });
      }
    });
  });
  return conflicts;
}
/** Liefert die für die Kategorie einer Ressource empfohlenen, aber noch nicht ausgefüllten Felder. @param {object} resource @returns {string[]} */
function resourceMissingRecommendedFields(resource){
  const recommended = RESOURCE_RECOMMENDED_FIELDS[resource.kategorie];
  if(!recommended) return [];
  return recommended.filter(field=>{
    if(field==='recoveryRequirement') return !(resource.recoveryRequirement && String(resource.recoveryRequirement.wert||'').trim()!=='');
    if(field==='alternative') return resource.alternative==='nein' && !resource.altBeschreibung;
    return !String(resource[field]||'').trim();
  });
}

/* ---------------------------------------------------------------------
   5j) MESSBARE MINDESTFÄHIGKEIT (v1.5.0, P13)
   Prozent ODER Menge — nie erzwungen, nie ineinander umgerechnet (dafür
   fehlt die fachliche Grundlage, z. B. die Gesamtmenge im Normalbetrieb).
   --------------------------------------------------------------------- */
/** Release-Engineering 2.0: gemeinsame Prüfung, ob Prozent-/Mengenangabe der Mindestfähigkeit gepflegt sind. @param {object} mc minimumCapability-Objekt. @returns {{hasPercentage:boolean, hasQuantity:boolean}} */
function minimumCapabilityPresence(mc){
  return {
    hasPercentage: mc.percentage!==null && mc.percentage!==undefined && mc.percentage!=='',
    hasQuantity: mc.quantity!==null && mc.quantity!==undefined && mc.quantity!==''
  };
}
/** P13: erkennt Qualitätslücken der Mindestfähigkeit (fehlender Modus trotz Werten, unplausible Prozent-/Mengenwerte, Menge ohne Einheit). @param {object} process @returns {string[]} */
function minimumCapabilityQualityGaps(process){
  const mc = process.minfaehigkeit.minimumCapability || {};
  const gaps = [];
  const {hasPercentage, hasQuantity} = minimumCapabilityPresence(mc);
  const hasAnything = hasPercentage || hasQuantity || String(mc.description||'').trim();

  if(process.minfaehigkeit.muss.length>0 && !hasAnything){
    gaps.push('Es sind "Muss funktionieren"-Einträge vorhanden, aber keine messbare Mindestfähigkeit (Prozent, Menge oder Beschreibung) hinterlegt.');
  }
  // v1.5.1-Fix 2: Prozent UND Menge gleichzeitig gepflegt, ohne eindeutigen
  // Modus, ist ein klarer Qualitätsmangel — welcher Wert gilt?
  if(hasPercentage && hasQuantity && mc.mode!=='percentage' && mc.mode!=='quantity'){
    gaps.push('Prozent- und Mengenangabe sind gleichzeitig gepflegt, ohne dass ein eindeutiger Modus gewählt wurde — bitte oben "Prozent" oder "Menge" auswählen.');
  } else if(hasPercentage && mc.mode==='percentage'){
    const pct = Number(mc.percentage);
    if(isNaN(pct) || pct<0 || pct>100){
      gaps.push('Prozentangabe ("'+mc.percentage+'") liegt außerhalb des plausiblen Bereichs 0–100 %.');
    }
  } else if(hasQuantity && mc.mode==='quantity'){
    const qty = Number(mc.quantity);
    if(isNaN(qty) || qty<0){
      gaps.push('Mengenangabe ("'+mc.quantity+'") ist negativ oder nicht auswertbar.');
    }
    if(qty>=0 && !String(mc.unit||'').trim()){
      gaps.push('Mengenangabe ohne Einheit — bitte Einheit ergänzen (z. B. "Bestellungen", "Standorte").');
    }
  }
  return gaps;
}
/** Formatiert die Mindestfähigkeit für die Anzeige gemäß gewähltem Modus (Prozent/Menge/Beschreibung), ohne zwischen den Werten umzurechnen. @param {object} mc @returns {string} */
function formatMinimumCapability(mc){
  if(!mc) return '–';
  const {hasPercentage, hasQuantity} = minimumCapabilityPresence(mc);
  let main = '';
  if(mc.mode==='percentage' && hasPercentage) main = mc.percentage+' %';
  else if(mc.mode==='quantity' && hasQuantity) main = mc.quantity+' '+(mc.unit||'')+(mc.period?' / '+mc.period:'');
  else if(mc.mode===null && hasPercentage && hasQuantity) main = '⚠ uneindeutig: '+mc.percentage+' % / '+mc.quantity+' '+(mc.unit||'');
  else if(hasPercentage) main = mc.percentage+' %'; // Altdaten ohne mode, aber eindeutig
  else if(hasQuantity) main = mc.quantity+' '+(mc.unit||'')+(mc.period?' / '+mc.period:'');
  if(!main) return mc.description ? mc.description : '–';
  return main + (mc.description ? ' — '+mc.description : '');
}

/** Zählt rote/gelbe/grüne Resilienz-Checkpunkte eines Prozesses. @param {object} process @returns {{rot:number, gelb:number, gruen:number}} */
function resilienzSummary(process){
  const items = process.resilienz;
  const rot = items.filter(i=>i.status==='rot').length;
  const gelb = items.filter(i=>i.status==='gelb').length;
  const gruen = items.filter(i=>i.status==='gruen').length;
  return {rot, gelb, gruen, total:items.length};
}

/* ---------------------------------------------------------------------
   5b) MTA/RTO/RPO-PLAUSIBILITÄT (v1.2.0)
   --------------------------------------------------------------------- */
/* Interpretiert Freitext-/Zahlenwerte wie "4", "4 Stunden", "30 Minuten",
   "2 Tage", "1 h", "24h" und liefert das Ergebnis in Stunden. null bei
   nicht interpretierbaren Werten. unitOptional kann eine separate
   Einheit liefern (z. B. aus mtaEinheit), falls value selbst keine enthält. */
/** Formatiert einen RTO/RPO-Wert für die Anzeige — robust gegenüber altem String- und neuem Objektformat. @param {*} tv @returns {string} */
function formatTimeValueForDisplay(tv){
  if(tv===undefined || tv===null || tv==='') return '–';
  if(typeof tv==='string') return tv; // alter Freitext-Snapshot (Schema < 3)
  if(typeof tv==='object'){
    if(tv.legacyText) return tv.legacyText+' (unstrukturiert)';
    if(tv.wert!=='' && tv.wert!==undefined && tv.wert!==null) return tv.wert+' '+tv.einheit;
    return '–';
  }
  return String(tv);
}
/** Vergleicht zwei RTO/RPO-Werte auf Basis ihrer Anzeigedarstellung (robust gegenüber altem String- und neuem Objektformat). @param {*} a @param {*} b @returns {boolean} */
function timeValuesEqual(a, b){
  return formatTimeValueForDisplay(a) === formatTimeValueForDisplay(b);
}

/** Wandelt einen (Zahl, Einheit)-Zeitwert in Stunden um; liefert null bei nicht auswertbaren Werten. Einheit wird bei Fehlen als Stunden angenommen — NUR sinnvoll, wenn die Einheit separat/strukturiert vorliegt (siehe parseStructuredDuration() für Freitext-Interpretation). @param {*} value @param {string} [unitOptional] @returns {number|null} */
function durationToHours(value, unitOptional){
  if(value===undefined || value===null) return null;
  const str = String(value).trim().toLowerCase().replace(',', '.');
  if(str==='') return null;

  // reine Zahl ohne erkennbare Einheit im Text -> ggf. unitOptional verwenden
  const pureNumber = str.match(/^-?\d+(\.\d+)?$/);
  if(pureNumber){
    const num = parseFloat(str);
    if(isNaN(num)) return null;
    return applyUnit(num, unitOptional);
  }

  const match = str.match(/^(-?\d+(?:\.\d+)?)\s*([a-zäöü]+)?/);
  if(!match) return null;
  const num = parseFloat(match[1]);
  if(isNaN(num)) return null;
  const unitText = match[2] || unitOptional;
  return applyUnit(num, unitText);

  function applyUnit(n, unit){
    const u = String(unit||'').trim().toLowerCase();
    if(u==='' ) return n; // keine Einheit erkennbar -> als Stunden annehmen
    if(['h','std','stunde','stunden'].includes(u)) return n;
    if(['min','minute','minuten','m'].includes(u)) return n/60;
    if(['t','tag','tage','d','day','days'].includes(u)) return n*24;
    if(['w','woche','wochen'].includes(u)) return n*168;
    return n; // unbekannte Einheit -> konservativ als Stunden interpretieren
  }
}

/* Prüft MTA gegen RTO/RPO auf fachliche Widersprüche. Blockiert nichts,
   liefert nur Hinweise (bad/warn/ok). */
/** Prüft MTA/RTO/RPO eines Prozesses auf fachliche Plausibilität (RTO>MTA, RTO=MTA knapp, RPO=0 anspruchsvoll, RPO bei Datenabhängigkeit usw.). @param {object} process @returns {{mtaHours:(number|null), rtoHours:(number|null), rpoHours:(number|null), findings:object[]}} */
function timePlausibility(process){
  const s = process.steckbrief;
  const mtaHours = durationToHours(s.mtaWert, s.mtaEinheit);
  const rto = s.rto || {};
  const rpo = s.rpo || {};
  const rtoHours = durationToHours(rto.wert, rto.einheit);
  const rpoHours = durationToHours(rpo.wert, rpo.einheit);
  const findings = [];

  if(mtaHours===null){
    findings.push({type:'warn', message:'MTA ist nicht auswertbar — dadurch ist auch keine belastbare RTO-Prüfung möglich.'});
  } else if(mtaHours<0){
    findings.push({type:'warn', message:'MTA ist negativ — bitte prüfen.'});
  } else if(mtaHours===0 && String(s.mtaWert).trim()!==''){
    findings.push({type:'warn', message:'MTA ist 0 — unüblich, bitte prüfen.'});
  }

  if(rto.legacyText){
    findings.push({type:'warn', message:'RTO enthält einen nicht übernommenen Freitextwert aus einer älteren Version ("'+rto.legacyText+'") — bitte strukturiert neu erfassen.'});
  } else if(rtoHours===null){
    findings.push({type:'warn', message:'RTO ist nicht auswertbar.'});
  } else if(rtoHours<0){
    findings.push({type:'warn', message:'RTO ist negativ — bitte prüfen.'});
  }

  if(rpo.legacyText){
    findings.push({type:'warn', message:'RPO enthält einen nicht übernommenen Freitextwert aus einer älteren Version ("'+rpo.legacyText+'") — bitte strukturiert neu erfassen.'});
  } else if(rpoHours===null){
    findings.push({type:'warn', message:'RPO ist nicht auswertbar.'});
  } else if(rpoHours<0){
    findings.push({type:'warn', message:'RPO ist negativ — bitte prüfen.'});
  } else if(rpoHours===0){
    findings.push({type:'warn', message:'RPO = 0 ("kein Datenverlust tolerierbar") ist eine besonders anspruchsvolle Anforderung — bitte technische Machbarkeit prüfen.'});
  }

  if(mtaHours!==null && rtoHours!==null){
    if(rtoHours > mtaHours){
      findings.push({type:'bad', message:'RTO liegt über MTA – Wiederanlaufziel ist langsamer als maximal tolerierbare Ausfallzeit.'});
    } else if(rtoHours === mtaHours){
      findings.push({type:'warn', message:'RTO entspricht genau der MTA — knapp bemessen, kein Puffer für Verzögerungen im Wiederanlauf.'});
    }
  }

  // RPO bei datenabhängigen Prozessen: liegt eine verknüpfte Ressource der Kategorie "Daten" vor?
  const hatDatenRessource = (typeof STATE!=='undefined') && STATE.resources.some(r=>r.kategorie==='Daten' && r.prozesse.includes(process.id));
  if(hatDatenRessource && rpoHours===null && !rpo.legacyText){
    findings.push({type:'warn', message:'Der Prozess ist mit einer Daten-Ressource verknüpft, aber es ist kein RPO gepflegt.'});
  }

  if(findings.length===0){
    findings.push({type:'ok', message:'Zeitwerte plausibel.'});
  }
  return { mtaHours, rtoHours, rpoHours, findings };
}

/** Prüft eine Maßnahme auf Vollständigkeit (Titel, Verantwortlicher, Termin bei hoher Priorität). @param {object} m @returns {{valid:boolean, findings:object[]}} */
function validateMassnahme(m){
  const findings = [];
  const isErledigt = m.status === 'erledigt';

  if(!String(m.titel||'').trim()){
    findings.push({type:'bad', field:'titel', message:'Titel fehlt.'});
  }
  if(!String(m.verantwortlich||'').trim() && !isErledigt){
    findings.push({type:'warn', field:'verantwortlich', message:'Kein Verantwortlicher hinterlegt.'});
  }
  if(!String(m.termin||'').trim() && !isErledigt){
    findings.push({type:'warn', field:'termin', message:'Kein Termin hinterlegt.'});
  }
  if(m.prioritaet==='hoch' && !String(m.termin||'').trim()){
    findings.push({type:'bad', field:'termin', message:'Hohe Priorität ohne Termin.'});
  }
  if(isErledigt && m.termin){
    const t = new Date(m.termin);
    const today = new Date(); today.setHours(0,0,0,0);
    if(!isNaN(t.getTime()) && t.getTime() > today.getTime()){
      findings.push({type:'warn', field:'termin', message:'Als erledigt markiert, Termin liegt aber in der Zukunft.'});
    }
  }
  if(!String(m.prozessId||'').trim()){
    findings.push({type:'warn', field:'prozessId', message:'Kein Prozessbezug vorhanden.'});
  }

  const valid = !findings.some(f=>f.type==='bad');
  return { valid, findings };
}
/** Leitet aus validateMassnahme() eine Ampel-Kurzbewertung ab. @param {object} m @returns {'bad'|'warn'|'ok'} */
function massnahmeQuality(m){
  const {findings} = validateMassnahme(m);
  if(findings.some(f=>f.type==='bad')) return 'bad';
  if(findings.some(f=>f.type==='warn')) return 'warn';
  return 'ok';
}

/* ---------------------------------------------------------------------
   5k) MASSNAHMEN: AUFWAND, RISIKOHERKUNFT, ENTSCHEIDUNG (v1.6.0, P14)
   --------------------------------------------------------------------- */
/** Ordnet eine Maßnahme der Nutzen/Aufwand-Matrix zu (Nutzen aus der Priorität abgeleitet). @param {object} m @returns {string} Schlüssel für MASSNAHME_MATRIX_LABELS. */
function massnahmeMatrixQuadrant(m){
  const nutzenHoch = m.prioritaet==='hoch' || m.prioritaet==='mittel';
  const aufwandHoch = m.aufwand==='hoch';
  if(nutzenHoch && !aufwandHoch) return 'hoch-niedrig';   // Quick Win
  if(nutzenHoch && aufwandHoch) return 'hoch-hoch';       // Großprojekt
  if(!nutzenHoch && !aufwandHoch) return 'niedrig-niedrig'; // Kann warten
  return 'niedrig-hoch';                                   // Infrage stellen
}
const MASSNAHME_MATRIX_LABELS = {
  'hoch-niedrig': 'Quick Win (hoher Nutzen, niedriger Aufwand)',
  'hoch-hoch': 'Großprojekt (hoher Nutzen, hoher Aufwand)',
  'niedrig-niedrig': 'Kann warten (niedriger Nutzen, niedriger Aufwand)',
  'niedrig-hoch': 'Infrage stellen (niedriger Nutzen, hoher Aufwand)'
};
/** P14: true, wenn eine Maßnahme einen vergangenen Termin hat und nicht erledigt ist. @param {object} m @returns {boolean} */
function massnahmeIsOverdue(m){
  if(m.status==='erledigt' || !m.termin) return false;
  const t = new Date(m.termin); const today = new Date(); today.setHours(0,0,0,0);
  return !isNaN(t.getTime()) && t.getTime() < today.getTime();
}
/** P14: true, wenn eine Maßnahme als erledigt markiert ist, aber kein Wirksamkeitsnachweis-Datum hinterlegt wurde. @param {object} m @returns {boolean} */
function massnahmeNeedsEffectivenessProof(m){
  return m.status==='erledigt' && !String(m.wirksamkeitGeprueftAm||'').trim();
}

/* ---------------------------------------------------------------------
   5l) MANAGEMENTSICHT AUF ENTSCHEIDUNGEN AUSGERICHTET (v1.6.0, P15)
   Trennt bewusst DATENQUALITÄT (fehlende/unklare Angaben) von tatsächlich
   BESTÄTIGTEM operativem Risiko — eine fehlende Angabe ist kein bestätigtes
   Risiko, sondern eine Erhebungslücke.
   --------------------------------------------------------------------- */
function workbookDataCompleteness(){
  if(STATE.processes.length===0) return 0;
  const sum = STATE.processes.reduce((acc,p)=>acc+processProgress(p).overall, 0);
  return Math.round((sum/STATE.processes.length)*100);
}
/** P15: Anzahl Prozesse mit einem kritischen Zeitwertkonflikt (RTO > MTA). @returns {number} */
function criticalTimeConflictCount(){
  return STATE.processes.filter(p=>timePlausibility(p).findings.some(f=>f.type==='bad')).length;
}
/** P15: Anzahl offener Maßnahmen mit hoher Priorität. @returns {number} */
function openCriticalMassnahmenCount(){
  return STATE.massnahmen.filter(m=>m.prioritaet==='hoch' && m.status!=='erledigt').length;
}
/** P15: Anzahl überfälliger Maßnahmen (workbookweit). @returns {number} */
function overdueMassnahmenCount(){
  return STATE.massnahmen.filter(massnahmeIsOverdue).length;
}
/* Block "Gesamtstatus" — sechs Kennzahlen, jede mit einer Navigationsaktion
   für die Klickbarkeit (Kennzahl -> zugehörige Datensätze). */
function managementOverallStatus(){
  return {
    ampel: workbookAmpel(),
    completeness: workbookDataCompleteness(),
    criticalProcessCount: STATE.processes.filter(isProcessKritisch).length,
    timeConflictCount: criticalTimeConflictCount(),
    openCriticalMassnahmen: openCriticalMassnahmenCount(),
    overdueMassnahmen: overdueMassnahmenCount()
  };
}
/** P15: strukturierte Top-Risiken je kritischem Prozess mit Ursache/Ressource/MTA/Notbetrieb/Maßnahme/Entscheidungsbedarf — nur bestätigte Risiken, keine Datenqualitätslücken. @returns {object[]} */
function topRisksStructured(){
  const risks = [];
  STATE.processes.filter(isProcessKritisch).forEach(p=>{
    const tp = timePlausibility(p);
    const hasBadTime = tp.findings.some(f=>f.type==='bad');
    const notbetriebVorhanden = !!String(p.notbetrieb.entscheidung||'').trim();
    const resilienzRot = p.resilienz.filter(r=>r.status==='rot');
    const kritischeRessourcenOhneAlt = STATE.resources.filter(r=>r.prozesse.includes(p.id) && r.alternative==='nein');
    const ursachen = [];
    if(hasBadTime) ursachen.push('RTO über MTA');
    if(!notbetriebVorhanden) ursachen.push('Kein Notbetrieb definiert');
    if(resilienzRot.length>0) ursachen.push(resilienzRot.length+' roter Resilienzpunkt(e)');
    if(kritischeRessourcenOhneAlt.length>0) ursachen.push('Kritische Ressource(n) ohne Alternative');
    if(ursachen.length===0) return; // kein bestätigtes Risiko für diesen Prozess

    const massnahmeVorhanden = STATE.massnahmen.some(m=>m.prozessId===p.id);
    risks.push({
      process: p,
      ursache: ursachen.join('; '),
      ressource: kritischeRessourcenOhneAlt.map(r=>r.name||'(ohne Namen)').join(', ') || '–',
      mta: (p.steckbrief.mtaWert!==''&&p.steckbrief.mtaWert!==undefined) ? (p.steckbrief.mtaWert+' '+p.steckbrief.mtaEinheit) : '–',
      notbetriebVorhanden,
      massnahmeVorhanden,
      entscheidungErforderlich: hasBadTime || (resilienzRot.length>0 && !massnahmeVorhanden) || (!notbetriebVorhanden)
    });
  });
  const severity = r => (r.entscheidungErforderlich?0:1);
  risks.sort((a,b)=>severity(a)-severity(b));
  return risks;
}
/** P15: sammelt Datenqualitätslücken (fehlender Verantwortlicher, unbegründete Abweichung, fehlendes RTO/RPO, ungültige Referenz, ungetesteter Notbetrieb) — bewusst getrennt von bestätigten Risiken. @returns {object[]} */
function dataQualityWarnings(){
  const warnings = [];
  STATE.processes.forEach(p=>{
    if(!String(p.steckbrief.verantwortlicher||'').trim()){
      warnings.push({ process:p, category:'Verantwortlicher fehlt', message:'Kein Prozessverantwortlicher hinterlegt.' });
    }
    const dev = criticalityDeviation(p);
    if(dev && !dev.hasJustification){
      warnings.push({ process:p, category:'Kritikalitätsabweichung unbegründet', message:'Manuelle Kritikalität ('+kritikalitaetLabel(dev.manual)+') weicht von der BIA-Empfehlung ('+kritikalitaetLabel(dev.suggested)+') ab, ohne Begründung.' });
    }
    const rtoMissing = !p.steckbrief.rto.legacyText && String(p.steckbrief.rto.wert||'')==='';
    const rpoMissing = !p.steckbrief.rpo.legacyText && String(p.steckbrief.rpo.wert||'')==='';
    if(rtoMissing || rpoMissing){
      warnings.push({ process:p, category:'RTO/RPO unvollständig', message:(rtoMissing?'RTO':'')+(rtoMissing&&rpoMissing?' und ':'')+(rpoMissing?'RPO':'')+' nicht gepflegt.' });
    }
    if(!String(p.notbetrieb.getestetAm||'').trim()){
      warnings.push({ process:p, category:'Notbetrieb ungetestet', message:'Kein Testdatum für den Notbetrieb hinterlegt.' });
    }
  });
  orphanedDependencies().forEach(o=>{
    warnings.push({ process:o.process, category:'Ungültige Referenz', message:'Abhängigkeit verweist auf einen nicht mehr vorhandenen Prozess.' });
  });
  return warnings;
}
/** P15: strukturierter Entscheidungsbedarf aus Kritikalitätsabweichungen und Maßnahmen-Entscheidungsbedarf. @returns {{entscheidung:string, entscheider:string, datum:string, konsequenz:string}[]} */
function entscheidungsbedarfStructured(){
  const items = [];
  STATE.processes.forEach(p=>{
    const dev = criticalityDeviation(p);
    if(dev && !dev.hasJustification){
      items.push({
        entscheidung: 'Kritikalitätseinstufung von "'+(p.steckbrief.name||'(ohne Namen)')+'" bestätigen oder Abweichung begründen',
        entscheider: p.steckbrief.verantwortlicher || '(nicht benannt)',
        datum: '',
        konsequenz: 'Manuelle Einstufung und BIA-Empfehlung widersprechen sich weiter unbegründet.'
      });
    }
  });
  STATE.massnahmen.filter(m=>String(m.entscheidungsbedarf||'').trim()).forEach(m=>{
    items.push({
      entscheidung: m.entscheidungsbedarf,
      entscheider: m.genehmiger || '(nicht benannt)',
      datum: m.termin,
      konsequenz: 'Maßnahme "'+(m.titel||'(ohne Titel)')+'" kann ohne Entscheidung nicht abgeschlossen werden.'
    });
  });
  return items;
}

/* ---------------------------------------------------------------------
   5m) FREIGABESTATUS FACHLICH ABSICHERN (v1.6.0, P17)
   Blockierende Kriterien sind zentral in RELEASE_CHECK_CONFIG konfigurierbar.
   --------------------------------------------------------------------- */
const RELEASE_CHECK_CONFIG = {
  missingRequiredFields:            { blocker:true,  label:'Pflichtfelder fehlen' },
  timeConflicts:                    { blocker:true,  label:'Zeitwertkonflikte (RTO über MTA)' },
  unjustifiedCriticalityDeviations: { blocker:true,  label:'Unbegründete Kritikalitätsabweichungen' },
  criticalProcessesNoFallback:      { blocker:true,  label:'Kritische Prozesse ohne Notbetrieb' },
  redResilienceNoMeasure:           { blocker:true,  label:'Rote Resilienzpunkte ohne Maßnahme' },
  invalidReferences:                { blocker:true,  label:'Ungültige Referenzen' },
  missingResponsibles:              { blocker:false, label:'Fehlende Prozessverantwortliche' },
  criticalResourcesNoAlternative:   { blocker:false, label:'Kritische Ressourcen ohne Alternative' },
  overdueCriticalMeasures:          { blocker:false, label:'Überfällige kritische Maßnahmen' },
  unconfirmedMigrations:            { blocker:false, label:'Unbestätigte Migrationsergebnisse' }
};
/** P17: prüft das gesamte Workbook gegen die in RELEASE_CHECK_CONFIG zentral konfigurierten Blocker-/Warnkriterien für einen Statuswechsel zu "Zur Freigabe"/"Freigegeben". @returns {{ok:boolean, blockers:object[], warnings:object[]}} */
function releaseReadinessCheck(){
  const findings = { missingRequiredFields:[], timeConflicts:[], unjustifiedCriticalityDeviations:[],
    criticalProcessesNoFallback:[], redResilienceNoMeasure:[], invalidReferences:[],
    missingResponsibles:[], criticalResourcesNoAlternative:[], overdueCriticalMeasures:[], unconfirmedMigrations:[] };

  STATE.processes.forEach(p=>{
    const name = p.steckbrief.name || '(ohne Namen)';
    if(!String(p.steckbrief.name||'').trim() || !String(p.steckbrief.ziel||'').trim() || String(p.steckbrief.mtaWert||'')===''){
      findings.missingRequiredFields.push('Prozess "'+name+'": Pflichtfelder (Name/Ziel/MTA) unvollständig.');
    }
    if(!String(p.steckbrief.verantwortlicher||'').trim()){
      findings.missingResponsibles.push('Prozess "'+name+'" hat keinen Verantwortlichen.');
    }
    if(timePlausibility(p).findings.some(f=>f.type==='bad')){
      findings.timeConflicts.push('Prozess "'+name+'": RTO liegt über MTA.');
    }
    const dev = criticalityDeviation(p);
    if(dev && !dev.hasJustification){
      findings.unjustifiedCriticalityDeviations.push('Prozess "'+name+'": Kritikalitätsabweichung ohne Begründung.');
    }
    if(isProcessKritisch(p) && !String(p.notbetrieb.entscheidung||'').trim()){
      findings.criticalProcessesNoFallback.push('Kritischer Prozess "'+name+'" hat keinen definierten Notbetrieb.');
    }
    p.resilienz.filter(r=>r.status==='rot').forEach(r=>{
      const hatMassnahme = STATE.massnahmen.some(m=>m.prozessId===p.id && m.status!=='erledigt');
      if(!hatMassnahme){
        findings.redResilienceNoMeasure.push('Prozess "'+name+'": roter Resilienzpunkt "'+r.label+'" ohne offene Maßnahme.');
      }
    });
    // unbestätigte Migrationsergebnisse: verbliebene Freitext-Altwerte oder ungeklärte Mindestfähigkeits-Mehrdeutigkeit
    if(p.steckbrief.rto.legacyText || p.steckbrief.rpo.legacyText){
      findings.unconfirmedMigrations.push('Prozess "'+name+'": RTO/RPO enthält noch unstrukturierten Altwert.');
    }
    const mc = p.minfaehigkeit.minimumCapability;
    if(mc && mc.mode===null && mc.percentage!==null && mc.percentage!=='' && mc.quantity!==null && mc.quantity!==''){
      findings.unconfirmedMigrations.push('Prozess "'+name+'": Mindestfähigkeit-Modus nach Migration nicht eindeutig gewählt.');
    }
  });

  STATE.resources.filter(r=>r.alternative==='nein' && r.kritikalitaet==='hoch').forEach(r=>{
    findings.criticalResourcesNoAlternative.push('Ressource "'+(r.name||'(ohne Namen)')+'" ist kritisch und hat keine Alternative.');
  });
  STATE.massnahmen.filter(m=>massnahmeIsOverdue(m) && m.prioritaet==='hoch').forEach(m=>{
    findings.overdueCriticalMeasures.push('Kritische Maßnahme "'+(m.titel||'(ohne Titel)')+'" ist überfällig.');
  });
  orphanedDependencies().forEach(o=>{
    findings.invalidReferences.push('Prozess "'+(o.process.steckbrief.name||'–')+'": Abhängigkeit verweist auf nicht vorhandenen Prozess.');
  });

  const blockers = [], warnings = [];
  Object.keys(findings).forEach(cat=>{
    if(findings[cat].length===0) return;
    const target = RELEASE_CHECK_CONFIG[cat].blocker ? blockers : warnings;
    target.push({ category: cat, label: RELEASE_CHECK_CONFIG[cat].label, items: findings[cat] });
  });
  return { ok: blockers.length===0, blockers, warnings };
}


/** Berechnet den Bearbeitungsfortschritt eines Prozesses je Bereich und insgesamt. @param {object} process @returns {{sections:object, overall:number}} */
function processProgress(process){
  const sections = {
    steckbrief: requiredFilled(process.steckbrief, ['name','verantwortlicher','fachbereich','ziel','kritikalitaet','mtaWert']),
    sixty: requiredFilled(process.sixty, ['nutzen','normalbetrieb','kritischWeil','beiAusfall']),
    bia: BIA_CATEGORIES.every(c=>process.bia[c.key].beschreibung.trim()!=='') ? 1 : (BIA_CATEGORIES.filter(c=>process.bia[c.key].beschreibung.trim()!=='').length / BIA_CATEGORIES.length),
    minfaehigkeit: (process.minfaehigkeit.muss.length>0 ? 1:0),
    ressourcen: (STATE.resources.some(r=>r.prozesse.includes(process.id)) ? 1:0),
    notbetrieb: requiredFilled(process.notbetrieb, ['ausloeser','entscheidung','schritt1']),
    resilienz: process.resilienz.filter(i=>i.status!=='gelb' || i.kommentar.trim()!=='').length / process.resilienz.length,
    massnahmen: (STATE.massnahmen.some(m=>m.prozessId===process.id) ? 1:0)
  };
  const keys = Object.keys(sections);
  const overall = keys.reduce((s,k)=>s+sections[k],0) / keys.length;
  return {sections, overall};
}
/** Zählt, wie viele der übergebenen Pflichtfelder eines Objekts tatsächlich befüllt sind (für Fortschrittsanzeigen). @param {object} obj @param {string[]} keys @returns {number} */
function requiredFilled(obj, keys){
  const filled = keys.filter(k=> String(obj[k]||'').trim() !== '').length;
  return filled / keys.length;
}

/** true, wenn ein Prozess die Kritikalität "hoch" trägt. @param {object} process @returns {boolean} */
function isProcessKritisch(process){
  return process.steckbrief.kritikalitaet === 'hoch' || biaScore(process).klasse === 'Hoch';
}

/* Abhängigkeitscluster: Ressourcen die in mehreren Prozessen vorkommen,
   gruppiert nach Kategorie, priorisiert nach Häufigkeit × Kritikalität. */
function buildClusters(){
  const critWeight = {hoch:3, mittel:2, niedrig:1};
  return STATE.resources
    .map(r=>({
      ...r,
      count: r.prozesse.length,
      score: r.prozesse.length * (critWeight[r.kritikalitaet]||1)
    }))
    .filter(r=>r.count>=1)
    .sort((a,b)=>b.score-a.score);
}

/** Liefert alle Ressourcen der Kategorie "Personen", die für einen Prozess kritisch sind. @param {object} process @returns {object[]} */
function keyPersons(){
  return buildClusters().filter(r=>r.kategorie==='Personen' && r.count>=2);
}
/** Liefert alle Ressourcen der Kategorie "IT-Systeme"/"Anwendungen", die für einen Prozess kritisch sind. @param {object} process @returns {object[]} */
function criticalSystems(){
  return buildClusters().filter(r=>(r.kategorie==='IT-Systeme'||r.kategorie==='Anwendungen') && r.count>=1).sort((a,b)=>b.count-a.count);
}
/** Liefert alle Ressourcen der Kategorie "Dienstleister"/"Lieferanten", die für einen Prozess kritisch sind. @param {object} process @returns {object[]} */
function criticalSuppliers(){
  return buildClusters().filter(r=>(r.kategorie==='Lieferanten'||r.kategorie==='Dienstleister') && r.count>=1).sort((a,b)=>b.count-a.count);
}

/* ---------------------------------------------------------------------
   5d) RESSOURCEN-NORMALISIERUNG & DUPLIKATERKENNUNG (v1.2.0)
   --------------------------------------------------------------------- */
/** Normalisiert einen Ressourcennamen für den Duplikatabgleich (Kleinschreibung, Trennzeichen vereinheitlicht). @param {string} name @returns {string} */
function normalizeResourceName(name){
  let s = String(name||'').trim().toLowerCase();
  s = s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
  s = s.replace(/[-_/]+/g,' ');
  s = s.replace(/[^\w\s]/g,' ');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}

/** Berechnet die Levenshtein-Distanz zweier Strings (für die Ressourcen-Duplikaterkennung). @param {string} a @param {string} b @returns {number} */
function levenshtein(a, b){
  a = a||''; b = b||'';
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  let prev = new Array(n+1);
  let cur = new Array(n+1);
  for(let j=0;j<=n;j++) prev[j] = j;
  for(let i=1;i<=m;i++){
    cur[0] = i;
    for(let j=1;j<=n;j++){
      const cost = a[i-1]===b[j-1] ? 0 : 1;
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
    }
    [prev, cur] = [cur, prev];
  }
  return prev[n];
}

/** Findet mögliche Namensdubletten zu einer Ressource im globalen Pool. @param {object} resource @returns {object[]} */
function findPotentialDuplicateResources(resource){
  const norm = normalizeResourceName(resource.name);
  if(!norm) return [];
  return STATE.resources.filter(other=>{
    if(other.id===resource.id) return false;
    const otherNorm = normalizeResourceName(other.name);
    if(!otherNorm) return false;
    if(otherNorm===norm) return true;
    if(norm.length>6 && otherNorm.length>6 && levenshtein(norm, otherNorm)<=2) return true;
    return false;
  });
}
/** Liefert alle potenziellen Ressourcen-Duplikatpaare workbookweit (für den Abhängigkeitscluster-View). @returns {{a:object, b:object}[]} */
function allPotentialDuplicateResourcePairs(){
  const pairs = [];
  const seen = new Set();
  STATE.resources.forEach(r=>{
    findPotentialDuplicateResources(r).forEach(other=>{
      const key = [r.id, other.id].sort().join('|');
      if(seen.has(key)) return;
      seen.add(key);
      pairs.push([r, other]);
    });
  });
  return pairs;
}


/** Berechnet die KPI-Kennzahlen für das Dashboard (Prozesszahl, kritische Prozesse, offene Maßnahmen, hohe Risiken). @returns {object} */
function dashboardStats(){
  const processes = STATE.processes;
  const kritisch = processes.filter(isProcessKritisch).length;
  const offeneMassnahmen = STATE.massnahmen.filter(m=>m.status==='offen'||m.status==='in_arbeit').length;
  const hoheRisiken = processes.reduce((sum,p)=>sum + resilienzSummary(p).rot, 0);
  return { anzahlProzesse: processes.length, kritisch, offeneMassnahmen, hoheRisiken };
}

/** Erkennt automatisch offene Entscheidungspunkte eines Prozesses (fehlender Notbetrieb, Zeitwertkonflikt, fehlende Mindestfähigkeit bei kritischem Prozess usw.). @param {object} process @returns {string[]} */
function processDecisionNeeds(process){
  const needs = [];
  if(!String(process.notbetrieb.entscheidung||'').trim()){
    needs.push('Entscheidungslogik für Notbetrieb fehlt.');
  }
  if(timePlausibility(process).findings.some(f=>f.type==='bad')){
    needs.push('MTA/RTO-Zeitwerte nicht plausibel.');
  }
  if(isProcessKritisch(process) && process.minfaehigkeit.muss.length===0){
    needs.push('Kritischer Prozess ohne definierte Mindestfähigkeit ("Muss funktionieren").');
  }
  const rotOhneMassnahme = process.resilienz.some(i=> i.status==='rot' &&
    !STATE.massnahmen.some(m=>m.prozessId===process.id && m.titel.includes(i.label)));
  if(rotOhneMassnahme){
    needs.push('Roter Resilienzpunkt ohne zugehörige Maßnahme.');
  }
  return needs;
}
/** Sammelt je Prozess automatisch erkannten Entscheidungsbedarf (siehe processDecisionNeeds) für die Management Summary. @returns {{process:object, needs:string[]}[]} */
function allDecisionNeeds(){
  return STATE.processes
    .map(p=>({process:p, needs:processDecisionNeeds(p)}))
    .filter(x=>x.needs.length>0);
}

/** Stuft einen Prozess anhand des Bearbeitungsfortschritts in eine von vier Reifegrad-Stufen ein. @param {object} process @returns {string} */
function processMaturity(process){
  const pct = processProgress(process).overall * 100;
  let label;
  if(pct<40) label='Initial';
  else if(pct<70) label='Aufbau';
  else if(pct<90) label='Fortgeschritten';
  else label='Reviewfähig';
  return { pct: Math.round(pct), label };
}

/** Kompakte Freitext-Risikoliste (workbookweit) für Management Summary/PDF — siehe topRisksStructured() für die neuere, spaltenbasierte P15-Variante. @returns {{level:string, text:string}[]} */
function topRisksList(){
  const risks = [];
  STATE.processes.forEach(p=>{
    p.resilienz.filter(i=>i.status==='rot').forEach(i=>{
      risks.push({level:'hoch', text: (p.steckbrief.name||'Prozess')+': roter Resilienzpunkt „'+i.label+'“'});
    });
    timePlausibility(p).findings.filter(f=>f.type==='bad').forEach(f=>{
      risks.push({level:'hoch', text: (p.steckbrief.name||'Prozess')+': '+f.message});
    });
    const bs = biaScore(p);
    if(bs.klasse==='Hoch'){
      risks.push({level:'mittel', text: (p.steckbrief.name||'Prozess')+': hoher BIA-Score ('+bs.avg+')'});
    }
  });
  STATE.resources.filter(r=>r.alternative==='nein' && r.kritikalitaet==='hoch').forEach(r=>{
    risks.push({level:'hoch', text: 'Ressource „'+(r.name||'ohne Namen')+'“ ohne Alternative, kritisch für '+r.prozesse.length+' Prozess(e).'});
  });
  const order = {hoch:0, mittel:1, niedrig:2};
  risks.sort((a,b)=>order[a.level]-order[b.level]);
  return risks.slice(0,8);
}
/** Risiken auf einen einzelnen Prozess bezogen — genutzt in der PDF-Prozessseite. @param {object} process @returns {{level:string, text:string}[]} */
function processRisks(process){
  const risks = [];
  process.resilienz.filter(i=>i.status==='rot').forEach(i=>{
    risks.push({level:'hoch', text:'Roter Resilienzpunkt „'+i.label+'“'});
  });
  timePlausibility(process).findings.filter(f=>f.type==='bad').forEach(f=>{
    risks.push({level:'hoch', text:f.message});
  });
  const bs = biaScore(process);
  if(bs.klasse==='Hoch'){
    risks.push({level:'mittel', text:'Hoher BIA-Score ('+bs.avg+')'});
  }
  STATE.resources.filter(r=>r.prozesse.includes(process.id) && r.alternative==='nein' && r.kritikalitaet==='hoch').forEach(r=>{
    risks.push({level:'hoch', text:'Ressource „'+(r.name||'ohne Namen')+'“ ohne Alternative'});
  });
  const order2 = {hoch:0, mittel:1, niedrig:2};
  risks.sort((a,b)=>order2[a.level]-order2[b.level]);
  return risks;
}

/** Berechnet die zweistufige GF-Ampel für einen einzelnen Prozess (rot/gelb/grün mit Gründen). @param {object} process @returns {{level:string, rotGruende:string[], gelbGruende:string[]}} */
function processAmpel(process){
  const rotGruende = [];
  const gelbGruende = [];

  if(timePlausibility(process).findings.some(f=>f.type==='bad')){
    rotGruende.push('RTO liegt über MTA');
  }
  if(!String(process.notbetrieb.entscheidung||'').trim()){
    rotGruende.push('Kein Notbetrieb definiert');
  }
  const kritResOhneAlt = STATE.resources.some(r=>
    r.prozesse.includes(process.id) && r.kritikalitaet==='hoch' && r.alternative==='nein');
  if(kritResOhneAlt){
    rotGruende.push('Kritische Ressource ohne Alternative');
  }
  const rotResOhneMassnahme = process.resilienz.some(i=> i.status==='rot' &&
    !STATE.massnahmen.some(m=>m.prozessId===process.id && m.titel.includes(i.label)));
  if(rotResOhneMassnahme){
    rotGruende.push('Roter Resilienzpunkt ohne Maßnahme');
  }

  const offeneMassnahmen = STATE.massnahmen.some(m=>m.prozessId===process.id && (m.status==='offen'||m.status==='in_arbeit'));
  if(offeneMassnahmen){
    gelbGruende.push('Offene Maßnahmen vorhanden');
  }
  if(processProgress(process).overall < 0.9){
    gelbGruende.push('Erhebung unvollständig');
  }
  const vertretung = process.resilienz.find(i=>i.label==='Vertretung vorhanden');
  if(vertretung && vertretung.status!=='gruen'){
    gelbGruende.push('Vertretung nicht sichergestellt');
  }

  let level;
  if(rotGruende.length>0) level = 'rot';
  else if(gelbGruende.length>0) level = 'gelb';
  else level = 'gruen';

  return { level, rotGruende, gelbGruende };
}

/** Berechnet die Gesamtampel des Workbooks nach Worst-Case-Prinzip über alle Prozesse. @returns {{level:string, results:object[], rotProcesses:object[]}} */
function workbookAmpel(){
  const results = STATE.processes.map(p=>({ process:p, ampel: processAmpel(p) }));
  let level = 'gruen';
  if(results.some(r=>r.ampel.level==='rot')) level = 'rot';
  else if(results.some(r=>r.ampel.level==='gelb')) level = 'gelb';
  const rotProcesses = results.filter(r=>r.ampel.level==='rot');
  return { level, results, rotProcesses };
}
/** Rendert das farbige Ampel-Badge (rot/gelb/grün) als HTML. @param {string} level @returns {string} */
function ampelBadge(level){
  const map = {rot:['b-bad','Rot'], gelb:['b-warn','Gelb'], gruen:['b-ok','Grün']};
  const [cls,label] = map[level] || ['b-neutral', level];
  return '<span class="badge '+cls+'">'+label+'</span>';
}

/** Baut die Trefferliste der Volltextsuche aus dem aktuellen Suchbegriff. @returns {void} */
function renderSearchResults(){
  const box = document.getElementById('search-results');
  if(!box) return;
  const term = (App.searchTerm||'').trim().toLowerCase();
  if(term.length<2){ box.innerHTML=''; box.className=''; return; }
  let results = [];
  STATE.processes.forEach(p=>{
    if((p.steckbrief.name||'').toLowerCase().includes(term)){
      results.push({label:'Prozess: '+p.steckbrief.name, action:"go('process','"+safeJsString(p.id)+"','steckbrief')"});
    }
  });
  STATE.resources.forEach(r=>{
    if((r.name||'').toLowerCase().includes(term)){
      results.push({label:'Ressource: '+r.name+' ('+r.kategorie+')', action:"go('cluster')"});
    }
  });
  STATE.massnahmen.forEach(m=>{
    if((m.titel||'').toLowerCase().includes(term)){
      results.push({label:'Maßnahme: '+m.titel, action:"go('massnahmen')"});
    }
  });
  if(results.length===0){ box.className='dropdown'; box.innerHTML='<div class="dropdown-result muted">Keine Treffer</div>'; return; }
  box.className='dropdown';
  box.innerHTML = results.slice(0,12).map(r=>'<div class="dropdown-result" onclick="'+r.action+'">'+escapeHtml(r.label)+'</div>').join('');
}

/** Öffnet ein Modal mit dem übergebenen HTML-Inhalt. @param {string} html @returns {void} */

  /** P17: Einstiegspunkt für einen Bearbeitungsstand-Wechsel; leitet bei "Zur Freigabe"/"Freigegeben" zur Freigabeprüfung, sonst direkte Übernahme. @param {string} newValue @returns {void} */
  attemptStatusChange(newValue){
    if(newValue!=='Zur Freigabe' && newValue!=='Freigegeben'){
      setPath(STATE, 'meta.bearbeitungsstand', newValue);
      autosave();
      render();
      return;
    }
    PENDING_STATUS_CHANGE = newValue;
    App.showReleaseReport();
  },
  /** P17: zeigt den Freigabe-Prüfbericht (Blocker/Warnungen) für den in PENDING_STATUS_CHANGE hinterlegten Zielstatus. @returns {void} */
  showReleaseReport(){
    const report = releaseReadinessCheck();
    let html = '<h3>Freigabeprüfung — Wechsel zu „'+escapeHtml(PENDING_STATUS_CHANGE)+'"</h3>';
    if(report.blockers.length>0){
      html += '<p class="small" style="color:var(--bad);font-weight:700;">Freigabe blockiert — folgende Punkte müssen zuerst behoben werden:</p>';
      report.blockers.forEach(b=>{
        html += '<div class="rowcard" style="border-color:var(--bad);"><b class="small">'+escapeHtml(b.label)+' ('+b.items.length+')</b><ul style="margin:6px 0 0;padding-left:18px;">'+
          b.items.slice(0,6).map(i=>'<li class="small">'+escapeHtml(i)+'</li>').join('')+
          (b.items.length>6?'<li class="small">… und '+(b.items.length-6)+' weitere</li>':'')+'</ul></div>';
      });
    }
    if(report.warnings.length>0){
      html += '<p class="small" style="font-weight:700;margin-top:14px;">Warnungen (können mit dokumentierter Begründung akzeptiert werden):</p>';
      report.warnings.forEach(w=>{
        html += '<div class="rowcard"><b class="small">'+escapeHtml(w.label)+' ('+w.items.length+')</b><ul style="margin:6px 0 0;padding-left:18px;">'+
          w.items.slice(0,6).map(i=>'<li class="small">'+escapeHtml(i)+'</li>').join('')+
          (w.items.length>6?'<li class="small">… und '+(w.items.length-6)+' weitere</li>':'')+'</ul></div>';
      });
    }
    if(report.blockers.length===0 && report.warnings.length===0){
      html += '<p class="small" style="color:var(--ok);">Keine Blocker oder Warnungen erkannt.</p>';
    }
    if(report.blockers.length===0){
      if(report.warnings.length>0){
        html += '<div class="field"><label>Bearbeiter<span class="req">*</span></label><input type="text" id="release-bearbeiter" value="'+escapeHtml(STATE.meta.currentBearbeiter)+'"></div>';
        html += '<div class="field"><label>Begründung für die Akzeptanz der obigen Warnungen<span class="req">*</span></label><textarea id="release-justification" placeholder="Warum wird trotz dieser Warnungen freigegeben?"></textarea></div>';
      }
      html += '<div class="modal-actions"><button class="btn" onclick="App.cancelStatusChange()">Abbrechen</button>'+
        '<button class="btn btn-primary" onclick="App.confirmStatusChange()">'+(PENDING_STATUS_CHANGE==='Freigegeben'?'Freigeben (erzeugt neue Version)':'Bestätigen')+'</button></div>';
    } else {
      html += '<div class="modal-actions"><button class="btn btn-primary" onclick="App.cancelStatusChange()">Schließen</button></div>';
    }
    openModal(html);
  },
  /** P17: bricht einen laufenden Bearbeitungsstand-Wechsel ab, ohne etwas zu speichern. @returns {void} */
  cancelStatusChange(){
    PENDING_STATUS_CHANGE = null;
    closeModal();
    render(); // Select in den Einstellungen zeigt danach wieder den tatsächlichen Stand
  },
  /** P17: bestätigt den Bearbeitungsstand-Wechsel — prüft Blocker, bei "Freigegeben" zusätzlich kritische Selbsttests (P18), erfasst Warnungs-Begründungen und legt bei Freigabe automatisch eine neue Version an. @returns {Promise<void>} */
  async confirmStatusChange(){
    const report = releaseReadinessCheck();
    if(!report.ok){ toast('Freigabe weiterhin blockiert — Prüfbericht erneut ansehen.'); return; }
    // v1.6.0 (P17+P18): eine Freigabe-Version darf nur entstehen, wenn zusätzlich
    // alle KRITISCHEN Selbsttests bestehen (unabhängig von der fachlichen Prüfung).
    if(PENDING_STATUS_CHANGE==='Freigegeben'){
      const testSummary = await runSelfTests();
      if(!testSummary.allCriticalPassed){
        toast('Freigabe blockiert: '+testSummary.criticalFailed+' kritische(r) Selbsttest(s) fehlgeschlagen (Strg+Alt+T für Details).');
        return;
      }
    }
    if(report.warnings.length>0){
      const justEl = document.getElementById('release-justification');
      const bearbEl = document.getElementById('release-bearbeiter');
      const justification = justEl ? justEl.value.trim() : '';
      const bearbeiter = bearbEl ? bearbEl.value.trim() : '';
      if(!justification || !bearbeiter){ toast('Bitte Bearbeiter und Begründung angeben.'); return; }
      STATE.meta.releaseWarningAcceptances.push({
        categories: report.warnings.map(w=>w.category),
        bearbeiter, datum: new Date().toISOString(), begruendung: justification
      });
    }
    const target = PENDING_STATUS_CHANGE;
    STATE.meta.bearbeitungsstand = target;
    PENDING_STATUS_CHANGE = null;
    autosave();
    closeModal();
    if(target==='Freigegeben'){
      await createVersion(STATE.meta.currentBearbeiter, 'Automatische Version bei Freigabe', 'release');
      toast('Workbook freigegeben — neue Version '+STATE.meta.version+' automatisch angelegt.');
    } else {
      toast('Bearbeitungsstand geändert zu "'+target+'".');
    }
    render();
  },

  /* ---- Integrierte Selbstprüfung (P18) — versteckter Entwicklermodus ---- */
  async openSelfTestPanel(){
    openModal('<h3>Selbstprüfung wird ausgeführt…</h3><p class="small muted">Bitte kurz warten — es werden ausschließlich synthetische Testdaten verwendet, das aktive Workbook bleibt unverändert.</p>');
    const summary = await runSelfTests();
    let html = '<h3>Integrierte Selbstprüfung</h3>';
    html += '<p class="'+(summary.failed===0?'small':'small')+'" style="font-weight:700;'+(summary.criticalFailed>0?'color:var(--bad);':(summary.failed>0?'color:var(--warn);':'color:var(--ok);'))+'">'+
      summary.total+' Tests · '+summary.passed+' bestanden · '+summary.failed+' fehlgeschlagen'+(summary.criticalFailed>0?' ('+summary.criticalFailed+' davon kritisch)':'')+'</p>';
    const failures = summary.results.filter(r=>!r.passed);
    if(failures.length>0){
      html += '<table class="dtable"><thead><tr><th>Test</th><th>Kritisch</th><th>Erwartet</th><th>Tatsächlich</th><th>Meldung</th></tr></thead><tbody>';
      failures.forEach(f=>{

      });

    } else {
      html += '<p class="small muted">Alle Tests bestanden.</p>';
    }
    html += '<p class="small muted" style="margin-top:10px;">Diese Ergebnisse enthalten ausschließlich synthetische Testwerte — keine Daten aus dem aktiven Workbook.</p>';
    html += '<div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Schließen</button></div>';
    openModal(html);

  /** P11: fügt eine neue strukturierte Prozessabhängigkeit anhand der Auswahl im Formular hinzu (mit Selbstreferenz-/Duplikatsprüfung). @param {string} processId @returns {void} */
  addDependency(processId){
    const process = getProcess(processId);
    if(!process) return;
    const targetSelect = document.getElementById('dep-target-'+processId);
    const typeSelect = document.getElementById('dep-type-'+processId);
    const targetId = targetSelect ? targetSelect.value : '';
    const type = typeSelect ? typeSelect.value : 'vorgelagert';
    if(!targetId){ toast('Bitte einen Prozess zum Verknüpfen auswählen.'); return; }
    const check = validateNewDependency(process, targetId, type);
    if(!check.ok){ toast(check.error); return; }
    process.dependencies = process.dependencies || [];
    process.dependencies.push(newDependency(targetId, type));
    autosave(); render();
  },
  /** P11: entfernt eine strukturierte Prozessabhängigkeit. @param {string} processId @param {string} depId @returns {void} */
  removeDependency(processId, depId){
    const process = getProcess(processId);
    if(!process) return;
    process.dependencies = (process.dependencies||[]).filter(d=>d.id!==depId);
    autosave(); render();
  },
  /** P11: aktualisiert ein Feld einer strukturierten Prozessabhängigkeit. @param {string} processId @param {string} depId @param {string} field @param {*} value @returns {void} */
  updateDependency(processId, depId, field, value){
    const process = getProcess(processId);
    if(!process) return;
    const dep = (process.dependencies||[]).find(d=>d.id===depId);
    if(!dep) return;
    dep[field] = value;
    autosave(); render();
  },

  /** Entfernt eine Prozessakte unwiderruflich aus dem aktuellen Stand (frühere Versionen bleiben erhalten) und warnt bei dadurch verwaisten Abhängigkeiten (P11). @param {string} id @returns {void} */
  deleteProcess(id){
    if(!confirm('Diese Prozessakte inklusive aller Inhalte unwiderruflich aus dem aktuellen Stand entfernen?\n(Frühere Versionen in der Versionshistorie bleiben erhalten.)')) return;
    const deletedName = processName(id);
    STATE.processes = STATE.processes.filter(p=>p.id!==id);
    STATE.resources.forEach(r=> r.prozesse = r.prozesse.filter(pid=>pid!==id));
    STATE.massnahmen.forEach(m=>{ if(m.prozessId===id) m.prozessId=''; });
    autosave();
    go('dashboard');
    // v1.5.0 (P11): referenzierende Abhängigkeiten NICHT stillschweigend entfernen —
    // sichtbar warnen, damit sie bewusst geprüft/aufgeräumt werden.
    const orphans = orphanedDependencies();
    if(orphans.length>0){
      toast('Prozessakte "'+deletedName+'" entfernt. Achtung: '+orphans.length+' Abhängigkeit(en) in anderen Prozessen verweisen jetzt auf einen nicht mehr vorhandenen Prozess — bitte prüfen.');
    } else {
      toast('Prozessakte entfernt.');
    }
  },

  deleteResource(id){

  /** Führt source-Ressource in target zusammen: Prozesse vereinigen, leere Felder in target aus source übernehmen, source entfernen. Kein automatischer Aufruf — nur auf bewussten Klick im Cluster-View. @param {string} sourceId @param {string} targetId @returns {void} */
  mergeResources(sourceId, targetId){
    const source = STATE.resources.find(r=>r.id===sourceId);
    const target = STATE.resources.find(r=>r.id===targetId);
    if(!source || !target){ toast('Ressource nicht gefunden.'); return; }
    if(!confirm('„'+(source.name||'(ohne Namen)')+'“ wird in „'+(target.name||'(ohne Namen)')+'“ zusammengeführt. Fortfahren?')) return;
    const set = new Set(target.prozesse);
    source.prozesse.forEach(pid=>set.add(pid));
    target.prozesse = Array.from(set);
    ['name','altBeschreibung','schwachstelle'].forEach(k=>{
      if(!String(target[k]||'').trim() && String(source[k]||'').trim()) target[k] = source[k];
    });
    STATE.resources = STATE.resources.filter(r=>r.id!==sourceId);
    autosave(); render();
    toast('Ressourcen zusammengeführt.');
  },

  /** Setzt die Ampel eines Resilienz-Checkpunkts und speichert. @param {string} processId @param {string} itemId @param {string} status 'rot'|'gelb'|'gruen' @returns {void} */
  setResilienzStatus(processId, itemId, status){

    item.status = status;
    autosave(); render();
  },
  /** Erzeugt automatisch Maßnahmenentwürfe aus roten (und optional gelben) Resilienz-Checkpunkten eines Prozesses. @param {string} processId @returns {void} */
  generateMassnahmenFromResilienz(processId){
    const p = getProcess(processId);
    const includeGelb = p.resilienz.some(i=>i.status==='gelb') &&
      confirm('Auch gelbe Checks in Maßnahmen überführen?');
    let created = 0;
    const statuses = includeGelb ? ['rot','gelb'] : ['rot'];
    p.resilienz.filter(i=>statuses.includes(i.status)).forEach(i=>{
      const titelPrefix = i.status==='rot' ? 'Lücke schließen: ' : 'Verbesserung prüfen: ';
      const exists = STATE.massnahmen.some(m=>m.prozessId===processId && m.titel.includes(i.label));
      if(exists) return;
      const bemerkungTeile = [i.kommentar, i.empfehlung].filter(t=>t && t.trim());
      STATE.massnahmen.push(newMassnahme({
        titel: titelPrefix+i.label,
        prozessId: processId, kategorie:'Organisation', prioritaet: i.status==='rot' ? 'hoch' : 'mittel',
        bemerkung: bemerkungTeile.length ? bemerkungTeile.join(' — ') : ('Automatisch aus '+(i.status==='rot'?'rotem':'gelbem')+' Resilienz-Check erzeugt.')
      }));
      created++;
    });
    autosave(); render();
    toast(created>0 ? created+' Maßnahme(n) aus Resilienz-Checks erzeugt.' : 'Keine neuen Checks ohne Maßnahme gefunden.');
  },

  /** Speichert in die bereits verknüpfte Datei (oder leitet zu "Speichern unter" weiter, falls noch keine verknüpft ist). @returns {Promise<void>} */
  async saveToFile(){
    if(!FS_ACCESS_SUPPORTED){ App.exportJson(); toast('Ihr Browser unterstützt keine direkte Dateispeicherung — Datei wird stattdessen heruntergeladen.'); return; }
    if(!currentFileHandle){ await App.saveAsNewFile(); return; }

  /** File System Access API: lässt eine neue Datei wählen, verknüpft sie und schreibt den aktuellen Stand hinein (Fallback: JSON-Download in nicht unterstützten Browsern). @returns {Promise<void>} */
  async saveAsNewFile(){
    if(!FS_ACCESS_SUPPORTED){ App.exportJson(); toast('Ihr Browser unterstützt keine direkte Dateispeicherung — Datei wird stattdessen heruntergeladen.'); return; }
    try{
      const safeName = safeFilenameBase();
      const handle = await window.showSaveFilePicker({
        suggestedName: 'bcm-workbook_'+safeName+'.json',
        types: [{ description:'BCM Workbook (JSON)', accept: {'application/json': ['.json']} }]
      });
      currentFileHandle = handle;
      currentFileName = handle.name;
      fileLinkLostWarned = false;
      await writeToLinkedFile();
      idbSetHandle(handle); // best effort, nicht abwarten
      flashSaveIndicator();
      render();
      toast('Gespeichert unter "'+currentFileName+'". Weitere Änderungen werden automatisch in diese Datei geschrieben.');
    }catch(e){
      if(e && e.name==='AbortError') return; // Nutzer hat Dialog abgebrochen
      toast('Speichern unter fehlgeschlagen: '+(e&&e.message?e.message:'Unbekannter Fehler.'));
    }
  },
  /** File System Access API: öffnet eine bestehende Workbook-Datei, validiert/migriert sie und ersetzt den aktuellen Stand (mit Sicherheitsabfrage bei ungespeicherten Änderungen). @returns {Promise<void>} */
  async openFromFile(){
    if(!FS_ACCESS_SUPPORTED){ App.openImport(); return; }
    try{
      const [handle] = await window.showOpenFilePicker({
        types: [{ description:'BCM Workbook (JSON)', accept: {'application/json': ['.json']} }],
        multiple: false
      });
      const hasExisting = STATE.processes.length>0 || STATE.resources.length>0 || STATE.massnahmen.length>0;
      if(hasExisting && !confirm('Ungespeicherte Änderungen im aktuell geöffneten Workbook könnten verloren gehen. Trotzdem eine andere Datei öffnen?')) return;
      const file = await handle.getFile();
      if(file.size > IMPORT_LIMITS.maxFileBytes){
        toast('Öffnen fehlgeschlagen: Datei ist zu groß ('+Math.round(file.size/1024/1024)+' MB, Limit '+Math.round(IMPORT_LIMITS.maxFileBytes/1024/1024)+' MB).');
        return;
      }
      const text = await file.text();
      let data;
      try{ data = JSON.parse(text); }
      catch(e){ toast('Öffnen fehlgeschlagen: Datei ist kein gültiges JSON.'); return; }
      const validation = validateImportData(data);
      if(!validation.valid){ toast('Öffnen fehlgeschlagen: '+validation.errors.join(' ')); return; }
      if(!backupOrConfirmDestructive('import', 'Datei öffnen')) return;
      currentFileHandle = handle;
      currentFileName = handle.name;
      fileLinkLostWarned = false;
      STATE = Object.assign(defaultState(), validation.normalizedData, {ui:{route:'dashboard', processId:null, processTab:'steckbrief'}});
      versionChecksumCache = {};
      localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableSnapshot()));
      SAVE_STATUS.browser = 'saved'; SAVE_STATUS.lastBrowserSaveAt = new Date();
      SAVE_STATUS.file = 'saved'; SAVE_STATUS.lastFileSaveAt = new Date();
      idbSetHandle(handle);
      render();
      toast('"'+currentFileName+'" geöffnet ('+STATE.processes.length+' Prozesse).');
      App.showImportFeedback(validation);
    }catch(e){
      if(e && e.name==='AbortError') return;
      toast('Öffnen fehlgeschlagen: '+(e&&e.message?e.message:'Unbekannter Fehler.'));
    }
  },
  /* Versucht beim Start, still (ohne Dialog) an die zuletzt verknüpfte Datei
     anzuknüpfen, sofern die Berechtigung noch besteht. Klappt das nicht,
     bleibt einfach alles wie gehabt (localStorage) — kein Fehlerzustand. */
  async tryReconnectFile(){
    if(!FS_ACCESS_SUPPORTED) return;
    try{
      const handle = await idbGetHandle();
      if(!handle) return;
      const perm = await handle.queryPermission({mode:'readwrite'});
      if(perm==='granted'){
        currentFileHandle = handle;
        currentFileName = handle.name;
        SAVE_STATUS.file = 'saved';
        SAVE_STATUS.lastFileSaveAt = new Date();
        render();
      } else {
        // Berechtigung wurde vom Browser zurückgesetzt (z. B. nach Neustart).
        // Nicht automatisch nachfragen (keine Nutzergeste) — aber die Datei
        // "vormerken", damit ein einziger Klick reicht statt neu zu suchen.
        pendingReconnectHandle = handle;
        pendingReconnectName = handle.name;
        render();
      }
    }catch(e){ /* ignorieren, App funktioniert unverändert über localStorage weiter */ }
  },
  /** Fragt die Berechtigung für die zuvor verknüpfte Datei erneut an (Nutzergeste erforderlich) und verbindet bei Erfolg ohne neuen Datei-Dialog. @returns {Promise<void>} */
  async confirmReconnect(){
    if(!pendingReconnectHandle) return;
    try{
      const perm = await pendingReconnectHandle.requestPermission({mode:'readwrite'});
      if(perm==='granted'){
        currentFileHandle = pendingReconnectHandle;
        currentFileName = pendingReconnectName;
        pendingReconnectHandle = null; pendingReconnectName = null;
        fileLinkLostWarned = false;
        SAVE_STATUS.file = 'saved';
        SAVE_STATUS.lastFileSaveAt = new Date();
        render();
        toast('Verbindung zu "'+currentFileName+'" wiederhergestellt.');
      } else {
        toast('Zugriff wurde nicht erlaubt. Verknüpfung bleibt getrennt.');
      }
    }catch(e){
      toast('Verbindung wiederherstellen fehlgeschlagen: '+(e&&e.message?e.message:'Unbekannter Fehler.'));
    }
  },
  /** Blendet das Datei-Wiederverbindungsbanner aus, ohne die Verknüpfung wiederherzustellen. @returns {void} */
  dismissReconnect(){
    pendingReconnectHandle = null; pendingReconnectName = null;
    render();
  },

  /** P3: zeigt den Wiederherstellungsdialog für beschädigte/unbekannte localStorage-Daten. @param {string} key Recovery-Snapshot-Schlüssel. @param {string} reason 'parse-error'|'future-schema' @returns {void} */
  showRecoveryDialog(key, reason){
    const reasonText = reason==='future-schema'
      ? 'Diese Daten stammen von einer neueren Version dieser Anwendung (unbekanntes Datenmodell) und wurden deshalb nicht automatisch geöffnet.'
      : 'Der zuletzt gespeicherte Stand in diesem Browser konnte nicht gelesen werden (beschädigte oder unvollständige Daten).';
    openModal(
      '<h3>Wiederherstellung</h3>'+
      '<p class="small muted">'+escapeHtml(reasonText)+' Die Rohdaten wurden NICHT gelöscht und bleiben erhalten, bis Sie sie ausdrücklich entfernen.</p>'+
      '<div class="rowcard" style="cursor:pointer;" onclick="App.downloadRecoveryRaw(\''+safeJsString(key)+'\')"><b>Rohdaten herunterladen</b><div class="small muted">Sichert die unveränderten Rohdaten als Datei, unabhängig vom Wiederherstellungsversuch.</div></div>'+
      '<div class="rowcard" style="cursor:pointer;" onclick="App.attemptRecoveryAction(\''+safeJsString(key)+'\')"><b>Wiederherstellungsversuch starten</b><div class="small muted">Übernimmt nur vollständig gültige Teilstrukturen. Unvollständige Rekonstruktionen werden klar gekennzeichnet.</div></div>'+
      '<div class="rowcard" style="cursor:pointer;" onclick="App.openEmptyFromRecovery()"><b>Leeres Workbook öffnen</b><div class="small muted">Startet leer. Die Recovery-Daten bleiben unter „Wiederherstellung und Sicherungen" in den Einstellungen erhalten.</div></div>'+
      '<div class="rowcard" style="cursor:pointer;border-color:var(--bad-bg);" onclick="App.deleteRecoverySnapshot(\''+safeJsString(key)+'\', true)"><b style="color:var(--bad);">Recovery-Daten löschen</b><div class="small muted">Entfernt die Rohdaten endgültig, ohne sie zu übernehmen.</div></div>'+
      '<div class="modal-actions"></div>'
    );
  },
  /** P3: lädt die unveränderten Rohdaten eines Recovery-Snapshots als Datei herunter. @param {string} key @returns {void} */
  downloadRecoveryRaw(key){
    let raw;
    try{ raw = localStorage.getItem(key); }catch(e){ toast('Rohdaten nicht lesbar.'); return; }
    if(raw===null){ toast('Keine Rohdaten unter diesem Schlüssel gefunden.'); return; }
    download(key+'.txt', raw, 'text/plain');
    toast('Rohdaten heruntergeladen.');
  },
  /** P3: startet den konservativen Wiederherstellungsversuch für einen Recovery-Snapshot und übernimmt das Ergebnis nach Bestätigung. @param {string} key @returns {void} */
  attemptRecoveryAction(key){
    let raw;
    try{ raw = localStorage.getItem(key); }catch(e){ toast('Rohdaten nicht lesbar.'); return; }
    if(raw===null){ toast('Keine Rohdaten unter diesem Schlüssel gefunden.'); return; }
    const result = attemptRecovery(raw);
    if(!result.recovered){
      toast('Wiederherstellung fehlgeschlagen: '+result.warnings.join(' '));
      return;
    }
    const migration = migrateWorkbook(result.recovered);
    if(!migration.ok){
      toast('Wiederherstellung fehlgeschlagen: '+migration.error);
      return;
    }
    if(!backupOrConfirmDestructive('cleanup', 'Wiederherstellungsversuch übernehmen')) return;
    STATE = Object.assign(defaultState(), migration.data, {ui:{route:'dashboard', processId:null, processTab:'steckbrief'}});
    autosave();
    closeModal();
    render();
    const warn = result.warnings.concat(migration.warnings);
    if(result.partial){
      toast('Teilweise wiederhergestellt (unsicher/unvollständig): '+warn.join(' '));
    } else {
      toast('Wiederherstellung erfolgreich: '+STATE.processes.length+' Prozess(e) übernommen.');
    }

  deleteRecoverySnapshot(key, closeModalAfter){

    try{ localStorage.removeItem(key); }catch(e){ /* Storage nicht verfügbar — nichts weiter zu tun, Ziel (Schlüssel weg) ist ohnehin erreicht */ }
    if(PENDING_RECOVERY_KEY===key){ PENDING_RECOVERY_KEY=null; PENDING_RECOVERY_REASON=null; }

  /** P4: ersetzt den aktuellen Stand durch eine automatische Sicherung (mit Sicherung des jetzigen Stands zuvor). @param {number} slot @returns {void} */
  restoreAutoBackup(slot){
    const backups = listAutoBackups();
    const b = backups.find(x=>x.__slot===slot);
    if(!b){ toast('Sicherung nicht gefunden.'); return; }
    if(!confirm('Aktuellen Stand durch die Sicherung vom '+fmtDate(b.createdAt)+' ('+b.reason+') ersetzen? Der jetzige Stand wird vorher selbst gesichert.')) return;
    if(!backupOrConfirmDestructive('restore', 'Sicherung wiederherstellen')) return;
    const migration = migrateWorkbook(b.snapshot);
    if(!migration.ok){ toast('Wiederherstellung fehlgeschlagen: '+migration.error); return; }
    STATE = Object.assign(defaultState(), migration.data, {ui:{route:'settings', processId:null, processTab:'steckbrief'}});
    versionChecksumCache = {};
    autosave();
    render();
    toast('Sicherung vom '+fmtDate(b.createdAt)+' wiederhergestellt.');
  },
  /** P4: lädt eine automatische Sicherung als JSON-Datei herunter. @param {number} slot @returns {void} */
  downloadAutoBackup(slot){
    const backups = listAutoBackups();
    const b = backups.find(x=>x.__slot===slot);
    if(!b){ toast('Sicherung nicht gefunden.'); return; }
    download('bcm-autobackup_slot'+slot+'.json', JSON.stringify(b.snapshot, null, 2), 'application/json');
    toast('Sicherung heruntergeladen.');
  },
  /** P4: löscht eine automatische Sicherung (nach Bestätigung). @param {number} slot @returns {void} */
  deleteAutoBackupAction(slot){
    if(!confirm('Diese automatische Sicherung löschen?')) return;
    deleteAutoBackup(slot);
    render();
    toast('Sicherung gelöscht.');
  },

  /** Entschlüsselt die ausgewählte Datei mit dem eingegebenen Passwort und stößt die normale Importvalidierung an. @returns {Promise<void>} */
  async confirmImportEncrypted(){
    const input = document.getElementById('enc-import-file');
    const pw = document.getElementById('enc-import-pw').value;
    if(!input.files[0]){ toast('Bitte eine Datei auswählen.'); return; }
    if(!pw){ toast('Bitte das Passwort eingeben.'); return; }
    if(input.files[0].size > IMPORT_LIMITS.maxFileBytes){
      toast('Import fehlgeschlagen: Datei ist zu groß ('+Math.round(input.files[0].size/1024/1024)+' MB, Limit '+Math.round(IMPORT_LIMITS.maxFileBytes/1024/1024)+' MB).');
      return;
    }
    try{
      const text = await readFileAsText(input.files[0]);
      const payload = JSON.parse(text);
      const plaintext = await decryptWorkbookJson(payload, pw);
      const data = JSON.parse(plaintext);
      const validation = validateImportData(data);
      if(!validation.valid){
        toast('Import fehlgeschlagen: '+validation.errors.join(' '));
        return;
      }
      PENDING_IMPORT = validation.normalizedData;
      closeModal();
      const hasExisting = STATE.processes.length>0 || STATE.resources.length>0 || STATE.massnahmen.length>0;
      if(!hasExisting){ App.applyReplaceImport(); }
      else { App.openImportStrategy(); }
      App.showImportFeedback(validation);
    }catch(e){
      toast('Entschlüsseln fehlgeschlagen: Falsches Passwort oder beschädigte Datei.');
    }

  /** Liest, validiert und migriert die ausgewählte Importdatei; wählt automatisch die Ersetzen-Strategie, wenn noch kein eigener Datenstand existiert. @returns {Promise<void>} */
  async readImportFile(){
    const input = document.getElementById('import-file');
    if(!input.files[0]){ toast('Bitte eine Datei auswählen.'); return; }
    if(input.files[0].size > IMPORT_LIMITS.maxFileBytes){
      toast('Import fehlgeschlagen: Datei ist zu groß ('+Math.round(input.files[0].size/1024/1024)+' MB, Limit '+Math.round(IMPORT_LIMITS.maxFileBytes/1024/1024)+' MB).');
      return;
    }
    try{
      const text = await readFileAsText(input.files[0]);
      let data;
      try{ data = JSON.parse(text); }
      catch(e){ toast('Import fehlgeschlagen: Datei ist kein gültiges JSON.'); return; }
      const validation = validateImportData(data);
      if(!validation.valid){
        toast('Import fehlgeschlagen: '+validation.errors.join(' '));
        return;
      }
      PENDING_IMPORT = validation.normalizedData;
      const hasExisting = STATE.processes.length>0 || STATE.resources.length>0 || STATE.massnahmen.length>0;
      if(!hasExisting){ App.applyReplaceImport(); }
      else { App.openImportStrategy(); }
      App.showImportFeedback(validation);

      toast('Import fehlgeschlagen: unerwarteter Fehler beim Lesen der Datei.');

  showImportFeedback(validation){

  loadSampleData(){

  /** Öffnet den Dialog "Für Weitergabe bereinigen" mit den Optionen Export+Bereinigen bzw. nur Bereinigen. @returns {void} */
  openCleanForHandoff(){

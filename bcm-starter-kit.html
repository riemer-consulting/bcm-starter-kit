/** Schema-Migration 6->7: ergänzt minimumCapability.mode und leitet ihn bei eindeutigen Altdaten automatisch ab (v1.5.1-Fix 2). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV6ToV7(data){
  const d = JSON.parse(JSON.stringify(data));
  let fieldsAdded = 0, ambiguousCount = 0;
  (d.processes||[]).forEach(p=>{
    const mc = p.minfaehigkeit && p.minfaehigkeit.minimumCapability;
    if(!mc || mc.mode!==undefined) return;
    const hasPct = mc.percentage!==null && mc.percentage!==undefined && mc.percentage!=='';
    const hasQty = mc.quantity!==null && mc.quantity!==undefined && mc.quantity!=='';
    if(hasPct && hasQty){
      mc.mode = null;
      ambiguousCount++;
    } else if(hasPct){
      mc.mode = 'percentage';
    } else if(hasQty){
      mc.mode = 'quantity';
    } else if(String(mc.description||'').trim()){
      mc.mode = 'description';
    } else {
      mc.mode = null;
    }
    fieldsAdded++;
  });
  d.schemaVersion = 7;
  const warnings = [];
  if(fieldsAdded>0) warnings.push('Bei '+fieldsAdded+' Prozess(en) wurde die Mindestfähigkeit auf einen eindeutigen Modus (Prozent/Menge/Beschreibung) umgestellt.');
  if(ambiguousCount>0) warnings.push(ambiguousCount+' Prozess(e) hatten gleichzeitig Prozent- UND Mengenangabe hinterlegt — bitte im jeweiligen Prozess manuell einen eindeutigen Modus auswählen (nichts wurde gelöscht).');
  return { data: d, warnings };
}

/** Schema-Migration 7->8: ergänzt die erweiterten Maßnahmenfelder aus P14 (Aufwand, Entscheidungsbedarf, Wirksamkeitsnachweis usw.). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV7ToV8(data){
  const d = JSON.parse(JSON.stringify(data));
  let fieldsAdded = 0;
  (d.massnahmen||[]).forEach(m=>{
    const template = { aufwand:'mittel', kostenSchaetzung:'', risikoOhneMassnahme:'', risikoNachMassnahme:'',
      entscheidungsbedarf:'', genehmiger:'', genehmigtAm:'', abhaengigkeiten:[],
      nachweis:'', wirksamkeitGeprueftAm:'', wirksamkeitErgebnis:'' };
    Object.keys(template).forEach(k=>{
      if(m[k]===undefined){ m[k] = template[k]; fieldsAdded++; }
    });
  });
  d.schemaVersion = 8;
  return { data: d, warnings: fieldsAdded>0 ? [fieldsAdded+' fehlende Maßnahmenfelder wurden beim Wechsel von Schema 7 auf Schema 8 ergänzt.'] : [] };
}

/** Schema-Migration 8->9: ergänzt notbetrieb.getestetAm (Grundlage für die P15-Datenqualitätsprüfung). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV8ToV9(data){
  const d = JSON.parse(JSON.stringify(data));
  let fieldsAdded = 0;
  (d.processes||[]).forEach(p=>{
    if(p.notbetrieb && p.notbetrieb.getestetAm===undefined){
      p.notbetrieb.getestetAm = '';
      fieldsAdded++;
    }
  });
  d.schemaVersion = 9;
  return { data: d, warnings: fieldsAdded>0 ? [fieldsAdded+' Prozesse erhielten beim Wechsel von Schema 8 auf Schema 9 ein leeres Notbetrieb-Testdatum-Feld.'] : [] };
}

/** Schema-Migration 9->10: ergänzt fehlende Metadaten additiv (u. a. Vertraulichkeitskennzeichnung, P16). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV9ToV10(data){
  const d = JSON.parse(JSON.stringify(data));
  const before = JSON.stringify(d.meta||{});
  d.meta = Object.assign(defaultMeta(), d.meta||{});
  const after = JSON.stringify(d.meta);
  d.schemaVersion = 10;
  return { data: d, warnings: before!==after ? ['Fehlende Metadaten-Felder (u. a. Vertraulichkeitskennzeichnung) wurden ergänzt.'] : [] };
}

/** Schema-Migration 10->11: ergänzt meta.releaseWarningAcceptances additiv (P17). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV10ToV11(data){
  const d = JSON.parse(JSON.stringify(data));
  const before = JSON.stringify(d.meta||{});
  d.meta = Object.assign(defaultMeta(), d.meta||{});
  const after = JSON.stringify(d.meta);
  d.schemaVersion = 11;
  return { data: d, warnings: before!==after ? ['Fehlende Metadaten-Felder (Freigabe-Historie) wurden ergänzt.'] : [] };
}

const SCHEMA_MIGRATIONS = { 1: migrateV1ToV2, 2: migrateV2ToV3, 3: migrateV3ToV4, 4: migrateV4ToV5, 5: migrateV5ToV6, 6: migrateV6ToV7, 7: migrateV7ToV8, 8: migrateV8ToV9, 9: migrateV9ToV10, 10: migrateV10ToV11 };

/** Zentrale Migrationsverkettung: wendet SCHEMA_MIGRATIONS schrittweise bis CURRENT_SCHEMA_VERSION an. Gibt NIE ok:true zurück, wenn eine Stufe fehlt oder das Ziel nicht exakt erreicht wird; lehnt neuere, unbekannte Schemas ab. @param {object} data Rohdaten (ggf. mit fehlendem/älterem schemaVersion). @returns {{ok:boolean, data?:object, warnings?:string[], error?:string, fromVersion?:number, toVersion?:number, migrated?:boolean}} */
function migrateWorkbook(data){
  let schemaVersion = data.schemaVersion || 1;
  if(schemaVersion > CURRENT_SCHEMA_VERSION){
    return {
      ok:false,
      error:'Diese Datei verwendet ein neueres Datenmodell (Schema '+schemaVersion+') als diese Anwendung unterstützt (Schema '+CURRENT_SCHEMA_VERSION+'). Bitte die Anwendung aktualisieren, bevor diese Datei geöffnet wird.'
    };
  }
  const fromVersion = schemaVersion;
  let current = data;
  let warnings = [];
  let steps = 0;
  while(schemaVersion < CURRENT_SCHEMA_VERSION && steps < 20){ // steps-Limit gegen Endlosschleifen bei Konfigurationsfehlern
    const migrator = SCHEMA_MIGRATIONS[schemaVersion];
    if(!migrator){
      // v1.4.1-Fix (Review-Punkt 1): eine fehlende Migrationsstufe darf NIE als
      // Erfolg durchgehen — sonst könnte ein nur teilweise migriertes Workbook
      // unbemerkt produktiv weiterverwendet werden.
      return {
        ok:false,
        error:'Keine Migration von Schema '+schemaVersion+' auf Schema '+(schemaVersion+1)+' verfügbar. Das Workbook konnte nicht vollständig auf das aktuelle Datenmodell (Schema '+CURRENT_SCHEMA_VERSION+') gebracht werden.',
        data: current, warnings, fromVersion, toVersion: schemaVersion
      };
    }
    const result = migrator(current);
    current = result.data;
    warnings = warnings.concat(result.warnings);
    schemaVersion = current.schemaVersion;
    steps++;
  }
  // v1.4.1-Fix (Review-Punkt 1): auch nach der Schleife zwingend verifizieren —
  // ein Migrationserfolg wird NUR gemeldet, wenn das Schema tatsächlich aktuell ist.
  if(schemaVersion !== CURRENT_SCHEMA_VERSION){
    return {
      ok:false,
      error:'Migration unvollständig: Workbook liegt bei Schema '+schemaVersion+' statt dem erwarteten Schema '+CURRENT_SCHEMA_VERSION+'.',
      data: current, warnings, fromVersion, toVersion: schemaVersion
    };
  }
  return { ok:true, data: current, warnings, fromVersion, toVersion: schemaVersion, migrated: fromVersion < schemaVersion };
}

/** Entfernt rekursiv eingebettete "versions"-Arrays aus alten Versionssnapshots (Altlast des in 1.4.0 behobenen Wachstumsfehlers) und markiert betroffene Einträge zur Prüfsummen-Neuberechnung. @param {object[]} versions @returns {{versions:object[], cleanedCount:number}} */
function sanitizeLegacyVersionSnapshots(versions){
  let cleanedCount = 0;
  const cleaned = (versions||[]).map(version=>{
    if(typeof version.snapshot!=='string' || version.snapshot.indexOf('"versions"')===-1){
      return version; // schneller Vorfilter, spart das Parsen der meisten (bereits sauberen) Einträge
    }
    try{
      const snap = JSON.parse(version.snapshot);
      if(Array.isArray(snap.versions) && snap.versions.length>0){
        delete snap.versions;
        cleanedCount++;
        return Object.assign({}, version, {
          snapshot: JSON.stringify(snap),
          checksum: null,        // beschrieb den ungereinigten Zustand — nicht mehr gültig
          checksumPending: true  // Marker: refreshVersionChecksums() berechnet eine frische Prüfsumme
        });
      }
      return version;
    }catch(e){
      // Snapshot ist kaputt — hier NICHT verändern, das ist Aufgabe der P3-Recovery, nicht dieser Funktion
      return Object.assign({}, version, { snapshotParseError: true });
    }
  });
  return { versions: cleaned, cleanedCount };
}

/* ---------------------------------------------------------------------
   3) PERSISTENZ — localStorage Autosave + Versionierung
   --------------------------------------------------------------------- */
let STATE = loadState();
let PENDING_IMPORT = null; // während eines mehrstufigen Imports zwischengespeicherte Importdatei
let PENDING_RECOVERY_KEY = null;    // gesetzt, wenn P3-Wiederherstellungsdialog nötig ist
let PENDING_RECOVERY_REASON = null; // 'parse-error' | 'future-schema'
let PENDING_MIGRATION_NOTICE = null; // gesetzt, wenn eine Schema-Migration beim Laden stattfand
let PENDING_BACKUP_FAILURE_NOTICE = null; // v1.4.1: sichtbare Warnung, falls das Boot-Zeit-Backup fehlschlug
let PENDING_CLEANUP_NOTICE = null; // v1.4.1: Anzahl bereinigter, rekursiv aufgeblähter Legacy-Versionssnapshots
let PENDING_STATUS_CHANGE = null; // v1.6.0 (P17): Ziel-Bearbeitungsstand während der Freigabeprüfung
let SAVE_TIMER = null;
let DIRTY = false;

/** Lädt STATE beim Start aus localStorage: parst, migriert (migrateWorkbook), bereinigt aufgeblähte Legacy-Versionssnapshots und stößt bei Fehlern die P3-Wiederherstellung an. @returns {object} */
function loadState(){
  let raw;
  try{
    raw = localStorage.getItem(STORAGE_KEY);
  }catch(e){
    return defaultState(); // Storage nicht lesbar (z. B. blockiert) — nichts zu retten
  }
  if(!raw) return defaultState();

  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    // P3: beschädigte Rohdaten NICHT überschreiben, sondern unter Recovery-Key sichern
    stashRecoverySnapshot(raw, 'parse-error');
    return defaultState();
  }

  const migration = migrateWorkbook(parsed);
  if(!migration.ok){
    // Neueres, unbekanntes Schema: nicht blind öffnen, aber auch nicht verwerfen
    stashRecoverySnapshot(raw, 'future-schema');
    return defaultState();
  }
  if(migration.migrated){
    PENDING_MIGRATION_NOTICE = { from: migration.fromVersion, to: migration.toVersion, warnings: migration.warnings };
    const backupResult = createAutoBackup('migration', parsed);
    if(!backupResult.ok){ PENDING_BACKUP_FAILURE_NOTICE = 'Vor der Datenmodell-Aktualisierung konnte keine automatische Sicherung erstellt werden ('+backupResult.error+').'; }
  }

  // v1.4.1 (Fix 3): alte, rekursiv aufgeblähte Versions-Snapshots bereinigen —
  // läuft unabhängig davon, ob gerade eine Schema-Migration stattfand, da der
  // zugrundeliegende Bug bereits innerhalb von Schema-2-Daten auftreten konnte.
  const sanitized = sanitizeLegacyVersionSnapshots(migration.data.versions);
  if(sanitized.cleanedCount > 0){
    const backupResult = createAutoBackup('cleanup', parsed); // Rohzustand VOR der Bereinigung sichern
    if(!backupResult.ok){ PENDING_BACKUP_FAILURE_NOTICE = 'Vor der Bereinigung aufgeblähter Versionssnapshots konnte keine automatische Sicherung erstellt werden ('+backupResult.error+').'; }
    migration.data.versions = sanitized.versions;
    PENDING_CLEANUP_NOTICE = sanitized.cleanedCount;
  }

  const base = defaultState();
  return Object.assign(base, migration.data, {ui: base.ui});
}

/** Sichert nicht ladbare Rohdaten unter einem eigenen, niemals automatisch überschriebenen Key. Bleibt erhalten, bis der Nutzer sie ausdrücklich löscht (siehe Einstellungen -> Wiederherstellung und Sicherungen). @param {string} rawText Die unveränderten, nicht parsebaren Rohdaten. @param {string} reason 'parse-error'|'future-schema' @returns {void} */
function stashRecoverySnapshot(rawText, reason){
  try{
    const key = 'bcm_workbook_recovery_' + Date.now();
    localStorage.setItem(key, rawText);
    PENDING_RECOVERY_KEY = key;
    PENDING_RECOVERY_REASON = reason;
  }catch(e){
    console.error('Recovery-Snapshot konnte nicht gesichert werden', e);
  }
}

/** Konservativer Wiederherstellungsversuch für beschädigte/abgeschnittene JSON-Rohdaten — übernimmt ausschließlich vollständig parsebare Teilstrukturen, rät nichts. @param {string} rawText @returns {{recovered:(object|null), warnings:string[], partial:boolean}} */
function attemptRecovery(rawText){
  const result = { recovered: null, warnings: [], partial: false };

  // 1) Vielleicht lässt sich die Datei doch direkt parsen (z. B. wenn der
  //    ursprüngliche Fehler an anderer Stelle lag)
  try{
    result.recovered = JSON.parse(rawText);
    return result;
  }catch(e){ /* weiter zu Stufe 2 */ }

  // 2) Häufigster Fall: abgebrochener Schreibvorgang -> Datei endet mitten
  //    im JSON. Längstes gültiges JSON-Präfix suchen (von hinten nach der
  //    letzten schließenden geschweiften Klammer).
  for(let i=rawText.length-1;i>0;i--){
    if(rawText[i] === '}'){
      const candidate = rawText.slice(0, i+1);
      try{
        const parsed = JSON.parse(candidate);
        result.recovered = parsed;
        result.partial = true;
        result.warnings.push('Die Datei war unvollständig (vermutlich abgebrochener Schreibvorgang). Der längste gültige JSON-Anfang wurde übernommen — Inhalte am Ende der Datei könnten fehlen.');
        return result;
      }catch(e){ continue; }
    }
  }

  // 3) Letzter, sehr konservativer Versuch: nur die Prozessliste isoliert
  //    herausschneiden, wenn sie für sich genommen gültiges JSON ist.
  const match = rawText.match(/"processes"\s*:\s*(\[[\s\S]*\])\s*,\s*"resources"/);
  if(match){
    try{
      const processes = JSON.parse(match[1]);
      result.recovered = { processes, resources:[], massnahmen:[], versions:[], meta: defaultMeta() };
      result.partial = true;
      result.warnings.push('Nur die Prozessliste konnte isoliert wiederhergestellt werden. Ressourcen, Maßnahmen und die Versionshistorie gingen dabei verloren.');
      return result;
    }catch(e){ /* auch das ging nicht */ }
  }

  result.warnings.push('Es konnte keine verwertbare Teilstruktur in dieser Datei gefunden werden.');
  return result;
}


/** Liefert STATE ohne das rein UI-bezogene `ui`-Feld — die Form, die tatsächlich gespeichert/exportiert wird. @returns {object} */
function persistableSnapshot(){
  const {ui, ...rest} = STATE;
  return rest;
}
/** v2.0.2: Herkunftsfelder für neue Exporte (Branding-Auftrag Abschnitt 5). Rein additiv, ausschließlich beim Export angehängt — beeinflusst weder STATE noch Migrationen noch bestehende Dateien; beim Import werden unbekannte Zusatzfelder von validateImportData() unverändert ignoriert. @returns {{createdWith:string, edition:string, originalAuthor:string, projectWebsite:string, license:string}} */
function exportProvenanceFields(){
  return {
    createdWith: PROJECT_NAME,
    edition: PROJECT_EDITION,
    originalAuthor: PROJECT_AUTHOR,
    projectWebsite: PROJECT_WEBSITE,
    license: PROJECT_LICENSE_SPDX
  };
}
/* v1.4.0 (P8-Fix): Snapshot für EINZELNE Versionseinträge — bewusst OHNE
   STATE.versions. Würde eine Version ihre eigene Versionsliste enthalten,
   würde jede neue Version die komplette bisherige Historie erneut
   einbetten: exponentielles Wachstum (v1→46 KB, v2→94 KB, v3→193 KB, ...)
   bis hin zu einem Absturz nach wenigen gespeicherten Versionen. Die
   Versionsliste selbst lebt ausschließlich auf STATE-Ebene. */
function versionableSnapshot(){
  const {ui, versions, ...rest} = STATE;
  return rest;
}

/* ---------------------------------------------------------------------
   3b) SICHERUNGSROTATION (v1.4.0, P4)
   Fünf rotierende, automatische Sicherungen — unabhängig vom manuellen
   Versionsverlauf. Werden NIE in reguläre Workbook-Exporte eingebettet,
   leben ausschließlich in localStorage unter eigenen Keys.
   --------------------------------------------------------------------- */
const AUTOBACKUP_PREFIX = 'bcm_autobackup_';
const AUTOBACKUP_SLOTS = 5;
let lastIntervalBackupAt = 0;
let backupDueToChange = false;

/** Legt eine automatische Sicherung in einem der 5 rotierenden Slots an (ältester wird überschrieben). Schlägt nie hörbar fehl, sondern meldet den Fehler strukturiert zurück. @param {string} reason Auslösergrund ('import'|'restore'|'cleanup'|'migration'|'interval'). @param {object} [explicitSnapshot] Optionaler expliziter Snapshot statt persistableSnapshot(). @returns {{ok:boolean, slot?:number, createdAt?:string, error?:string}} */
function createAutoBackup(reason, explicitSnapshot){
  try{
    let targetSlot = null;
    let oldestTime = Infinity;
    for(let i=1;i<=AUTOBACKUP_SLOTS;i++){
      const raw = localStorage.getItem(AUTOBACKUP_PREFIX+i);
      if(!raw){ targetSlot = i; break; }
      try{
        const b = JSON.parse(raw);
        const t = new Date(b.createdAt).getTime();
        if(t < oldestTime){ oldestTime = t; targetSlot = i; }
      }catch(e){ targetSlot = i; break; } // beschädigter Slot -> einfach überschreiben
    }
    const backup = {
      createdAt: new Date().toISOString(),
      reason: reason || 'unbekannt',
      appVersion: (typeof APP_VERSION!=='undefined') ? APP_VERSION : null,
      schemaVersion: (typeof CURRENT_SCHEMA_VERSION!=='undefined') ? CURRENT_SCHEMA_VERSION : null,
      snapshot: explicitSnapshot!==undefined ? explicitSnapshot : persistableSnapshot()
    };
    localStorage.setItem(AUTOBACKUP_PREFIX+targetSlot, JSON.stringify(backup));
    return { ok:true, slot: targetSlot, createdAt: backup.createdAt };
  }catch(e){
    console.error('Automatisches Backup fehlgeschlagen:', e);
    return { ok:false, error: (e && e.message) || 'Backup konnte nicht erstellt werden.' };
  }
}
/** Erstellt ein Backup vor einer DESTRUKTIVEN Aktion; schlägt es fehl, muss der Nutzer per confirm() ausdrücklich ohne Sicherung fortfahren. @param {string} reason @param {string} actionLabel Für die Nutzermeldung. @returns {boolean} true, wenn fortgefahren werden darf. */
function backupOrConfirmDestructive(reason, actionLabel){
  const result = createAutoBackup(reason);
  if(result.ok) return true;
  return confirm('Die automatische Sicherung vor „'+actionLabel+'" konnte nicht erstellt werden ('+result.error+'). Möchten Sie die Aktion trotzdem OHNE Sicherung fortsetzen?');
}
/** Erstellt ein Backup vor einer NICHT-destruktiven Aktion; schlägt es fehl, wird nur gewarnt, die Aktion läuft weiter. @param {string} reason @param {string} actionLabel Für die Nutzermeldung. @returns {{ok:boolean, slot?:number, createdAt?:string, error?:string}} */
function backupOrWarn(reason, actionLabel){
  const result = createAutoBackup(reason);
  if(!result.ok){
    toast('Hinweis: Automatische Sicherung vor „'+actionLabel+'" konnte nicht erstellt werden ('+result.error+').');
  }
  return result;
}
/** Liest alle 5 Auto-Backup-Slots aus localStorage, neueste zuerst. @returns {object[]} */
function listAutoBackups(){
  const list = [];
  for(let i=1;i<=AUTOBACKUP_SLOTS;i++){
    try{
      const raw = localStorage.getItem(AUTOBACKUP_PREFIX+i);
      if(raw){ const b = JSON.parse(raw); b.__slot = i; list.push(b); }
    }catch(e){ /* beschädigter Slot wird einfach übersprungen */ }
  }
  list.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  return list;
}
/** Löscht einen einzelnen Auto-Backup-Slot. @param {number} slot @returns {boolean} */
function deleteAutoBackup(slot){
  try{ localStorage.removeItem(AUTOBACKUP_PREFIX+slot); return true; }catch(e){ return false; }
}
/* Listet alle P3-Recovery-Snapshots (beschädigte/nicht ladbare Rohdaten) */
function listRecoverySnapshots(){
  const list = [];
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(key && key.indexOf('bcm_workbook_recovery_')===0){
        const ts = parseInt(key.replace('bcm_workbook_recovery_',''),10);
        list.push({ key, createdAt: isNaN(ts)?null:new Date(ts).toISOString() });
      }
    }
  }catch(e){ /* Storage nicht lesbar */ }
  list.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
  return list;
}

/* ---------------------------------------------------------------------
   3c) GETRENNTE SPEICHERZUSTÄNDE (v1.4.0, P1)
   Browser- und Dateispeicherung werden unabhängig voneinander verfolgt,
   damit ein fehlgeschlagenes Dateispeichern niemals als "gespeichert"
   erscheint, nur weil localStorage erfolgreich war.
   --------------------------------------------------------------------- */
const SAVE_STATUS = {
  browser: 'saved',       // 'saved' | 'pending' | 'error'
  file: 'disconnected',   // 'saved' | 'pending' | 'permission-required' | 'error' | 'disconnected'
  lastBrowserSaveAt: null,
  lastFileSaveAt: null,
  lastError: null
};

/** Debounced Speichern (500ms): schreibt nach localStorage und, falls verknüpft, zusätzlich in die Datei; aktualisiert SAVE_STATUS getrennt für beide Ziele. @returns {void} */
function autosave(){
  DIRTY = true;
  backupDueToChange = true;
  SAVE_STATUS.browser = 'pending';
  if(currentFileHandle) SAVE_STATUS.file = 'pending';
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(async ()=>{
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(persistableSnapshot()));
      DIRTY = false;
      SAVE_STATUS.browser = 'saved';
      SAVE_STATUS.lastBrowserSaveAt = new Date();
    }catch(e){
      SAVE_STATUS.browser = 'error';
      SAVE_STATUS.lastError = 'Browser: '+(e&&e.message?e.message:'unbekannter Fehler');
      toast('Autosave fehlgeschlagen: Speicher voll oder blockiert.');
    }
    flashSaveIndicator();
    if(currentFileHandle){
      if(!fileWriteInProgress){
        fileWriteInProgress = true;
        await writeToLinkedFile();
        fileWriteInProgress = false;
        flashSaveIndicator();
      }
    } else {
      SAVE_STATUS.file = 'disconnected';
      flashSaveIndicator();
    }
  }, 500);
}

/** Aktualisiert die Speicherstatus-Anzeige in der Topbar anhand von SAVE_STATUS (Browser/Datei getrennt). @returns {void} */
function flashSaveIndicator(){
  const el = document.getElementById('save-indicator');
  if(!el) return;
  const fmt = (d)=> d ? d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';

  let browserText;
  if(SAVE_STATUS.browser==='saved') browserText = 'Im Browser gespeichert · '+fmt(SAVE_STATUS.lastBrowserSaveAt);
  else if(SAVE_STATUS.browser==='pending') browserText = 'Wird im Browser gespeichert…';
  else browserText = 'Im Browser NICHT gespeichert';

  let fileText = '';
  let isError = SAVE_STATUS.browser==='error';
  if(SAVE_STATUS.file==='saved'){ fileText = ' · In Datei gespeichert · '+fmt(SAVE_STATUS.lastFileSaveAt); }
  else if(SAVE_STATUS.file==='pending'){ fileText = ' · Datei wird geschrieben…'; }
  else if(SAVE_STATUS.file==='permission-required'){ fileText = ' · Dateiberechtigung muss erneut bestätigt werden'; isError = true; }
  else if(SAVE_STATUS.file==='error'){ fileText = ' · Datei wurde verschoben oder gelöscht — „Speichern unter" nutzen'; isError = true; }
  // 'disconnected' -> keine Datei-Angabe, kein Fehler

  el.textContent = browserText + fileText;
  el.style.color = isError ? 'var(--bad)' : '';
  updateFileLinkIndicator();
}

window.addEventListener('beforeunload', function(e){
  if(DIRTY){ e.preventDefault(); e.returnValue=''; }
});

/** Berechnet den SHA-256-Hash eines Strings über die Web Crypto API. @param {string} text @returns {Promise<string>} Hex-kodierter Hash. */
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/** Legt eine neue, unveränderliche Version an (Snapshot OHNE Versionsliste selbst, siehe versionableSnapshot) inkl. SHA-256-Prüfsumme. @param {string} bearbeiter @param {string} notiz @param {string} [source] 'manual'|'import'|'restore'|'migration'|'cleanup'|'release' @returns {Promise<void>} */
async function createVersion(bearbeiter, notiz, source){
  const nr = STATE.versions.length + 1;
  const snapshot = JSON.stringify(versionableSnapshot());
  let checksum = null;
  try{ checksum = await sha256Hex(snapshot); }catch(e){ /* Web Crypto evtl. nicht verfügbar — Version bleibt trotzdem gültig */ }
  STATE.versions.push({
    nr, datum: new Date().toISOString(), bearbeiter: bearbeiter || STATE.meta.currentBearbeiter || 'Unbekannt',
    notiz: notiz || '', snapshot,
    source: source || 'manual',
    appVersion: APP_VERSION,
    schemaVersion: CURRENT_SCHEMA_VERSION,
    checksum
  });
  STATE.meta.version = nr;
  STATE.meta.currentBearbeiter = bearbeiter || STATE.meta.currentBearbeiter;
  autosave();
}

/** Vergleicht zwei Versions-Snapshots strukturiert (Prozesse/Ressourcen hinzugefügt/entfernt, Zeitwert-/Kritikalitäts-/BIA-/Maßnahmenänderungen). @param {object} versionA @param {object} versionB @returns {object} Diff-Struktur mit processesAdded/processesRemoved/processChanges/resourcesAdded/resourcesRemoved/massnahmenChanges. */
function compareVersions(versionA, versionB){
  const a = JSON.parse(versionA.snapshot);
  const b = JSON.parse(versionB.snapshot);
  const diff = { processesAdded:[], processesRemoved:[], processChanges:[], resourcesAdded:[], resourcesRemoved:[], massnahmenChanges:[] };

  const aProcMap = new Map((a.processes||[]).map(p=>[p.id,p]));
  const bProcMap = new Map((b.processes||[]).map(p=>[p.id,p]));
  bProcMap.forEach((p, id)=>{ if(!aProcMap.has(id)) diff.processesAdded.push(p.steckbrief.name||'(ohne Namen)'); });
  aProcMap.forEach((p, id)=>{ if(!bProcMap.has(id)) diff.processesRemoved.push(p.steckbrief.name||'(ohne Namen)'); });
  aProcMap.forEach((pa, id)=>{
    const pb = bProcMap.get(id);
    if(!pb) return;
    const changes = [];
    if(pa.steckbrief.mtaWert!==pb.steckbrief.mtaWert || pa.steckbrief.mtaEinheit!==pb.steckbrief.mtaEinheit) changes.push('MTA geändert ('+pa.steckbrief.mtaWert+' '+pa.steckbrief.mtaEinheit+' → '+pb.steckbrief.mtaWert+' '+pb.steckbrief.mtaEinheit+')');
    if(!timeValuesEqual(pa.steckbrief.rto, pb.steckbrief.rto)) changes.push('RTO geändert ("'+formatTimeValueForDisplay(pa.steckbrief.rto)+'" → "'+formatTimeValueForDisplay(pb.steckbrief.rto)+'")');
    if(!timeValuesEqual(pa.steckbrief.rpo, pb.steckbrief.rpo)) changes.push('RPO geändert ("'+formatTimeValueForDisplay(pa.steckbrief.rpo)+'" → "'+formatTimeValueForDisplay(pb.steckbrief.rpo)+'")');
    if(pa.steckbrief.kritikalitaet!==pb.steckbrief.kritikalitaet) changes.push('Kritikalität geändert ('+pa.steckbrief.kritikalitaet+' → '+pb.steckbrief.kritikalitaet+')');
    BIA_CATEGORIES.forEach(c=>{
      const va = pa.bia && pa.bia[c.key] && pa.bia[c.key].bewertung;
      const vb = pb.bia && pb.bia[c.key] && pb.bia[c.key].bewertung;
      if(va!==vb) changes.push('BIA "'+c.label+'" geändert ('+va+' → '+vb+')');
    });
    if(changes.length>0) diff.processChanges.push({ name: pb.steckbrief.name||pa.steckbrief.name||'(ohne Namen)', changes });
  });

  const aResMap = new Map((a.resources||[]).map(r=>[r.id,r]));
  const bResMap = new Map((b.resources||[]).map(r=>[r.id,r]));
  bResMap.forEach((r,id)=>{ if(!aResMap.has(id)) diff.resourcesAdded.push(r.name||'(ohne Namen)'); });
  aResMap.forEach((r,id)=>{ if(!bResMap.has(id)) diff.resourcesRemoved.push(r.name||'(ohne Namen)'); });

  const aMassMap = new Map((a.massnahmen||[]).map(m=>[m.id,m]));
  const bMassMap = new Map((b.massnahmen||[]).map(m=>[m.id,m]));
  aMassMap.forEach((ma,id)=>{
    const mb = bMassMap.get(id);
    if(!mb) return;
    const changes = [];
    if(ma.status!==mb.status) changes.push('Status geändert ('+ma.status+' → '+mb.status+')');
    if(ma.verantwortlich!==mb.verantwortlich) changes.push('Verantwortlich geändert ("'+ma.verantwortlich+'" → "'+mb.verantwortlich+'")');
    if(ma.termin!==mb.termin) changes.push('Termin geändert ("'+ma.termin+'" → "'+mb.termin+'")');
    if(changes.length>0) diff.massnahmenChanges.push({ titel: mb.titel||ma.titel||'(ohne Titel)', changes });
  });

  return diff;
}

/* Prüfsummen-Verifizierung im Hintergrund (Web Crypto ist immer async).
   Ergebnis wird gecacht und triggert bei Bedarf ein Re-Render. */
let versionChecksumCache = {};
let versionChecksumInProgress = false;
/** Verifiziert/berechnet im Hintergrund Prüfsummen offener Versionseinträge (inkl. Neuberechnung nach P3-Bereinigung); rendert nur neu, wenn tatsächlich etwas zu tun war. @returns {Promise<void>} */
async function refreshVersionChecksums(){
  if(versionChecksumInProgress) return;
  const pending = STATE.versions.filter(v=>versionChecksumCache[v.nr]===undefined);
  if(pending.length===0) return; // alles bereits im Cache — nichts zu tun, KEIN erneutes render() (verhindert Render-Rekursion)
  versionChecksumInProgress = true;
  let recomputedAny = false;
  for(const v of pending){
    if(v.checksumPending){
      // v1.4.1: frisch bereinigter Legacy-Snapshot (Fix 3) — neue Prüfsumme
      // berechnen und dauerhaft im Versionseintrag speichern.
      try{
        const fresh = await sha256Hex(v.snapshot);
        v.checksum = fresh;
        delete v.checksumPending;
        versionChecksumCache[v.nr] = 'ok';
        recomputedAny = true;
      }catch(e){ versionChecksumCache[v.nr] = 'unbekannt'; }
      continue;
    }
    if(!v.checksum){ versionChecksumCache[v.nr] = 'historisch'; continue; }
    try{
      const actual = await sha256Hex(v.snapshot);
      versionChecksumCache[v.nr] = (actual===v.checksum) ? 'ok' : 'mismatch';
    }catch(e){ versionChecksumCache[v.nr] = 'unbekannt'; }
  }
  versionChecksumInProgress = false;
  if(recomputedAny) autosave(); // neu berechnete Prüfsummen dauerhaft sichern
  if(STATE.ui.route==='versions') render();
}

/** Ersetzt STATE durch den Snapshot einer früheren Version und legt danach selbst eine neue Version an (Historie bleibt lückenlos). @param {number} nr @returns {Promise<void>} */
async function restoreVersion(nr){
  const v = STATE.versions.find(v=>v.nr===nr);
  if(!v) return;
  if(!backupOrConfirmDestructive('restore', 'Version wiederherstellen')) return;
  const data = JSON.parse(v.snapshot);
  const versionsBackup = STATE.versions;
  STATE = Object.assign(defaultState(), data, {ui: STATE.ui});
  STATE.versions = versionsBackup;
  await createVersion(STATE.meta.currentBearbeiter, 'Wiederhergestellt aus Version ' + nr, 'restore');
  toast('Version ' + nr + ' wiederhergestellt (als neue Version ' + STATE.meta.version + ' gespeichert).');
  render();
}

/* ---------------------------------------------------------------------
   3a) IMPORT-VALIDIERUNG (v1.2.0)
   Stellt sicher, dass eine importierte JSON-Datei die minimal nötige
   Struktur hat, bevor sie in STATE übernommen wird. Ergänzt fehlende
   Unterobjekte konservativ (Werte aus newProcess()), erhält aber alle
   vorhandenen Werte. Blockiert nur bei wirklich unbrauchbaren Dateien.
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   3a-1) IMPORT-HÄRTUNG GEGEN MANIPULIERTE DATEN (v1.4.0, P5)
   --------------------------------------------------------------------- */
const IMPORT_LIMITS = {
  maxFileBytes: 20 * 1024 * 1024,
  maxProcesses: 1000,
  maxResources: 5000,
  maxMassnahmen: 10000,
  maxVersions: 100,
  maxTextLength: 50000,
  maxShortTextLength: 1000,
  maxLogoBytes: 2 * 1024 * 1024
};
const DANGEROUS_KEYS = ['__proto__', 'prototype', 'constructor'];

/** Entfernt rekursiv gefährliche Schlüssel (__proto__, prototype, constructor) aus importierten Rohdaten. @param {*} value @param {number} [depth] Interne Rekursionstiefe (Schutz vor Endlosschleifen). @returns {*} Bereinigter Wert. */
function stripDangerousKeys(value, depth){
  depth = depth || 0;
  if(depth > 50 || value===null || typeof value!=='object') return value;
  if(Array.isArray(value)){
    return value.map(v=>stripDangerousKeys(v, depth+1));
  }
  const clean = {};
  Object.keys(value).forEach(key=>{
    if(DANGEROUS_KEYS.includes(key)) return; // stillschweigend entfernen
    clean[key] = stripDangerousKeys(value[key], depth+1);
  });
  return clean;
}

/** Kürzt einen Text auf maxLen Zeichen und protokolliert die Kürzung als Warnung, statt den Import abzulehnen. @param {string} value @param {number} maxLen @param {string} fieldLabel Für die Warnmeldung. @param {string[]} warnings Wird bei Kürzung ergänzt (Seiteneffekt). @returns {string} Gekürzter (oder unveränderter) Wert. */
function capText(value, maxLen, fieldLabel, warnings){
  if(typeof value!=='string' || value.length<=maxLen) return value;
  warnings.push(fieldLabel+' war zu lang ('+value.length+' Zeichen) und wurde auf '+maxLen+' Zeichen gekürzt.');
  return value.slice(0, maxLen);
}
/** Übernimmt einen Wert nur, wenn er in der erlaubten Menge enthalten ist, sonst neutraler Fallback + Warnung. @param {*} value @param {Array} allowed Erlaubte Werte. @param {*} fallback @param {string} fieldLabel Für die Warnmeldung. @param {string[]} warnings Wird bei Abweichung ergänzt (Seiteneffekt). @returns {*} value oder fallback. */
function capEnum(value, allowed, fallback, fieldLabel, warnings){
  if(allowed.includes(value)) return value;
  if(value!==undefined && value!==null && value!==''){
    warnings.push(fieldLabel+': ungültiger Wert "'+String(value).slice(0,60)+'" wurde auf "'+fallback+'" zurückgesetzt.');
  }
  return fallback;
}
const ENUM_KRITIKALITAET = ['hoch','mittel','niedrig'];
/* Release-Engineering 2.0: gemeinsamer Optionsgenerator für alle
   hoch/mittel/niedrig-Dreier-Selects (Kritikalität, Priorität, Aufwand,
   Abhängigkeits-Kritikalität) — löst 6 vormals identische Inline-
   Implementierungen ab. `order` erhält je Aufrufstelle bewusst die
   ursprüngliche Anzeigereihenfolge, damit sich am sichtbaren Verhalten
   nichts ändert. */
const LEVEL_ORDER_HOCH_FIRST = ['hoch','mittel','niedrig'];
const LEVEL_ORDER_NIEDRIG_FIRST = ['niedrig','mittel','hoch'];
/** Baut <option>-HTML für hoch/mittel/niedrig-Selects in gewünschter Reihenfolge. @param {string} selected @param {string[]} [order] @returns {string} */
function levelOptionsHtml(selected, order){
  return (order||LEVEL_ORDER_HOCH_FIRST).map(v=>'<option value="'+v+'" '+(selected===v?'selected':'')+'>'+v[0].toUpperCase()+v.slice(1)+'</option>').join('');
}
/* Gemeinsamer Optionsgenerator für Zeiteinheit-Selects (RTO/RPO,
   Ressourcen-Recovery-Anforderung) — löst 2 identische Inline-Blöcke ab. */
const TIME_UNIT_OPTIONS = ['Minuten','Stunden','Tage','Wochen'];
/** Baut <option>-HTML für Zeiteinheit-Selects (Minuten/Stunden/Tage/Wochen). @param {string} selected @returns {string} */
function timeUnitOptionsHtml(selected){
  return TIME_UNIT_OPTIONS.map(u=>'<option '+(selected===u?'selected':'')+'>'+u+'</option>').join('');
}
const ENUM_RESILIENZ_STATUS = ['rot','gelb','gruen'];
const ENUM_ALTERNATIVE = ['ja','teilweise','nein'];
const ENUM_JA_NEIN = ['ja','nein'];
const ENUM_MASSNAHMEN_STATUS = ['offen','in_arbeit','erledigt','zurueckgestellt'];

/** Zentrale Importhärtung: strukturelle Reparatur, Größenlimits, Schlüssel-Sanitisierung, ID-Eindeutigkeit, Referenzprüfung, Enum-Validierung und Schema-Migration in einem Durchlauf. @param {object} data Rohdaten aus JSON.parse. @returns {{valid:boolean, errors:string[], warnings:string[], normalizedData:object|null, unclearReferences:object[]}} */
function validateImportData(data){
  const errors = [];
  const warnings = [];
  const unclearReferences = []; // v1.4.1: mehrdeutige Referenzen auf doppelte Prozess-IDs (Review-Punkt 4)

  if(!data || typeof data!=='object' || Array.isArray(data)){
    return { valid:false, errors:['Die Datei enthält kein gültiges Workbook-Objekt.'], warnings:[], normalizedData:null };
  }

  // P5: gefährliche Schlüssel rekursiv entfernen, BEVOR irgendetwas daraus gelesen wird
  data = stripDangerousKeys(data);

  if(!Array.isArray(data.processes)){
    return { valid:false, errors:['Das Feld "processes" fehlt oder ist kein Array.'], warnings:[], normalizedData:null };
  }
  if(data.resources!==undefined && !Array.isArray(data.resources)){
    return { valid:false, errors:['Das Feld "resources" ist vorhanden, aber kein Array.'], warnings:[], normalizedData:null };
  }
  if(data.massnahmen!==undefined && !Array.isArray(data.massnahmen)){
    return { valid:false, errors:['Das Feld "massnahmen" ist vorhanden, aber kein Array.'], warnings:[], normalizedData:null };
  }

  // P5: Größenbegrenzungen — eine Datei mit z. B. 100.000 Prozessen wird
  // VOR der weiteren Verarbeitung abgewiesen (Denial-of-Service-Schutz).
  if(data.processes.length > IMPORT_LIMITS.maxProcesses){
    return { valid:false, errors:['Die Datei enthält '+data.processes.length+' Prozesse — das Limit liegt bei '+IMPORT_LIMITS.maxProcesses+'.'], warnings:[], normalizedData:null };
  }
  if(Array.isArray(data.resources) && data.resources.length > IMPORT_LIMITS.maxResources){
    return { valid:false, errors:['Die Datei enthält '+data.resources.length+' Ressourcen — das Limit liegt bei '+IMPORT_LIMITS.maxResources+'.'], warnings:[], normalizedData:null };
  }
  if(Array.isArray(data.massnahmen) && data.massnahmen.length > IMPORT_LIMITS.maxMassnahmen){
    return { valid:false, errors:['Die Datei enthält '+data.massnahmen.length+' Maßnahmen — das Limit liegt bei '+IMPORT_LIMITS.maxMassnahmen+'.'], warnings:[], normalizedData:null };
  }
  if(Array.isArray(data.versions) && data.versions.length > IMPORT_LIMITS.maxVersions){
    return { valid:false, errors:['Die Datei enthält '+data.versions.length+' Versionen — das Limit liegt bei '+IMPORT_LIMITS.maxVersions+'.'], warnings:[], normalizedData:null };
  }

  // ui aus Import ignorieren (nur lokale Navigation, kein Fachinhalt)
  const normalized = {
    meta: (data.meta && typeof data.meta==='object') ? Object.assign(defaultMeta(), data.meta) : defaultMeta(),
    versions: Array.isArray(data.versions) ? data.versions : [],
    resources: Array.isArray(data.resources) ? data.resources : [],
    massnahmen: Array.isArray(data.massnahmen) ? data.massnahmen : [],
    processes: []
  };
  if(data.resources!==undefined && !Array.isArray(data.resources)) warnings.push('Ressourcen waren ungültig und wurden ignoriert.');
  if(data.massnahmen!==undefined && !Array.isArray(data.massnahmen)) warnings.push('Maßnahmen waren ungültig und wurden ignoriert.');

  // P5: übergroßes Base64-Logo verwerfen statt zu übernehmen
  if(typeof normalized.meta.logoData==='string' && normalized.meta.logoData.length > IMPORT_LIMITS.maxLogoBytes){
    warnings.push('Das Logo in der Importdatei war zu groß und wurde entfernt.');
    normalized.meta.logoData = '';
  }
  // P6: nur ungefährliche URL-Schemata für Logos übernehmen (siehe safeUrl())
  if(normalized.meta.logoData && safeUrl(normalized.meta.logoData)===''){
    warnings.push('Das Logo (Bilddaten) verwendete ein nicht erlaubtes Format und wurde entfernt.');
    normalized.meta.logoData = '';
  }
  if(normalized.meta.logoUrl && safeUrl(normalized.meta.logoUrl)===''){
    warnings.push('Die Logo-URL verwendete ein nicht erlaubtes Format (z. B. javascript:) und wurde entfernt.');
    normalized.meta.logoUrl = '';
  }
  normalized.meta.kundenname = capText(normalized.meta.kundenname, IMPORT_LIMITS.maxShortTextLength, 'Kundenname', warnings);

  // Prozesse: fehlende Unterobjekte konservativ ergänzen, ungültige/fehlende IDs neu vergeben
  // v1.4.1 (Review-Punkt 4): zuerst erkennen, welche ursprünglichen IDs mehrfach
  // vorkamen — für DIESE IDs ist eine automatische Referenzauflösung fachlich
  // nicht sicher möglich (welcher der beiden Prozesse war "wirklich" gemeint?).
  // Referenzen auf solche IDs werden NICHT stillschweigend dem erstbesten
  // Prozess zugeordnet, sondern als mehrdeutig markiert und entfernt.
  const originalIdCounts = new Map();
  data.processes.forEach(p=>{
    if(p && typeof p==='object' && typeof p.id==='string' && p.id.trim()!==''){
      originalIdCounts.set(p.id, (originalIdCounts.get(p.id)||0) + 1);
    }
  });
  const ambiguousProcessIds = new Set(Array.from(originalIdCounts.entries()).filter(([,c])=>c>1).map(([id])=>id));

  const usedIds = new Set();
  normalized.processes = data.processes.map((p, idx)=>{
    if(!p || typeof p!=='object'){
      warnings.push('Prozess an Position '+(idx+1)+' war ungültig und wurde übersprungen.');
      return null;
    }
    const template = newProcess('');
    let id = (typeof p.id==='string' && p.id.trim()!=='') ? p.id : null;
    if(!id || usedIds.has(id)){
      warnings.push('Prozess "'+((p.steckbrief&&p.steckbrief.name)||'(ohne Namen)')+'" hatte keine gültige/eindeutige ID und wurde neu vergeben.');
      id = uid('proc');
    }
    usedIds.add(id);
    const merged = {
      id,
      steckbrief: Object.assign({}, template.steckbrief, (p.steckbrief && typeof p.steckbrief==='object') ? p.steckbrief : {}),
      sixty: Object.assign({}, template.sixty, (p.sixty && typeof p.sixty==='object') ? p.sixty : {}),
      bia: template.bia,
      minfaehigkeit: Object.assign({}, template.minfaehigkeit, (p.minfaehigkeit && typeof p.minfaehigkeit==='object') ? p.minfaehigkeit : {}),
      notbetrieb: Object.assign({}, template.notbetrieb, (p.notbetrieb && typeof p.notbetrieb==='object') ? p.notbetrieb : {}),
      resilienz: Array.isArray(p.resilienz) && p.resilienz.length>0 ? p.resilienz : template.resilienz,
      createdAt: p.createdAt || new Date().toISOString()
    };
    if(p.bia && typeof p.bia==='object'){
      merged.bia = {};
      BIA_CATEGORIES.forEach(c=>{
        merged.bia[c.key] = Object.assign({}, template.bia[c.key], (p.bia[c.key] && typeof p.bia[c.key]==='object') ? p.bia[c.key] : {});
      });
    }
    if(!p.steckbrief || typeof p.steckbrief!=='object') warnings.push('Prozess "'+merged.steckbrief.name+'": Steckbrief fehlte und wurde leer ergänzt.');
    if(!p.bia || typeof p.bia!=='object') warnings.push('Prozess "'+merged.steckbrief.name+'": Business-Impact-Daten fehlten und wurden leer ergänzt.');
    if(!p.notbetrieb || typeof p.notbetrieb!=='object') warnings.push('Prozess "'+merged.steckbrief.name+'": Notbetrieb-Daten fehlten und wurden leer ergänzt.');

    // P5: Typprüfung — nur erlaubte Werte übernehmen, Rest neutralisieren + melden
    const pname = merged.steckbrief.name || '(ohne Namen)';
    merged.steckbrief.kritikalitaet = capEnum(merged.steckbrief.kritikalitaet, ENUM_KRITIKALITAET, 'mittel', 'Prozess "'+pname+'": Kritikalität', warnings);
    merged.steckbrief.name = capText(merged.steckbrief.name, IMPORT_LIMITS.maxShortTextLength, 'Prozess "'+pname+'": Name', warnings);
    ['ziel','nutzen','ergebnis','bemerkungen'].forEach(f=>{
      merged.steckbrief[f] = capText(merged.steckbrief[f], IMPORT_LIMITS.maxTextLength, 'Prozess "'+pname+'": Feld "'+f+'"', warnings);
    });
    BIA_CATEGORIES.forEach(c=>{
      const cat = merged.bia[c.key];
      if(!cat) return;
      const num = Number(cat.bewertung);
      if(!(num>=1 && num<=5)){
        if(cat.bewertung!==undefined && cat.bewertung!==null) warnings.push('Prozess "'+pname+'": BIA-Bewertung "'+c.label+'" war ungültig und wurde auf 3 zurückgesetzt.');
        cat.bewertung = 3;
      } else {
        cat.bewertung = num;
      }
      cat.zeitpunkt = capEnum(cat.zeitpunkt, BIA_ZEITPUNKTE, BIA_ZEITPUNKTE[1], 'Prozess "'+pname+'": BIA-Zeitpunkt "'+c.label+'"', warnings);
      cat.beschreibung = capText(cat.beschreibung, IMPORT_LIMITS.maxTextLength, 'Prozess "'+pname+'": BIA-Beschreibung', warnings);
    });
    (merged.resilienz||[]).forEach(item=>{
      item.status = capEnum(item.status, ENUM_RESILIENZ_STATUS, 'gelb', 'Prozess "'+pname+'": Resilienzpunkt "'+(item.label||'?')+'"', warnings);
      item.kommentar = capText(item.kommentar, IMPORT_LIMITS.maxTextLength, 'Prozess "'+pname+'": Resilienz-Kommentar', warnings);
    });
    return merged;
  }).filter(p=>p!==null);

  const validProcessIds = new Set(normalized.processes.map(p=>p.id));

  // Ressourcen: Struktur ergänzen, Prozessreferenzen auf tatsächlich vorhandene Prozesse begrenzen
  const usedResourceIds = new Set();
  normalized.resources = normalized.resources.map((r, idx)=>{
    if(!r || typeof r!=='object'){
      warnings.push('Ressource an Position '+(idx+1)+' war ungültig und wurde übersprungen.');
      return null;
    }
    const template = newResource();
    const merged = Object.assign({}, template, r);
    if(!merged.id || typeof merged.id!=='string' || usedResourceIds.has(merged.id)){
      if(merged.id && usedResourceIds.has(merged.id)) warnings.push('Ressource "'+(merged.name||'(ohne Namen)')+'": doppelte ID wurde durch eine neue ersetzt.');
      merged.id = uid('rsc');
    }
    usedResourceIds.add(merged.id);
    const rawProzesse = Array.isArray(r.prozesse) ? r.prozesse : [];
    const rname0 = merged.name || '(ohne Namen)';
    const filtered = rawProzesse.filter(pid=>{
      if(ambiguousProcessIds.has(pid)){
        warnings.push('Ressource "'+rname0+'": Verweis auf die mehrfach vorhandene Prozess-ID "'+pid+'" ist mehrdeutig und wurde entfernt — bitte manuell prüfen, welchem Prozess diese Ressource zugeordnet werden soll.');
        unclearReferences.push({ type:'resource', name:rname0, processId:pid });
        return false;
      }
      return validProcessIds.has(pid);
    });
    if(filtered.length < rawProzesse.length && !rawProzesse.some(pid=>ambiguousProcessIds.has(pid))){
      warnings.push('Ressource "'+rname0+'": Verweis auf nicht vorhandene(n) Prozess(e) wurde entfernt.');
    }
    merged.prozesse = filtered;
    const rname = merged.name || '(ohne Namen)';
    merged.name = capText(merged.name, IMPORT_LIMITS.maxShortTextLength, 'Ressource "'+rname+'": Name', warnings);
    merged.kritikalitaet = capEnum(merged.kritikalitaet, ENUM_KRITIKALITAET, 'mittel', 'Ressource "'+rname+'": Kritikalität', warnings);
    merged.alternative = capEnum(merged.alternative, ENUM_ALTERNATIVE, 'nein', 'Ressource "'+rname+'": Alternative', warnings);
    merged.massnahmeNoetig = capEnum(merged.massnahmeNoetig, ENUM_JA_NEIN, 'nein', 'Ressource "'+rname+'": Maßnahme erforderlich', warnings);
    merged.kategorie = capEnum(merged.kategorie, RESOURCE_CATEGORIES, RESOURCE_CATEGORIES[0], 'Ressource "'+rname+'": Kategorie', warnings);
    merged.schwachstelle = capText(merged.schwachstelle, IMPORT_LIMITS.maxTextLength, 'Ressource "'+rname+'": Schwachstelle', warnings);
    merged.altBeschreibung = capText(merged.altBeschreibung, IMPORT_LIMITS.maxTextLength, 'Ressource "'+rname+'": Alternative-Beschreibung', warnings);
    return merged;
  }).filter(r=>r!==null);

  // Maßnahmen: Struktur ergänzen, verwaiste Prozessreferenz leeren statt zu verwerfen
  const usedMassnahmeIds = new Set();
  normalized.massnahmen = normalized.massnahmen.map((m, idx)=>{
    if(!m || typeof m!=='object'){
      warnings.push('Maßnahme an Position '+(idx+1)+' war ungültig und wurde übersprungen.');
      return null;
    }
    const merged = Object.assign({}, newMassnahme(), m);
    if(!merged.id || typeof merged.id!=='string' || usedMassnahmeIds.has(merged.id)){
      if(merged.id && usedMassnahmeIds.has(merged.id)) warnings.push('Maßnahme "'+(merged.titel||'(ohne Titel)')+'": doppelte ID wurde durch eine neue ersetzt.');
      merged.id = uid('m');
    }
    usedMassnahmeIds.add(merged.id);
    if(merged.prozessId && ambiguousProcessIds.has(merged.prozessId)){
      warnings.push('Maßnahme "'+(merged.titel||'(ohne Titel)')+'": Verweis auf die mehrfach vorhandene Prozess-ID "'+merged.prozessId+'" ist mehrdeutig und wurde entfernt — bitte manuell prüfen, welchem Prozess diese Maßnahme zugeordnet werden soll.');
      unclearReferences.push({ type:'massnahme', name: merged.titel||'(ohne Titel)', processId: merged.prozessId });
      merged.prozessId = '';
    } else if(merged.prozessId && !validProcessIds.has(merged.prozessId)){
      warnings.push('Maßnahme "'+(merged.titel||'(ohne Titel)')+'": Verweis auf nicht vorhandenen Prozess wurde entfernt.');
      merged.prozessId = '';
    }
    const mname = merged.titel || '(ohne Titel)';
    merged.titel = capText(merged.titel, IMPORT_LIMITS.maxShortTextLength, 'Maßnahme "'+mname+'": Titel', warnings);
    merged.bemerkung = capText(merged.bemerkung, IMPORT_LIMITS.maxTextLength, 'Maßnahme "'+mname+'": Bemerkung', warnings);
    merged.prioritaet = capEnum(merged.prioritaet, ENUM_KRITIKALITAET, 'mittel', 'Maßnahme "'+mname+'": Priorität', warnings);
    merged.status = capEnum(merged.status, ENUM_MASSNAHMEN_STATUS, 'offen', 'Maßnahme "'+mname+'": Status', warnings);
    merged.kategorie = capEnum(merged.kategorie, MASSNAHMEN_KATEGORIEN, MASSNAHMEN_KATEGORIEN[0], 'Maßnahme "'+mname+'": Kategorie', warnings);
    return merged;
  }).filter(m=>m!==null);

  // Schema-Migration: greift für JEDEN Importweg automatisch (readImportFile,
  // verschlüsselter Import, Datei öffnen), da alle validateImportData() nutzen.
  const migration = migrateWorkbook(Object.assign({schemaVersion: data.schemaVersion}, normalized));
  if(!migration.ok){
    return { valid:false, errors:[migration.error], warnings, normalizedData:null };
  }
  if(migration.migrated){
    warnings.push('Das Workbook wurde vom Datenmodell Version '+migration.fromVersion+' auf Version '+migration.toVersion+' aktualisiert. Vorhandene Inhalte wurden übernommen.');
    warnings.push(...migration.warnings);
  }

  return { valid:true, errors, warnings, normalizedData: migration.data, unclearReferences };
}

/** Merge-Hilfsfunktion: übernimmt source[key] nach target[key], aber NUR wenn target[key] leer ist. Mutiert target. @param {object} target @param {object} source @param {string} key @returns {void} */
function fillEmptyString(target, source, key){
  const isEmpty = target[key]===undefined || String(target[key]||'').trim()==='';
  const hasValue = source[key]!==undefined && String(source[key]||'').trim()!=='';
  if(isEmpty && hasValue) target[key] = source[key];
}
/** Merge-Hilfsfunktion: übernimmt Freitextfelder aus der Quelle nur dort, wo das Ziel leer ist. Mutiert target. @param {object} target @param {object} source @param {string[]} keys Zu prüfende Feldnamen. @returns {void} */
function mergeStringFields(target, source, keys){
  if(!source) return;
  keys.forEach(k=>fillEmptyString(target, source, k));
}
/** Merge-Hilfsfunktion: fügt Einträge aus importArr zu existingArr hinzu, die laut keyFn noch nicht vorhanden sind (neue IDs). Mutiert existingArr. @param {Array} existingArr @param {Array} importArr @param {function} keyFn Extrahiert den Vergleichsschlüssel aus einem Element. @returns {void} */
function mergeListUnion(existingArr, importArr, keyFn){
  const seen = new Set(existingArr.map(keyFn));
  (importArr||[]).forEach(item=>{
    const k = keyFn(item);
    if(!seen.has(k)){
      existingArr.push(Object.assign({}, item, {id: uid('ci')}));
      seen.add(k);
    }
  });
}

/** Merged einen importierten Prozess in einen bestehenden hinein (Freitextfelder nur bei Leerfeld, Listenfelder je nach listMode). Mutiert existing. @param {object} existing @param {object} imported @param {string} listMode 'ergaenzen'|'ueberschreiben' @returns {void} */
function mergeProcessInto(existing, imported, listMode){
  if(!existing.steckbrief.name && imported.steckbrief) existing.steckbrief.name = imported.steckbrief.name;
  mergeStringFields(existing.steckbrief, imported.steckbrief, ['verantwortlicher','stellvertretung','fachbereich','ziel','nutzen','ergebnis','interneKunden','externeKunden','vorgelagert','nachgelagert','mtaWert','rto','rpo','bemerkungen']);
  mergeStringFields(existing.sixty, imported.sixty, ['nutzen','normalbetrieb','kritischWeil','beiAusfall','benoetigt','notbetriebHeute','stundenBisKritisch']);
  mergeStringFields(existing.notbetrieb, imported.notbetrieb, ['ausloeser','entscheidung','werInformiert','steuerung','schritt1','schritt2','schritt3','schritt4','unterlagen','kontaktlisten','offlineDokumente','rueckkehr','luecken']);
  mergeStringFields(existing.minfaehigkeit, imported.minfaehigkeit, ['mindestmenge','entscheidung']);

  BIA_CATEGORIES.forEach(c=>{
    if(existing.bia[c.key] && imported.bia && imported.bia[c.key]){
      // Nur Textfelder auffüllen — Bewertung (1-5) und Zeitpunkt sind bewusste
      // fachliche Einschätzungen und werden beim Zusammenführen nie automatisch verändert.
      mergeStringFields(existing.bia[c.key], imported.bia[c.key], ['beschreibung','kommentar']);
    }
  });

  ['muss','reduziert','warten'].forEach(col=>{
    const impList = (imported.minfaehigkeit && imported.minfaehigkeit[col]) || [];
    if(listMode==='ueberschreiben'){
      if(impList.length>0) existing.minfaehigkeit[col] = impList.map(i=>({id:uid('ci'), text:i.text}));
    } else {
      mergeListUnion(existing.minfaehigkeit[col], impList, i=>String(i.text||'').trim().toLowerCase());
    }
  });

  if(Array.isArray(imported.resilienz)){
    imported.resilienz.forEach(ir=>{
      const er = existing.resilienz.find(r=>r.id===ir.id);
      // Status (Ampel) ist eine bewusste Einschätzung und wird nie automatisch überschrieben — nur Kommentar auffüllen.
      if(er) fillEmptyString(er, ir, 'kommentar');
    });
  }
}

/** Merged eine importierte Ressource in eine bestehende hinein, vereinigt Prozessverknüpfungen. Mutiert existing. @param {object} existing @param {object} imported @param {string} listMode 'ergaenzen'|'ueberschreiben' @returns {void} */
function mergeResourceInto(existing, imported, listMode){
  mergeStringFields(existing, imported, ['name','altBeschreibung','schwachstelle']);
  const impProzesse = imported.prozesse || [];
  if(listMode==='ueberschreiben'){
    if(impProzesse.length>0) existing.prozesse = impProzesse.slice();
  } else {
    const set = new Set(existing.prozesse);
    impProzesse.forEach(pid=>set.add(pid));
    existing.prozesse = Array.from(set);
  }
}

/** Merged eine importierte Maßnahme in eine bestehende hinein (befüllt nur leere Felder). Mutiert existing. @param {object} existing @param {object} imported @returns {void} */
function mergeMassnahmeInto(existing, imported){
  mergeStringFields(existing, imported, ['titel','verantwortlich','termin','nutzen','bemerkung']);
}

/** Führt eine validierte Importdatei mit dem aktuellen STATE zusammen (Strategie "Zusammenführen"). Mutiert STATE. @param {object} importData Normalisierte Importdaten. @param {string} listMode 'ergaenzen'|'ueberschreiben' @returns {{added:number, updated:number}} */
function mergeImportData(importData, listMode){
  let added=0, updated=0;
  (importData.processes||[]).forEach(ip=>{
    const existing = STATE.processes.find(p=>p.id===ip.id);
    if(!existing){ STATE.processes.push(ip); added++; }
    else { mergeProcessInto(existing, ip, listMode); updated++; }
  });
  (importData.resources||[]).forEach(ir=>{
    const existing = STATE.resources.find(r=>r.id===ir.id);
    if(!existing){ STATE.resources.push(ir); added++; }
    else { mergeResourceInto(existing, ir, listMode); updated++; }
  });
  (importData.massnahmen||[]).forEach(im=>{
    const existing = STATE.massnahmen.find(m=>m.id===im.id);
    if(!existing){ STATE.massnahmen.push(im); added++; }
    else { mergeMassnahmeInto(existing, im); updated++; }
  });
  return {added, updated};
}

/** Übernimmt nur die ausgewählten Prozesse/Ressourcen/Maßnahmen aus einer Importdatei (Strategie "Manuell auswählen"). Mutiert STATE. @param {object} importData Normalisierte Importdaten. @param {string[]} processIds @param {string[]} resourceIds @param {string[]} massnahmeIds @returns {{processes:number, resources:number, massnahmen:number}} */
function selectiveImportData(importData, processIds, resourceIds, massnahmeIds){
  const idMap = {};
  let cp=0, cr=0, cm=0;
  (importData.processes||[]).forEach(p=>{
    if(processIds.includes(p.id)){
      const copy = JSON.parse(JSON.stringify(p));
      const newId = uid('proc');
      idMap[p.id] = newId;
      copy.id = newId;
      copy.resilienz.forEach(r=>r.id=uid('res'));
      ['muss','reduziert','warten'].forEach(col=>{ (copy.minfaehigkeit[col]||[]).forEach(i=>i.id=uid('ci')); });
      STATE.processes.push(copy);
      cp++;
    }
  });
  (importData.resources||[]).forEach(r=>{
    if(resourceIds.includes(r.id)){
      const copy = JSON.parse(JSON.stringify(r));
      copy.id = uid('rsc');
      copy.prozesse = (r.prozesse||[]).filter(pid=>idMap[pid]).map(pid=>idMap[pid]);
      STATE.resources.push(copy);
      cr++;
    }
  });
  (importData.massnahmen||[]).forEach(m=>{
    if(massnahmeIds.includes(m.id)){
      const copy = JSON.parse(JSON.stringify(m));
      copy.id = uid('m');
      copy.prozessId = idMap[m.prozessId] || '';
      STATE.massnahmen.push(copy);
      cm++;
    }
  });
  return {processes:cp, resources:cr, massnahmen:cm};
}


/** Escaped einen Wert für die sichere Einbettung als HTML-Text/-Attribut. @param {*} str @returns {string} */
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/** Escaped einen Wert für die sichere Einbettung in einen einfach gequoteten Inline-onclick-String. @param {*} value @returns {string} */
function safeJsString(value){
  let s = String(value===undefined||value===null ? '' : value);
  s = s.replace(/\\/g, '\\\\');
  s = s.replace(/'/g, "\\'");
  s = s.replace(/"/g, '&quot;');
  s = s.replace(/\r\n|\r|\n/g, '\\n');
  s = s.replace(/[\x00-\x1F\x7F]/g, '');
  return s;
}
/** escapeHtml() plus Umwandlung von Zeilenumbrüchen in <br> — für mehrzeilige Freitextausgabe. @param {string} str @returns {string} */
function nl2br(str){ return escapeHtml(str).replace(/\n/g,'<br>'); }

/** P6: setzt textContent eines Elements sicher (für neuen, DOM-basierten Code). @param {HTMLElement} element @param {*} value @returns {void} */
function setText(element, value){
  if(!element) return;
  element.textContent = (value===undefined||value===null) ? '' : String(value);
}
/** P6: sicherer DOM-Elementbau für neuen Code (textContent/attrs/Events statt HTML-String-Konkatenation). @param {string} tag @param {object} [options] @returns {HTMLElement} */
function createElement(tag, options){
  options = options || {};
  const el = document.createElement(tag);
  if(options.text!==undefined) el.textContent = options.text;
  if(options.className) el.className = options.className;
  if(options.attrs){
    Object.keys(options.attrs).forEach(k=>{
      const v = k.toLowerCase()==='href' || k.toLowerCase()==='src' ? safeUrl(options.attrs[k]) : options.attrs[k];
      if(v!==null && v!==undefined) el.setAttribute(k, v);
    });
  }
  if(options.onClick) el.addEventListener('click', options.onClick);
  if(options.onChange) el.addEventListener('change', options.onChange);
  (options.children||[]).forEach(child=>{ if(child) el.appendChild(child); });
  return el;
}
/** Entfernt Steuerzeichen aus einem Wert vor der Verwendung mit setAttribute(). @param {*} value @returns {string} */
function safeAttribute(value){
  return String(value===undefined||value===null?'':value).replace(/[\x00-\x1F\x7F]/g, '');
}
/** Erlaubt nur ungefährliche URL-Schemata (https:, http:, data:image/*) für Logo-/Bild-Quellen; blockiert javascript:, vbscript:, data:text/html und unsanitisiertes SVG. @param {string} value @returns {string} Bereinigte URL oder leerer String. */
function safeUrl(value){
  const url = String(value===undefined||value===null?'':value).trim();
  if(url==='') return '';
  const lower = url.toLowerCase();
  if(lower.startsWith('https:')) return url;
  if(lower.startsWith('http:')) return url; // erlaubt, aber siehe Warnhinweis in der UI
  if(lower.startsWith('data:image/png') || lower.startsWith('data:image/jpeg') || lower.startsWith('data:image/jpg') || lower.startsWith('data:image/webp') || lower.startsWith('data:image/gif')){
    return url;
  }
  if(lower.startsWith('data:image/svg+xml')){
    return ''; // SVG kann eingebettetes JS enthalten und wird ohne Sanitisierung nicht zugelassen
  }
  // javascript:, vbscript:, data:text/html, relative "javascript:..."-Tricks, alles andere: ablehnen
  return '';
}
/** Formatiert einen ISO-Zeitstempel als lokales Datum + Uhrzeit (de-DE). @param {string} iso @returns {string} */
function fmtDate(iso){
  if(!iso) return '–';
  try{ return new Date(iso).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e){ return iso; }
}
/** Formatiert ein Datum (ISO oder YYYY-MM-DD) ohne Uhrzeit (de-DE). @param {string} iso @returns {string} */
function fmtDateOnly(iso){
  if(!iso) return '–';
  try{ return new Date(iso).toLocaleDateString('de-DE'); }catch(e){ return iso; }
}

/** Löst einen Browser-Download für den übergebenen Inhalt aus (Blob + temporärer <a>-Klick). @param {string} filename @param {string} content @param {string} mime @returns {void} */
function download(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

/** Kodiert einen ArrayBuffer als Base64-String (für Web-Crypto-Operationen). @param {ArrayBuffer} buf @returns {string} */
function bufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
/** Dekodiert einen Base64-String in einen ArrayBuffer (für Web-Crypto-Operationen). @param {string} b64 @returns {ArrayBuffer} */
function base64ToBuf(b64){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}
/** Leitet einen AES-GCM-Schlüssel aus einem Passwort ab (PBKDF2, Web Crypto API). @param {string} password @param {Uint8Array} saltBytes @returns {Promise<CryptoKey>} */
async function deriveAesKey(password, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: 250000, hash:'SHA-256'},
    keyMaterial,
    {name:'AES-GCM', length:256},
    false,
    ['encrypt','decrypt']
  );
}
/** Verschlüsselt einen JSON-String mit einem Passwort (AES-GCM, eigenes Salt/IV). Reine Funktion, kein STATE-Zugriff. @param {string} plaintextJson @param {string} password @returns {Promise<object>} */
async function encryptWorkbookJson(plaintextJson, password){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(password, salt);
  const ciphertext = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(plaintextJson));
  return {
    type:'bcm-workbook-encrypted', version:1,
    salt: bufToBase64(salt), iv: bufToBase64(iv), data: bufToBase64(ciphertext)
  };
}
/** Entschlüsselt ein mit encryptWorkbookJson() erzeugtes Payload; wirft bei falschem Passwort/beschädigter Datei. @param {object} payload @param {string} password @returns {Promise<string>} Entschlüsselter JSON-Text. */
async function decryptWorkbookJson(payload, password){
  if(!payload || payload.type!=='bcm-workbook-encrypted') throw new Error('Kein verschlüsseltes Workbook-Format.');
  const salt = new Uint8Array(base64ToBuf(payload.salt));
  const iv = new Uint8Array(base64ToBuf(payload.iv));
  const key = await deriveAesKey(password, salt);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, base64ToBuf(payload.data));
  return new TextDecoder().decode(plainBuf);
}

   4c) DATEIBASIERTE SPEICHERUNG (v1.3.0)
   File System Access API (Chrome/Edge). Fallback für andere Browser:
   bestehender localStorage-Mechanismus bleibt unverändert vollständig
   erhalten — es wird nichts weggenommen, nur ergänzt. Kein Server, keine
   Cloud, keine Datenbank: die "Datei" ist eine ganz normale lokale Datei,
   die der Nutzer selbst auswählt (z. B. auf einem Netzlaufwerk).
   --------------------------------------------------------------------- */
const FS_ACCESS_SUPPORTED = (typeof window!=='undefined') && ('showSaveFilePicker' in window) && ('showOpenFilePicker' in window);

/** Öffnet (oder erstellt) die IndexedDB-Datenbank zur Ablage des Datei-Handles. @returns {Promise<IDBDatabase>} */
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('Kein IndexedDB verfügbar.')); return; }
    const req = indexedDB.open('bcm_workbook_handles', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
/** Speichert das aktuelle FileSystemFileHandle in IndexedDB für die Wiederverbindung nach einem Neustart (best effort). @param {FileSystemFileHandle} handle @returns {Promise<void>} */
async function idbSetHandle(handle){
  try{
    const db = await idbOpen();
    await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, 'lastFile');
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  }catch(e){ /* rein optional, still ignorieren */ }
}
/** Liest das zuletzt gespeicherte FileSystemFileHandle aus IndexedDB (best effort). @returns {Promise<FileSystemFileHandle|null>} */
async function idbGetHandle(){
  try{
    const db = await idbOpen();
    return await new Promise((res,rej)=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get('lastFile');
      req.onsuccess = ()=>res(req.result||null);
      req.onerror = ()=>rej(req.error);
    });
  }catch(e){ return null; }
}
/** Entfernt das gespeicherte FileSystemFileHandle aus IndexedDB. @returns {Promise<void>} */
async function idbClearHandle(){
  try{
    const db = await idbOpen();
    await new Promise((res)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').delete('lastFile');
      tx.oncomplete = res; tx.onerror = res;
    });
  }catch(e){ /* ignorieren */ }
}

/** Schreibt den aktuellen Stand in die verknüpfte Datei; unterscheidet Erfolg, fehlende Berechtigung und sonstige Fehler in SAVE_STATUS.file. @returns {Promise<boolean>} true bei Erfolg. */
async function writeToLinkedFile(){
  if(!currentFileHandle){ SAVE_STATUS.file = 'disconnected'; return false; }
  try{
    const perm = await currentFileHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      // Ohne Nutzergeste kann die Berechtigung nicht automatisch angefragt werden.
      SAVE_STATUS.file = 'permission-required';
      if(!fileLinkLostWarned){
        fileLinkLostWarned = true;
        toast('Verknüpfung zur Datei "'+currentFileName+'" benötigt eine erneute Bestätigung. Bitte „Speichern" einmal manuell klicken.');
      }
      return false;
    }
    const writable = await currentFileHandle.createWritable();
    await writable.write(JSON.stringify(persistableSnapshot(), null, 2));
    await writable.close();
    fileLinkLostWarned = false;
    SAVE_STATUS.file = 'saved';
    SAVE_STATUS.lastFileSaveAt = new Date();
    SAVE_STATUS.lastError = null; // ein erneuter Erfolg setzt den Fehlerstatus zurück
    return true;
  }catch(e){
    SAVE_STATUS.file = 'error';
    SAVE_STATUS.lastError = 'Datei: '+(e&&e.message?e.message:'unbekannter Fehler');
    if(!fileLinkLostWarned){
      fileLinkLostWarned = true;
      toast('Datei "'+currentFileName+'" konnte nicht geschrieben werden (evtl. verschoben/gelöscht). Bitte „Speichern unter" verwenden.');
    }
    return false;
  }
}

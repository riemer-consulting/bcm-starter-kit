<style>
/* =========================================================================
   BCM STARTER KIT — DESIGN TOKENS
   Beratungsfähige, ruhige Optik: viel Weißraum, klare Karten, gedämpfte
   Akzentfarbe (vom Anwender wählbar), serifige Headlines für Autorität,
   serifenlose Brotschrift für Lesbarkeit in Formularen.
   ========================================================================= */
:root{
  --bg:#F5F6F9;
  --surface:#FFFFFF;
  --surface-soft:#FAFBFC;
  --ink:#15203A;
  --ink-soft:#5B6477;
  --ink-faint:#9097A8;
  --line:#E3E6EC;
  --line-strong:#CCD1DC;
  --accent:#2B5C8A;
  --accent-ink:#FFFFFF;
  --accent-soft:#EAF1F8;
  --ok:#2F7D54;
  --ok-bg:#E8F5EE;
  --warn:#B07F14;
  --warn-bg:#FBF1DD;
  --bad:#B23A33;
  --bad-bg:#FBEAE8;
  --radius:10px;
  --radius-lg:16px;
  --shadow:0 1px 2px rgba(21,32,58,.06), 0 4px 16px rgba(21,32,58,.05);
  --shadow-lift:0 8px 28px rgba(21,32,58,.12);
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'URW Palladio', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;color:var(--ink);}
a{color:var(--accent);}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:268px;flex:0 0 268px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
#view{padding:28px 32px 80px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- Brand header in sidebar ---------- */
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line);}
.brand-logo{
  height:38px;max-width:100%;object-fit:contain;object-position:left center;display:block;margin-bottom:10px;
}
.brand-name{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.25;}
.brand-sub{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

/* ---------- Nav ---------- */
nav.navlist{padding:14px 12px;flex:1;}
.navgroup{margin-bottom:18px;}
.navgroup-label{
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  padding:0 10px;margin-bottom:6px;font-weight:600;
}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;
  color:var(--ink-soft);font-size:13.5px;margin-bottom:1px;border:1px solid transparent;
}
.navitem:hover{background:var(--surface-soft);color:var(--ink);}
.navitem.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.navitem .ic{width:16px;text-align:center;flex:0 0 16px;opacity:.85;}
.navitem .count{margin-left:auto;font-size:11px;background:var(--line);color:var(--ink-soft);border-radius:20px;padding:1px 7px;}
.navitem.active .count{background:var(--accent);color:var(--accent-ink);}

.process-nav-item{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
.process-nav-item:hover{background:var(--surface-soft);}
.process-nav-item.active{background:var(--accent-soft);border-color:var(--accent-soft);}
.process-nav-title{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;}
.process-nav-meta{font-size:10.5px;color:var(--ink-faint);}
.rail{height:4px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;}
.rail > span{display:block;height:100%;}

.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-faint);line-height:1.5;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--ink-faint);background:var(--surface-soft);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.btn-primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);filter:brightness(1.08);}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-soft);}
.btn-danger{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg);}
.btn-danger:hover{background:#f6d9d6;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ---------- Cards & layout ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);}
.card + .card{margin-top:18px;}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px;}
.card-title{font-size:15px;font-weight:700;font-family:var(--font-display);}
.card-help{font-size:12px;color:var(--ink-faint);margin-top:2px;font-style:italic;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* ---------- Form elements ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.2px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field label .req{color:var(--bad);margin-left:2px;}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
input[type=text],input[type=number],input[type=date],input[type=url],textarea,select{
  width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;font-size:13.3px;
  font-family:inherit;color:var(--ink);background:var(--surface);
}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus,input[type=date]:focus,input[type=url]:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none;
}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
.field.empty input,.field.empty textarea,.field.empty select{border-color:#E8B9B5;background:#FFFBFA;}
input[type=color]{width:46px;height:32px;padding:2px;border:1px solid var(--line-strong);border-radius:7px;cursor:pointer;}
input[type=range]{width:100%;}

.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
.seg button{flex:1;border:none;background:var(--surface);padding:7px 8px;font-size:12.3px;font-weight:600;color:var(--ink-soft);cursor:pointer;border-right:1px solid var(--line-strong);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent);color:var(--accent-ink);}

/* ---------- Tags / badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.01em;}
.b-ok{background:var(--ok-bg);color:var(--ok);}
.b-warn{background:var(--warn-bg);color:var(--warn);}
.b-bad{background:var(--bad-bg);color:var(--bad);}
.b-neutral{background:var(--line);color:var(--ink-soft);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.dot-ok{background:var(--ok);} .dot-warn{background:var(--warn);} .dot-bad{background:var(--bad);} .dot-neutral{background:var(--ink-faint);}

/* ---------- Tabs (process detail) ---------- */
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tabbtn{padding:10px 14px;font-size:12.6px;font-weight:600;color:var(--ink-faint);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tabbtn:hover{color:var(--ink);}
.tabbtn.active{color:var(--accent);border-bottom-color:var(--accent);}

/* ---------- Stat tiles ---------- */
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);}
.stat-num{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;}
.stat-label{font-size:11.5px;color:var(--ink-faint);margin-top:8px;text-transform:uppercase;letter-spacing:.05em;}

/* ---------- Tables ---------- */
table.dtable{width:100%;border-collapse:collapse;font-size:13px;}
table.dtable th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);border-bottom:1px solid var(--line);padding:8px 10px;font-weight:700;}
table.dtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.dtable tr:last-child td{border-bottom:none;}
table.dtable tr:hover td{background:var(--surface-soft);}

/* ---------- Repeatable rows ---------- */
.rowcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--surface-soft);position:relative;}
.rowcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.row-del{color:var(--bad);background:none;border:none;cursor:pointer;font-size:12px;font-weight:600;}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:48px 20px;color:var(--ink-faint);}
.empty-state .ic{font-size:30px;margin-bottom:10px;}

/* ---------- Minimum-capability canvas ---------- */
.canvas3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.canvas-col{border-radius:12px;padding:14px;min-height:220px;}
.canvas-col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.canvas-col.must{background:var(--bad-bg);}
.canvas-col.reduced{background:var(--warn-bg);}
.canvas-col.wait{background:var(--ok-bg);}
.canvas-item{background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:12.6px;display:flex;justify-content:space-between;gap:6px;box-shadow:var(--shadow);}
@media (max-width:900px){.canvas3{grid-template-columns:1fr;}}

/* ---------- Flow diagram ---------- */
.flowwrap{overflow-x:auto;padding:8px 0;}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(21,32,58,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:26px;max-width:560px;width:100%;box-shadow:var(--shadow-lift);max-height:88vh;overflow-y:auto;}
.modal h3{margin-bottom:14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast-msg{background:var(--ink);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-size:12.8px;box-shadow:var(--shadow-lift);animation:tin .2s ease;}
@keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Privacy banner ---------- */
.privacy-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid #D5E3EF;border-radius:10px;padding:11px 14px;font-size:11.8px;color:var(--accent);margin-bottom:18px;}

/* ---------- GF / Workshop modes ---------- */
.gf-overlay,.workshop-overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;}
.gf-header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 32px;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.workshop-stage{max-width:900px;margin:0 auto;padding:60px 30px;text-align:center;}
.workshop-q{font-family:var(--font-display);font-size:30px;line-height:1.3;margin:18px 0 28px;}
.workshop-progress{font-size:13px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase;}
.workshop-answer{font-size:18px;text-align:left;min-height:140px;}
.workshop-nav{display:flex;justify-content:center;gap:12px;margin-top:30px;}

/* ---------- Startbildschirm / Nutzungsbedingungen-Gate ---------- */
.terms-gate{position:fixed;inset:0;background:rgba(21,32,58,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;}
.terms-gate-box{background:var(--surface);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lift);padding:30px 32px;}
.terms-gate-box h2{font-size:20px;margin-bottom:12px;}
.terms-gate-notice{background:var(--bad-bg);border:1px solid #F0C7C2;border-radius:10px;padding:14px 16px;font-size:12.8px;line-height:1.6;color:var(--ink);margin-bottom:16px;}
.terms-full{font-size:12.6px;line-height:1.7;}
.terms-full h3{font-size:13.5px;margin:18px 0 6px;font-family:var(--font-display);color:var(--accent);}
.terms-full p{margin:0 0 8px;}
.terms-full ul{margin:0 0 8px;padding-left:18px;}

/* ---------- Misc ---------- */
.muted{color:var(--ink-faint);}
.small{font-size:11.7px;}
.flexrow{display:flex;align-items:center;gap:10px;}
.spread{display:flex;align-items:center;justify-content:space-between;}
.hr{height:1px;background:var(--line);margin:18px 0;border:none;}
.kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px;}
.searchbox{position:relative;flex:1;max-width:340px;}
.searchbox input{padding-left:30px;}
.searchbox .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:13px;}
.dropdown-result{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.6px;}
.dropdown-result:hover{background:var(--surface-soft);}
.dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lift);max-height:340px;overflow-y:auto;z-index:30;}

/* ---------- Print ---------- */
#print-root{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-root,#print-root *{visibility:visible;}
  #print-root{display:block;position:absolute;left:0;top:0;width:100%;}
  .pp-page{page-break-after:always;padding:14mm;word-break:break-word;overflow-wrap:anywhere;}
  .pp-page:last-child{page-break-after:auto;}
  .pp-chrome-top{font-size:8.5px;color:#8a93a6;border-bottom:1px solid #e3e7ee;padding-bottom:4px;margin-bottom:10px;display:flex;justify-content:space-between;}
  .pp-chrome-bottom{font-size:8px;color:#a7adba;border-top:1px solid #e3e7ee;padding-top:4px;margin-top:16px;text-align:center;}
  .pp-cover{text-align:center;padding-top:90px;}
  .pp-cover img{max-height:70px;margin-bottom:30px;}
  .pp-cover h1{font-size:30px;margin-bottom:10px;}
  .pp-h2{font-size:19px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:0 0 14px;font-family:var(--font-display);}
  .pp-h3{font-size:14px;margin:18px 0 8px;font-family:var(--font-display);color:var(--accent);}
  .pp-meta{font-size:11px;color:#555;margin-top:24px;}
  .pp-field{margin-bottom:8px;font-size:11.5px;word-break:break-word;overflow-wrap:anywhere;}
  .pp-field b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#666;margin-bottom:2px;}
  .pp-table{width:100%;border-collapse:collapse;font-size:10.5px;word-break:break-word;overflow-wrap:anywhere;}
  .pp-table thead{display:table-header-group;}
  .pp-table tr{break-inside:avoid;}
  .pp-table th,.pp-table td{border:1px solid #ccc;padding:5px 7px;text-align:left;word-break:break-word;overflow-wrap:anywhere;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="print-root"></div>
<script>
/* =========================================================================
   BCM STARTER KIT — APPLICATION LOGIK
   Reine Vanilla-JS Single-Page-Application. Keine externen Abhängigkeiten,
   kein Build-Schritt, keine Cloud/kein Backend — eine einzelne portable
   HTML-Datei.

   ARCHITEKTURÜBERBLICK
   ---------------------
   Datenhaltung: ein zentrales, mutierbares STATE-Objekt (siehe defaultState()),
   persistiert per debounced autosave() in localStorage und optional
   zusätzlich in einer vom Nutzer verknüpften Datei (File System Access API,
   Abschnitt "Dateibasierte Speicherung"). STATE wird beim Start über
   loadState() gelesen, dabei automatisch durch migrateWorkbook() auf das
   aktuelle Schema (CURRENT_SCHEMA_VERSION) gebracht.

   STATE-Grundform (siehe defaultState()/newProcess()/newResource()/newMassnahme()
   für die vollständigen Feldlisten):
     STATE = {
       schemaVersion: number,
       meta: { kundenname, logo*, accent, bearbeitungsstand, version,
               vertraulichkeit, releaseWarningAcceptances[] },
       processes: [ { id, steckbrief, sixty, bia, minfaehigkeit, notbetrieb,
                      resilienz[], dependencies[], createdAt } ],
       resources: [ { id, name, kategorie, kritikalitaet, prozesse[],
                      alternative, recoveryRequirement, singlePointOfFailure, ... } ],
       massnahmen: [ { id, titel, prozessId, kategorie, prioritaet, aufwand,
                       status, entscheidungsbedarf, wirksamkeitGeprueftAm, ... } ],
       versions: [ { nr, datum, bearbeiter, notiz, snapshot(JSON-String),
                     source, appVersion, schemaVersion, checksum } ],
       ui: { route, processId, processTab }  // NICHT persistiert
     }

   Rendering: reine HTML-String-Erzeugung, render() ersetzt #app komplett bei
   jeder zustandsändernden Aktion (kein Virtual DOM, kein Diffing). Routing
   über STATE.ui.route/processId/processTab. Sicherheit: escapeHtml()/
   safeJsString()/safeUrl() an jeder Stelle, an der nutzerdefinierte oder
   importierte Werte in HTML-Strings eingebettet werden (siehe Abschnitt
   "P6: Sichere DOM-Ausgabe" für Details und bekannte Grenzen).

   Schema-Migration: SCHEMA_MIGRATIONS registriert je Version N eine
   Funktion N->N+1; migrateWorkbook() verkettet diese bis
   CURRENT_SCHEMA_VERSION und lehnt neuere, unbekannte Schemas ab, statt sie
   blind zu öffnen. Jede Migration ist rein additiv (ergänzt fehlende
   Felder, verändert/löscht nie Bestehendes).

   Öffentliche Einstiegspunkte: das globale `App`-Objekt (unten definiert)
   ist die vollständige Schnittstelle zwischen der generierten HTML/UI und
   der Anwendungslogik — jede onclick/onchange-Aktion im UI ruft eine
   App.*-Methode auf. Reine Berechnungs-/Render-Funktionen (z. B.
   biaScore(), timePlausibility(), releaseReadinessCheck()) stehen als
   normale Top-Level-Funktionen daneben.

/** Fallback-UUID-Erzeugung über crypto.getRandomValues, falls crypto.randomUUID fehlt. @returns {string} UUID v4 */
function fallbackSecureUuid(){
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  bytes[6] = (bytes[6] & 0x0f) | 0x40; // Version 4
  bytes[8] = (bytes[8] & 0x3f) | 0x80; // Variant
  const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
  return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);
}
/** Erzeugt eine kryptografisch belastbare, präfigierte ID (crypto.randomUUID, Fallback über crypto.getRandomValues). @param {string} prefix @returns {string} */
function uid(prefix){
  prefix = prefix || 'id';
  const value = (typeof crypto!=='undefined' && typeof crypto.randomUUID==='function')
    ? crypto.randomUUID()
    : fallbackSecureUuid();
  return prefix + '_' + value;
}

/* ---------------------------------------------------------------------
   2b) SCHEMA-VERSIONIERUNG & MIGRATION (v1.4.0, P2)
   Getrennt von APP_VERSION (Software-Version) — beschreibt die Form der
   gespeicherten Daten. Dateien ohne schemaVersion gelten als Schema 1.
   --------------------------------------------------------------------- */
const CURRENT_SCHEMA_VERSION = 11;

/** Schema-Migration 1->2: ergänzt Versions-Nachvollziehbarkeitsfelder und Resilienz-Empfehlungstexte. @param {object} data Rohdaten vor der Migration. @returns {{data:object, warnings:string[]}} */
function migrateV1ToV2(data){
  const d = JSON.parse(JSON.stringify(data)); // Original nie mutieren
  let fieldsAdded = 0;
  (d.versions||[]).forEach(v=>{
    if(v.source===undefined){ v.source = 'legacy'; fieldsAdded++; }
    if(v.appVersion===undefined){ v.appVersion = null; fieldsAdded++; }
    if(v.schemaVersion===undefined){ v.schemaVersion = 1; fieldsAdded++; }
    if(v.checksum===undefined){ v.checksum = null; fieldsAdded++; } // -> "historisch, ungeprüft"
  });
  (d.processes||[]).forEach(p=>{
    (p.resilienz||[]).forEach(item=>{
      if(item.empfehlung===undefined){ item.empfehlung=''; fieldsAdded++; }
    });
  });
  d.schemaVersion = 2;
  return { data: d, warnings: fieldsAdded>0 ? [fieldsAdded+' fehlende Felder wurden beim Wechsel von Schema 1 auf Schema 2 ergänzt.'] : [] };
}

/* v1.5.0 (P9): versucht, einen freien Zeitwert-Text eindeutig in {wert,einheit}
   zu zerlegen. Nur bei eindeutigem Muster — sonst null (Aufrufer legt den
   Text dann konservativ in legacyText ab, statt zu raten). */
/** Zerlegt einen Freitext-Zeitwert in {wert,einheit}, NUR bei eindeutiger, explizit genannter Einheit (siehe v1.5.1-Fix 1). @param {string} text @returns {{wert:number, einheit:string}|null} null, wenn nicht eindeutig auswertbar. */
function parseStructuredDuration(text){
  if(text===undefined || text===null) return null;
  const str = String(text).trim();
  if(str==='') return null;
  const match = str.match(/^(\d+(?:[.,]\d+)?)\s*(minuten?|min|stunden?|std\.?|h|tage?|t|wochen?|w)$/i); // Einheit jetzt zwingend
  if(!match) return null;
  const num = parseFloat(match[1].replace(',', '.'));
  if(isNaN(num)) return null;
  const unitRaw = match[2].toLowerCase().replace(/\.$/, '');
  let einheit;
  if(/^(min|minuten?)$/.test(unitRaw)) einheit = 'Minuten';
  else if(/^(t|tage?)$/.test(unitRaw)) einheit = 'Tage';
  else if(/^(w|wochen?)$/.test(unitRaw)) einheit = 'Wochen';
  else einheit = 'Stunden'; // deckt std/stunden/stunde/h ab (Einheit war hier bereits vorhanden, nur die genaue Schreibweise wird normalisiert)
  return { wert: num, einheit };
}
/** Wandelt einen alten RTO/RPO-Freitextwert in das strukturierte Feld um; unklare Werte bleiben als legacyText erhalten. @param {*} oldValue @returns {{wert:(number|string), einheit:string, legacyText:string}} */
function structureLegacyTimeValue(oldValue){
  const parsed = parseStructuredDuration(oldValue);
  if(parsed) return { wert: parsed.wert, einheit: parsed.einheit, legacyText: '' };
  return { wert: '', einheit: 'Stunden', legacyText: (oldValue!==undefined && oldValue!==null) ? String(oldValue) : '' };
}
/** Schema-Migration 2->3: wandelt RTO/RPO von Freitext in {wert,einheit,legacyText}, siehe structureLegacyTimeValue(). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV2ToV3(data){
  const d = JSON.parse(JSON.stringify(data));
  let convertedCount = 0, unclearCount = 0;
  (d.processes||[]).forEach(p=>{
    if(!p.steckbrief) return;
    ['rto','rpo'].forEach(field=>{
      const old = p.steckbrief[field];
      if(old && typeof old==='object' && 'wert' in old) return; // schon strukturiert (defensiv)
      const structured = structureLegacyTimeValue(old);
      p.steckbrief[field] = structured;
      if(structured.legacyText) unclearCount++;
      else if(structured.wert!=='') convertedCount++;
    });
  });
  d.schemaVersion = 3;
  const warnings = [];
  if(convertedCount>0) warnings.push(convertedCount+' RTO/RPO-Freitextwerte wurden automatisch in das neue strukturierte Format (Zahl + Einheit) übernommen.');
  if(unclearCount>0) warnings.push(unclearCount+' RTO/RPO-Werte waren nicht eindeutig interpretierbar und wurden als Freitext hinterlegt — bitte im jeweiligen Prozess-Steckbrief manuell prüfen und neu erfassen.');
  return { data: d, warnings };
}

/* Registry: Schema N -> Migrationsfunktion von N auf N+1 */
/** Schema-Migration 3->4: ergänzt kritikalitaetAbweichungBegruendung (P10) und dependencies[] (P11) bei bestehenden Prozessen. @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV3ToV4(data){
  const d = JSON.parse(JSON.stringify(data));
  let fieldsAdded = 0;
  (d.processes||[]).forEach(p=>{
    if(p.steckbrief && p.steckbrief.kritikalitaetAbweichungBegruendung===undefined){
      p.steckbrief.kritikalitaetAbweichungBegruendung = '';
      fieldsAdded++;
    }
    if(!Array.isArray(p.dependencies)){
      p.dependencies = [];
      fieldsAdded++;
    }
  });
  d.schemaVersion = 4;
  return { data: d, warnings: fieldsAdded>0 ? [fieldsAdded+' fehlende Felder wurden beim Wechsel von Schema 3 auf Schema 4 ergänzt.'] : [] };
}

/** Schema-Migration 4->5: ergänzt die erweiterten Ressourcenfelder aus P12 (owner, provider, recoveryRequirement, SPOF-Flag usw.). @param {object} data @returns {{data:object, warnings:string[]}} */
function migrateV4ToV5(data){
  const d = JSON.parse(JSON.stringify(data));
  let fieldsAdded = 0;
  (d.resources||[]).forEach(r=>{
    const template = { owner:'', provider:'', recoveryRequirement:{wert:'',einheit:'Stunden'}, availabilityRequirement:'', fallbackTestedAt:'', fallbackTestResult:'', singlePointOfFailure:false, dataClassification:'', personalData:false };
    Object.keys(template).forEach(k=>{
      if(r[k]===undefined){ r[k] = template[k]; fieldsAdded++; }
    });
  });
  d.schemaVersion = 5;
  return { data: d, warnings: fieldsAdded>0 ? [fieldsAdded+' fehlende Ressourcenfelder wurden beim Wechsel von Schema 4 auf Schema 5 ergänzt.'] : [] };
}
